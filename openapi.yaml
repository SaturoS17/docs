  /v1/balances:
    get:
      tags:
      - Balances
      operationId: getBalances
      summary: Get balances
      description: The four independent virtual balances of the calling account (USDT — the operating
        currency —, USDC, BTC and GOLD in grams of fine gold). Every supported asset is always present,
        with zeros if the account has not used that currency yet. If the account uses Banking, its BANK_USD/BANK_EUR
        mirror balances are also listed with the `custody` marker set to `banking` (the authoritative
        balance lives at the bank; these balances are not spendable inside the platform).
      responses:
        '200':
          description: Balances of the calling account (one per supported asset).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancesResponse'
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                balances:
                - asset: USDT
                  available: '125.430000'
                  held: '10.000000'
                  updated_at: '2026-07-07T12:00:00Z'
                - asset: USDC
                  available: '50.000000'
                  held: '0.000000'
                  updated_at: '2026-07-08T09:00:00Z'
                - asset: BTC
                  available: '0.00060000'
                  held: '0.00000000'
                - asset: GOLD
                  available: '12.500000'
                  held: '0.000000'
                - asset: BANK_USD
                  available: '7500.00'
                  held: '0.00'
                  custody: banking
                  updated_at: '2026-07-08T09:00:00Z'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/balances/history:
    get:
      tags:
      - Balances
      operationId: getBalancesHistory
      summary: Get balance history
      description: 'Daily evolution of the account''s balances for dashboard charts: one series per asset
        (the closing available balance of each day, carried forward on days without movements) plus an
        aggregated USD series that values BTC/GOLD at each day''s historical reference price. Includes
        the period''s total inflows/outflows and the current snapshot (available + held), so a front can
        render a Mercury-style balance card with its percentage change. The series tracks the **available**
        balance (holds have no history); `current` carries today''s `held` per asset. Days valued with
        today''s spot price (before historical prices exist) are disclosed in `spot_priced_dates` — values
        are never invented.


        The `assets` map also includes the banking account mirrors (`BANK_USD`, `BANK_EUR`) as their own
        series in their own currency (2 decimals). They are **not** part of the `total_usd` aggregate,
        which only covers the operational balances (USDT, USDC, BTC, GOLD).

        '
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Start date (YYYY-MM-DD, UTC, inclusive).
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: End date (YYYY-MM-DD, UTC, inclusive). Max range 366 days.
      responses:
        '200':
          description: Daily balance series per asset plus USD aggregate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  from:
                    type: string
                  to:
                    type: string
                  granularity:
                    type: string
                    example: day
                  timezone:
                    type: string
                    example: UTC
                  assets:
                    type: object
                    description: 'One daily closing-balance series per asset. Includes the operational
                      balances (USDT, USDC, BTC, GOLD) and the banking account mirrors (BANK_USD, BANK_EUR)
                      in their own currency; the banking series are excluded from `total_usd`.

                      '
                    additionalProperties:
                      type: object
                      properties:
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                example: '2026-07-10'
                              balance:
                                type: string
                                example: '125.430000'
                        first:
                          type: string
                        last:
                          type: string
                        change_pct:
                          type: string
                          nullable: true
                          description: Signed percentage change first→last (null when the series starts
                            at zero).
                  total_usd:
                    type: object
                    description: Aggregated USD value of all balances per day.
                    properties:
                      series:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            balance_usd:
                              type: string
                      first:
                        type: string
                      last:
                        type: string
                      change_pct:
                        type: string
                        nullable: true
                      spot_priced_dates:
                        type: array
                        items:
                          type: string
                        description: Days valued with today's spot price because no historical price existed.
                      unpriced_assets:
                        type: array
                        items:
                          type: string
                        description: Assets excluded from the USD aggregate for lack of any price.
                  period:
                    type: object
                    description: Total inflows/outflows of the period in USD.
                    properties:
                      in_usd:
                        type: string
                      out_usd:
                        type: string
                      net_usd:
                        type: string
                  current:
                    type: object
                    description: Current snapshot (available + held, valued at spot).
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            asset:
                              type: string
                            available:
                              type: string
                            held:
                              type: string
                            usd_estimate:
                              type: string
                              nullable: true
                      net_worth_usd_estimate:
                        type: string
                        nullable: true
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                from: '2026-06-12'
                to: '2026-07-11'
                granularity: day
                timezone: UTC
                assets:
                  USDT:
                    series:
                    - date: '2026-06-12'
                      balance: '100.000000'
                    - date: '2026-06-13'
                      balance: '100.000000'
                    - date: '2026-07-11'
                      balance: '125.430000'
                    first: '100.000000'
                    last: '125.430000'
                    change_pct: '25.43'
                  BTC:
                    series:
                    - date: '2026-06-12'
                      balance: '0.00060000'
                    - date: '2026-07-11'
                      balance: '0.00060000'
                    first: '0.00060000'
                    last: '0.00060000'
                    change_pct: '0.00'
                  BANK_USD:
                    series:
                    - date: '2026-06-12'
                      balance: '1500.00'
                    - date: '2026-07-11'
                      balance: '1725.50'
                    first: '1500.00'
                    last: '1725.50'
                    change_pct: '15.03'
                total_usd:
                  series:
                  - date: '2026-06-12'
                    balance_usd: '163.73'
                  - date: '2026-07-11'
                    balance_usd: '191.34'
                  first: '163.73'
                  last: '191.34'
                  change_pct: '16.86'
                  spot_priced_dates: []
                  unpriced_assets: []
                period:
                  in_usd: '280.20'
                  out_usd: '254.77'
                  net_usd: '25.43'
                current:
                  items:
                  - asset: USDT
                    available: '125.430000'
                    held: '10.000000'
                    usd_estimate: '135.43'
                  - asset: USDC
                    available: '0.000000'
                    held: '0.000000'
                    usd_estimate: '0.00'
                  - asset: BTC
                    available: '0.00060000'
                    held: '0.00000000'
                    usd_estimate: '65.91'
                  - asset: GOLD
                    available: '0.000000'
                    held: '0.000000'
                    usd_estimate: '0.00'
                  net_worth_usd_estimate: '201.34'
        '400':
          description: Missing or invalid date range (`invalid_range`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_range
                message: from and to are required (YYYY-MM-DD)
        '403':
          $ref: '#/components/responses/AccountRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/movements:
