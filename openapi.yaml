  /v1/kyc:
    post:
      tags:
      - KYC
      operationId: submitKyc
      summary: Submit KYC screening
      description: 'Screens the calling account (person or company, detected from the

        payload) against the compliance service. If a compliance fee is

        configured, it is debited before the call and refunded if the

        screening fails. The response includes the screening result plus

        `kyc_status`, `compliance_service` and `compliance_fee`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  type: object
                  description: 'Identity data. Provide `person` or `company`; when omitted

                    it is filled from the account profile.

                    '
                  properties:
                    person:
                      type: object
                      properties:
                        full_name:
                          type: string
                    company:
                      type: object
                      properties:
                        legal_name:
                          type: string
                    email:
                      type: string
                    country:
                      type: string
                monitor:
                  type: boolean
                  default: false
                  description: Enable continuous monitoring from the start.
            example:
              customer:
                person:
                  full_name: Ana Perez Rojas
                email: ana@example.com
                country: CL
              monitor: false
      responses:
        '201':
          description: Screening submitted; account KYC status set to `pending`.
          content:
            application/json:
              schema:
                type: object
                description: Screening result (pass-through) plus billing fields.
                properties:
                  kyc_status:
                    type: string
                    example: pending
                  compliance_service:
                    type: string
                    enum:
                    - compliance_person
                    - compliance_company
                  compliance_fee:
                    type: string
                    example: '0.000000'
              example:
                customer_id: e1d2c3b4-a596-8778-695a-4b3c2d1e0f9a
                status: completed
                risk_level: low
                screening_result: no_hits
                monitored: false
                deduplicated: false
                kyc_status: pending
                compliance_service: compliance_person
                compliance_fee: '2.000000'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '502':
          description: Screening temporarily unavailable (`compliance_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: compliance_unavailable
                message: screening temporarily unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/kyc/rescreen:
    post:
      tags:
      - KYC
      operationId: rescreenKyc
      summary: Re-run KYC screening
      description: 'Re-runs the account''s screening. Requires a prior KYC submission.

        Bills the `compliance_rescreen` fee if configured; refunded on

        upstream failure.

        '
      responses:
        '200':
          description: Rescreen result plus billing fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  compliance_service:
