    patch:
      tags:
      - Cards
      operationId: updateCard
      summary: Update limits, spending asset or freeze/unfreeze
      description: Updates the card's spending limits (send "0" to remove a limit), changes the balance
        it spends from (`spending_asset`, future purchases only) and freezes or unfreezes it. Frozen cards
        decline every authorization instantly.
      parameters:
      - $ref: '#/components/parameters/cardID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                frozen:
                  type: boolean
                spending_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: New spending balance. Only affects future purchases; in-flight authorizations
                    keep (and refund to) the asset they debited.
                limits:
                  type: object
                  properties:
                    per_transaction:
                      type: string
                    daily:
                      type: string
                    monthly:
                      type: string
            examples:
              freeze:
                summary: Freeze the card
                value:
                  frozen: true
              set_spending_asset:
                summary: Spend from the USDC balance
                value:
                  spending_asset: USDC
              set_limits:
                summary: Update limits
                value:
                  limits:
                    per_transaction: '200.00'
                    daily: '0'
      responses:
        '200':
          description: Updated card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject'
              example:
                card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                physical: false
                cardholder_kind: account
                status: frozen
                spending_asset: USDC
                limits:
                  per_transaction: '200.000000'
                created_at: '2026-07-08T12:00:00Z'
                updated_at: '2026-07-08T13:00:00Z'
        '400':
          description: invalid_amount / spending_asset_unavailable / settlement_asset_disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_amount:
                  value:
                    error: invalid_amount
                    message: limits must be positive decimal strings (or "0" to remove)
                spending_asset_unavailable:
                  value:
                    error: spending_asset_unavailable
                    message: this asset is not available for card purchases
        '409':
          description: card_cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: card_cancelled
                message: a cancelled card cannot be updated
        '404':
          $ref: '#/components/responses/NotFound'
