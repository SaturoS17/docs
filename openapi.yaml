  /v1/reports/statement:
    get:
      tags:
      - Balances
      operationId: getAccountStatement
      summary: Account statement (JSON, PDF or Excel)
      description: 'Consolidates every movement of the period — payouts, payins, crypto deposits and withdrawals,
        internal transfers and service charges — into one auditable statement with an exact reconciliation:
        opening_balance + total_in − total_out = closing_balance, verified against the ledger (`balanced`).
        The summary and movements cover the USDT operating balance; every other virtual balance (USDC,
        BTC, GOLD) with activity reconciles independently inside `assets`. Request `format=pdf` or
        `format=xlsx` to download the CBPay-branded file (Content-Disposition: attachment).'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Start date (YYYY-MM-DD, UTC, inclusive).
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: 'End date (YYYY-MM-DD, UTC, inclusive). Max range: 400 days.'
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - pdf
          - xlsx
          default: json
        description: json for the web view; pdf/xlsx download the branded file.
      - name: lang
        in: query
        schema:
          type: string
          enum:
          - es
          - en
          default: es
        description: Language of the PDF/Excel output.
