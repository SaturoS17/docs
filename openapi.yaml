  /v1/screenings/addresses:
    post:
      tags:
      - Wallet screening
      operationId: createAddressScreening
      summary: Screen a blockchain address
      description: 'Assesses the AML risk of a blockchain address (sanctioned entity, illicit-fund exposure)
        against global on-chain intelligence and returns a normalized risk level (Low/Medium/High/Severe)
        with the full evidence. Network-agnostic: the address is evaluated across every supported chain
        at once; `chain` only labels your record. Bills the fixed `address_screening` fee (refunded automatically
        if the screening fails), so `idempotency_key` is required — replaying with the same key returns
        the original screening with `idempotency_hit: true` and never charges twice. Requires the `screenings`
        service enabled and an approved account verification.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - address
              - idempotency_key
              properties:
                address:
                  type: string
                  description: Blockchain address to screen (max 128 characters).
                chain:
                  type: string
                  description: Optional label (tron, eth, ...) for your record; it does not restrict the
                    assessment.
                idempotency_key:
                  type: string
                  description: Required (the scan charges a fee). Also accepted as the Idempotency-Key
                    header.
            example:
              address: TN2BBWc9EF8MMB6i1c4HZHXAssTEXstMDo
              chain: tron
              idempotency_key: scan-customer-742-1
      responses:
        '201':
          description: Screening executed and stored.
          content:
            application/json:
              examples:
                low_risk:
                  summary: Clean address
                  value:
                    screening_id: 5f0b1c9a-2f3e-4a7b-9c1d-8e6f5a4b3c2d
                    address: TN2BBWc9EF8MMB6i1c4HZHXAssTEXstMDo
                    chain: tron
                    risk: Low
                    screening_fee: '0.500000'
                    fee_asset: USDT
                    idempotency_key: scan-customer-742-1
                    created_at: '2026-07-12T14:30:00Z'
                    assessment:
                      address: TN2BBWc9EF8MMB6i1c4HZHXAssTEXstMDo
                      risk: Low
                      address_identifications: []
                      exposures:
                      - category: exchange
                        value_usd: '1250.75'
                      triggers: []
                severe_risk:
                  summary: Sanctioned address
                  value:
                    screening_id: 7a2c4e6f-8b1d-4c3a-9e5f-1a2b3c4d5e6f
                    address: '0x098B716B8Aaf21512996dC57EB0615e2383E2f96'
                    chain: eth
                    risk: Severe
                    risk_reason: Identified as Sanctioned Entity
                    screening_fee: '0.500000'
                    fee_asset: USDT
                    idempotency_key: scan-suspicious-9
                    created_at: '2026-07-12T14:31:00Z'
                    assessment:
                      address: '0x098B716B8Aaf21512996dC57EB0615e2383E2f96'
                      risk: Severe
                      risk_reason: Identified as Sanctioned Entity
                      cluster_name: OFAC SDN Ronin Bridge Exploiter
                      cluster_category: sanctioned entity
                      address_identifications:
                      - name: 'SANCTIONS: OFAC SDN Ronin Bridge Exploiter'
                        category: sanctioned entity
                      exposures: []
                      triggers: []
        '200':
          description: Idempotent replay — returns the original screening without charging again.
          content:
            application/json:
              example:
                screening_id: 5f0b1c9a-2f3e-4a7b-9c1d-8e6f5a4b3c2d
                address: TN2BBWc9EF8MMB6i1c4HZHXAssTEXstMDo
                chain: tron
                risk: Low
                screening_fee: '0.500000'
                fee_asset: USDT
                idempotency_key: scan-customer-742-1
                created_at: '2026-07-12T14:30:00Z'
                idempotency_hit: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The address could not be screened (check the format).
          content:
            application/json:
              example:
                error: invalid_address
                message: the address could not be screened (check the format)
        '502':
          description: Screening temporarily unavailable (the fee was refunded). Retry with the SAME key.
          content:
            application/json:
              example:
                error: screening_unavailable
                message: address screening temporarily unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
