  /v1/payins:
    post:
      tags:
      - Payins
      operationId: createPayin
      summary: Create a payin (top-up charge)
      description: 'Creates an active fiat charge (e.g. a QR) through the processing core.

        When the payment arrives, the account is credited automatically in

        USDT (gross at FX rate, minus the payin fee) and the

        `payin_credited` webhook fires.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              - currency
              - amount
              properties:
                country:
                  type: string
                  example: BO
                currency:
                  type: string
                  example: BOB
                amount:
                  type: string
                  description: Local currency amount as a positive decimal string.
                description:
                  type: string
                channel:
                  type: string
                  description: Optional channel hint passed to the core.
                expires_in:
                  type: integer
                  description: Charge expiration in seconds.
            example:
              country: BO
              currency: BOB
              amount: '700.00'
              description: App top-up
              expires_in: 3600
      responses:
        '201':
          description: Charge created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: pending
                  charge:
                    type: object
                    description: Charge details (QR data, references) from the core.
              example:
                payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
                status: pending
                charge:
                  charge_id: c9d8e7f6-a5b4-c3d2-e1f0-a9b8c7d6e5f4
                  our_reference: QR-778812
                  qr_image: data:image/png;base64,iVBORw0KGgoâ€¦
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '422':
          description: The core rejected the charge (`core_rejected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: core_rejected
                message: amount is below the minimum for this corridor
        '502':
          description: Core unavailable (`core_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: core_unavailable
                message: could not create the charge
        '401':
          $ref: '#/components/responses/Unauthorized'
