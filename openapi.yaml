webhooks:
  payin_credited:
    post:
      summary: Payin credited
      description: 'A fiat collection was received and credited to the account in USDT.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payin_id: &id015
                  type: string
                account_id: *id015
                country: *id015
                currency: *id015
                local_amount: *id015
                fx_rate: *id015
                usdt_credited: *id015
                fee: *id015
            example:
              payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              country: BO
              currency: BOB
              local_amount: '700.00'
              fx_rate: '6.91'
              usdt_credited: '100.302460'
              fee: '1.000000'
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  payout_status_changed:
    post:
      summary: Payout status changed
      description: 'A payout reached a new state (processing, completed or failed).


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
