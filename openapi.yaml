  /v1/transfers:
    post:
      tags:
      - Transfers
      operationId: createTransfer
      summary: Create an internal transfer
      description: 'Moves balance between two CBPay accounts, atomically and always free of charge — any
        combination works: person to person, person to company, company to person or company to company.
        Works with the four virtual balances (`USDT` default, `USDC`, `BTC`, `GOLD`) and always between
        balances of the **same currency** (no conversion). The destination is resolved by `to_account_id`
        or `to_email`. The recipient''s webhook subscribers receive `transfer_received`.'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                to_account_id:
                  type: string
                  format: uuid
                to_email:
                  type: string
                  format: email
                asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  default: USDT
                  description: Balance currency to move; the destination receives in this same currency.
                amount:
                  type: string
                  description: Positive decimal string, up to the currency's decimals (6 for USDT/USDC/GOLD,
                    8 for BTC).
                  example: '10.500000'
                description:
                  type: string
                idempotency_key:
                  type: string
            examples:
              by_email:
                summary: Person → person, by email
                value:
                  to_email: carlos@example.com
                  amount: '25.000000'
                  description: Expense split
                  idempotency_key: split-2026-07-06-a
              by_account_id:
                summary: Person → company, by account_id
                value:
                  to_account_id: ae8cf540-22a9-414d-82cc-8ac04732be4f
                  amount: '120.500000'
                  description: Monthly service payment
                  idempotency_key: serv-2026-07-a
              payroll:
                summary: Company → person (payroll)
                value:
                  to_email: employee@example.com
                  amount: '850.000000'
                  description: July salary
                  idempotency_key: payroll-2026-07-emp01
              gold:
                summary: In another currency (GOLD, grams of gold)
                value:
                  to_email: carlos@example.com
                  asset: GOLD
                  amount: '2.500000'
                  description: Gold gift
                  idempotency_key: gold-2026-07-09-a
      responses:
        '201':
          description: Transfer completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              example:
                transfer_id: 2a7b9c1d-4e5f-6a70-8b9c-0d1e2f3a4b5c
                from_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                to_account_id: 5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b
                asset: USDT
                amount: '25.000000'
                description: Expense split
                status: completed
                created_at: '2026-07-07T12:00:00Z'
        '200':
          description: Idempotency replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              example:
                transfer_id: 2a7b9c1d-4e5f-6a70-8b9c-0d1e2f3a4b5c
                from_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                to_account_id: 5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b
                asset: USDT
                amount: '25.000000'
                description: Expense split
                status: completed
                created_at: '2026-07-07T12:00:00Z'
                idempotency_hit: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '404':
          description: Destination not found (`recipient_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: recipient_not_found
                message: no account matches that email
        '422':
          description: Destination cannot receive transfers (`recipient_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: recipient_unavailable
                message: destination account cannot receive transfers
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
