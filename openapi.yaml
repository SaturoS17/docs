        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/webhooks/subscriptions:
    post:
      tags:
      - Webhooks
      operationId: createWebhookSubscription
      summary: Create a webhook subscription
      description: 'Subscribes an HTTPS callback to the calling account''s events.


        Deliveries are signed: `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`
        with the timestamp in `X-Webhook-Timestamp`. Up to 5 attempts with incremental backoff.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - event_type
              - callback_url
              - secret
              properties:
                event_type:
                  type: string
                  enum:
                  - payin_credited
                  - payout_status_changed
                  - transfer_received
                  - crypto_deposit_credited
                  - crypto_withdrawal_status_changed
                  - '*'
                callback_url:
                  type: string
                  format: uri
                  description: HTTPS only; localhost and private IPs are rejected.
                secret:
                  type: string
                  minLength: 16
            example:
              event_type: payout_status_changed
              callback_url: https://api.myapp.com/webhooks/cbpay
              secret: a-strong-shared-secret-123
      responses:
        '201':
          description: Subscription created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  event_type:
                    type: string
                  callback_url:
                    type: string
                  status:
                    type: string
                    example: active
                  created_at:
                    type: string
                    format: date-time
                  secret_stored:
                    type: boolean
              example:
                id: 8e7f6a5b-4c3d-2e1f-0a9b-8c7d6e5f4a3b
                event_type: payout_status_changed
                callback_url: https://api.myapp.com/webhooks/cbpay
                status: active
                created_at: '2026-07-07T12:00:00Z'
                secret_stored: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /healthz:
    get:
      tags:
      - Status
      security: []
      operationId: healthz
      summary: Service health
      description: Public liveness check of the API and its database.
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              example:
                status: ok
        '503':
          description: Database not reachable (`store_unavailable`).
          content:
            application/json:
              schema: &id008
                $ref: '#/components/schemas/Error'
              example:
                error: store_unavailable
                message: database not reachable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Session JWT (from register/login) or API key (`pk_...`).

        `X-API-Key: <token>` is accepted as an alternative header.

        '
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    pageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Alternative to the `idempotency_key` body field.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request (see `error` code for the specific validation).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_json
            message: 'request body is not valid JSON: unknown field'
    InsufficientFunds:
      description: Account balance is not enough for this operation (`insufficient_funds`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: insufficient_funds
            message: account balance is not enough for this operation
    AccountRequired:
      description: This endpoint requires an account credential (`account_required`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: account_required
            message: this endpoint requires an account credential
    Forbidden:
      description: Credential level not allowed for this endpoint (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
            message: credentials required
    NotFound:
      description: Resource not found (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: resource not found
    Unauthorized:
      description: Missing or invalid credential (`unauthorized`).
      content:
        application/json:
          schema: *id008
          example:
            error: unauthorized
            message: invalid or missing credentials
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code (snake_case).
          example: insufficient_funds
        message:
          type: string
          description: Human-readable explanation.
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - person
          - company
        status:
          type: string
          enum:
          - active
          - blocked
          - closed
        kyc_status:
          type: string
          enum:
          - none
          - pending
          - approved
          - rejected
        email:
          type: string
        display_name:
          type: string
        tax_id:
          type: string
        phone:
          type: string
        country:
          type: string
        profile:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
          - owner
          - operator
          - viewer
        status:
          type: string
          enum:
          - active
          - disabled
        created_at:
          type: string
          format: date-time
    ApiKeyIssued:
      type: object
      properties:
        api_key_id:
          type: string
          format: uuid
        key_id:
          type: string
        token:
          type: string
          description: Plaintext key (`pk_...`). Shown exactly once.
        label:
          type: string
        note:
          type: string
    BalancesResponse:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        balances:
          type: array
          items:
            type: object
            properties:
              asset:
                type: string
                example: USDT
              available:
                type: string
                example: '100.000000'
              held:
                type: string
                description: Reserved by in-flight payouts/withdrawals.
                example: '5.000000'
              updated_at:
                type: string
                format: date-time
    MovementsResponse:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        page:
          type: integer
        page_size:
          type: integer
        movements:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              asset:
                type: string
              amount:
                type: string
                description: Signed; negative debits, positive credits.
              type:
                type: string
                description: Ledger entry type.
              reference_type:
                type: string
              reference_id:
                type: string
              description:
                type: string
              balance_after:
                type: string
              created_at:
                type: string
                format: date-time
    FeeConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        account_id:
          type: string
          description: Empty when the fee is a CBPay default (not an account override).
        service:
          type: string
          enum:
          - payout
          - payin
          - funding
          - withdrawal
          - compliance_person
          - compliance_company
          - compliance_rescreen
          - compliance_transaction
          - compliance_monitoring
        country:
          type: string
        asset:
          type: string
          example: USDT
        percent:
          type: string
          example: '1.5'
        fixed_amount:
          type: string
          example: '0.30'
        status:
          type: string
          example: active
        updated_at:
          type: string
          format: date-time
    Payout:
      type: object
      properties:
        payout_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        country:
          type: string
        currency:
          type: string
        method:
          type: string
        local_amount:
          type: string
        fx_rate:
          type: string
          description: Local units per 1 USD at execution time.
        usdt_amount:
          type: string
        fee:
          type: string
        total_debit:
          type: string
        beneficiary:
          type: object
        description:
          type: string
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        status_code:
          type: string
        status_message:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        idempotency_hit:
          type: boolean
          description: Present (true) when the response is an idempotent replay.
    Payin:
      type: object
      properties:
        payin_id:
          type: string
          format: uuid
        account_id:
          type: string
        kind:
          type: string
          enum:
          - qr
          - collect
          - push
        country:
          type: string
        currency:
          type: string
        method:
          type: string
        local_amount:
          type: string
        status:
          type: string
          enum:
          - pending
          - credited
          - unassigned
          - expired
          - failed
        reference:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        fx_rate:
          type: string
          description: Present once the payment was received and converted.
        usdt_gross:
          type: string
        fee:
          type: string
        usdt_credited:
          type: string
    Transfer:
      type: object
      properties:
        transfer_id:
          type: string
          format: uuid
        from_account_id:
          type: string
          format: uuid
        to_account_id:
          type: string
          format: uuid
        asset:
          type: string
          example: USDT
        amount:
          type: string
        description:
          type: string
        status:
          type: string
          example: completed
        created_at:
          type: string
          format: date-time
        idempotency_hit:
          type: boolean
    DepositAddress:
      type: object
      properties:
        chain:
          type: string
          enum:
          - tron
          - eth
        asset:
          type: string
          example: USDT
        address:
          type: string
        created_at:
          type: string
          format: date-time
    CryptoWithdrawal:
      type: object
      properties:
        withdrawal_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        chain:
          type: string
          enum:
          - tron
          - eth
        asset:
          type: string
          example: USDT
        to_address:
          type: string
        amount:
          type: string
        fee:
          type: string
        total_debit:
          type: string
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        status_code:
          type: string
        status_message:
          type: string
        tx_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        idempotency_hit:
          type: boolean
webhooks:
  payin_credited:
    post:
      summary: Payin credited
      description: 'A fiat collection was received and credited to the account in USDT.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payin_id: &id009
                  type: string
                account_id: *id009
                country: *id009
                currency: *id009
                local_amount: *id009
                fx_rate: *id009
                usdt_credited: *id009
                fee: *id009
            example:
              payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              country: BO
              currency: BOB
              local_amount: '700.00'
              fx_rate: '6.91'
              usdt_credited: '100.310000'
              fee: '1.000000'
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  payout_status_changed:
    post:
      summary: Payout status changed
      description: 'A payout reached a new state (processing, completed or failed).


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payout_id: *id009
                account_id: *id009
                country: *id009
                currency: *id009
                local_amount: *id009
                usdt_amount: *id009
                total_debit: *id009
                status: *id009
                status_code: *id009
            example:
              payout_id: 7d5c2f0a-1e9b-4a6d-8f3c-0b2a1d9e8c7f
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              country: MX
              currency: MXN
              local_amount: '1500.00'
              usdt_amount: '85.714286'
              total_debit: '87.300001'
              status: completed
              status_code: ''
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  transfer_received:
    post:
      summary: Transfer received
      description: 'The account received an internal transfer.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transfer_id: *id009
                from_account_id: *id009
                to_account_id: *id009
                asset: *id009
                amount: *id009
                description: *id009
                created_at: *id009
            example:
              transfer_id: 2a7b9c1d-4e5f-6a70-8b9c-0d1e2f3a4b5c
              from_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              to_account_id: 5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b
              asset: USDT
              amount: '25.000000'
              description: Expense split
              created_at: '2026-07-07T12:00:00Z'
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  crypto_deposit_credited:
    post:
      summary: Crypto deposit credited
      description: 'An on-chain deposit was confirmed and credited (net of the funding fee).


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id: *id009
                chain: *id009
                asset: *id009
                tx_id: *id009
                amount: *id009
                fee: *id009
            example:
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              chain: tron
              asset: USDT
              tx_id: b1946ac92492d2347c6235b4d2611184e0f0f8c9d3a1e2b3c4d5e6f708192a3b
              amount: '499.000000'
              fee: '1.000000'
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  crypto_withdrawal_status_changed:
    post:
      summary: Crypto withdrawal status changed
      description: 'An on-chain withdrawal reached a new state.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                withdrawal_id: *id009
                account_id: *id009
                chain: *id009
                asset: *id009
                tx_id: *id009
                status: *id009
                amount: *id009
            example:
              withdrawal_id: 6c5d4e3f-2a1b-0c9d-8e7f-6a5b4c3d2e1f
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              chain: tron
              asset: USDT
              tx_id: b1946ac92492d2347c6235b4d2611184e0f0f8c9d3a1e2b3c4d5e6f708192a3b
              status: completed
              amount: '100.000000'
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
