  /v1/kyc:
    post:
      tags:
      - KYC / KYB
      operationId: submitKyc
      summary: Submit KYC/KYB verification
      description: Verifies the calling account's identity — KYC for persons, KYB for companies (detected
        from the payload) — against the compliance service. All identity fields are optional and forwarded
        whole to the screening engine; the more identity data you send (date of birth, countries, strong
        identifiers, aliases), the more precise the analysis. If a compliance fee is configured, it is
        debited before the call and refunded if the screening fails. The response includes the screening
        result plus `kyc_status`, `compliance_service` and `compliance_fee`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  type: object
                  description: 'Identity data. Provide `person` or `company`; when omitted

                    it is filled from the account profile. Additional fields are accepted

                    and forwarded to the screening engine.

                    '
                  properties:
                    person:
                      type: object
                      description: Person identity. Every field is optional; more identity data yields
                        a more precise screening.
                      properties:
                        full_name:
                          type: string
                        first_name:
                          type: string
                        middle_name:
                          type: string
                        last_name:
                          type: string
                        date_of_birth:
                          description: '"YYYY-MM-DD" string or an object {year, month, day}.'
                        nationality:
                          type: string
                          description: ISO-3166 country code (or `nationalities` array).
                        country_of_birth:
                          type: string
                        residential_information:
                          type: array
                          items:
                            type: object
                            properties:
                              country_of_residence:
                                type: string
                        personal_identification:
                          type: array
                          description: Strong identity documents (national ID, passport, ...).
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                              issuing_country:
                                type: string
                              number:
                                type: string
                        alias:
                          type: array
                          items:
                            type: string
                          description: Other known names.
                    company:
                      type: object
                      description: Company identity. Every field is optional; more identity data yields
                        a more precise screening.
                      properties:
                        legal_name:
                          type: string
                        alias:
                          type: array
                          items:
                            type: string
                          description: Trade / brand names.
                        tax_id:
                          type: string
                        registration_number:
                          type: string
                        registration_authority_identification:
                          type: string
                          description: Company registry number.
                        place_of_registration:
                          type: string
                        country_of_incorporation:
                          type: string
                        incorporation_date:
                          type: string
                        address:
                          type: array
                          items:
                            type: object
                            properties:
                              country:
                                type: string
                    email:
                      type: string
                    country:
                      type: string
                monitor:
                  type: boolean
                  default: false
                  description: Enable continuous monitoring from the start.
            examples:
              person:
                summary: Person (KYC)
                value:
                  customer:
                    person:
                      full_name: Ana Perez Rojas
                      date_of_birth: '1990-04-12'
                      personal_identification:
                      - type: national_id
                        issuing_country: CL
                        number: 12.345.678-5
                    email: ana@example.com
                    country: CL
                  monitor: false
              personFull:
                summary: Person (KYC) — full identity for the most precise screening
                value:
                  customer:
                    person:
                      full_name: Ana Perez Rojas
                      date_of_birth: '1990-04-12'
                      nationality: CL
                      country_of_birth: CL
                      residential_information:
                      - country_of_residence: CL
                      personal_identification:
                      - type: national_id
                        issuing_country: CL
                        number: 12.345.678-5
                      - type: passport
                        issuing_country: CL
                        number: P0123456
                    email: ana@example.com
                    country: CL
                  monitor: false
              company:
                summary: Company (KYB)
                value:
                  customer:
                    company:
                      legal_name: Comercial Andina SpA
                      tax_id: 76.543.210-8
                    email: legal@andina.cl
                    country: CL
                  monitor: true
              companyFull:
                summary: Company (KYB) — full identity for the most precise screening
                value:
                  customer:
                    company:
                      legal_name: Comercial Andina SpA
                      alias:
                      - Andina Market
                      tax_id: 76.543.210-8
                      registration_authority_identification: '76543210'
                      place_of_registration: CL
                      incorporation_date: '2015-08-01'
                      address:
                      - country: CL
                    email: legal@andina.cl
                    country: CL
                  monitor: true
              minimal:
                summary: Minimal — autofilled from the account
                value:
                  customer: {}
                  monitor: false
      responses:
        '201':
          description: Screening submitted; account KYC status set to `pending`.
          content:
            application/json:
              schema:
                type: object
                description: Screening result (pass-through) plus billing fields.
                properties:
                  kyc_status:
                    type: string
                    example: pending
                  compliance_service:
                    type: string
                    enum:
                    - compliance_person
                    - compliance_company
                  compliance_fee:
                    type: string
                    example: '0.000000'
              example:
                customer_id: e1d2c3b4-a596-8778-695a-4b3c2d1e0f9a
                status: completed
                risk_level: low
                screening_result: no_hits
                monitored: false
                deduplicated: false
                kyc_status: pending
                compliance_service: compliance_person
                compliance_fee: '2.000000'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '502':
          description: Screening temporarily unavailable (`compliance_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: compliance_unavailable
                message: screening temporarily unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
