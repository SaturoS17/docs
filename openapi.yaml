          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                  default: tron
                asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  default: USDT
                  description: Asset to send (USDC only over `eth`).
                to_address:
                  type: string
                to_contact_id:
                  type: string
                  format: uuid
                  description: Use the contact's saved address for this chain instead of `to_address`
                    (an explicit `to_address` always wins).
                amount:
                  type: string
                  description: Positive decimal string, up to 6 decimal places.
                idempotency_key:
                  type: string
                contact_name:
                  type: string
                  description: Name for the auto-saved contact holding this address.
                save_contact:
                  type: boolean
                  default: true
                  description: The address is saved as a contact automatically; send false to skip it.
                travel_address:
                  type: string
                  description: Travel Rule (FATF R.16) — the beneficiary institution's travel address
                    (`ta…` code) for withdrawals above the org threshold towards another institution.
                    The payment address is provided by the receiving institution, so `to_address` can
                    be omitted.
                wallet_type:
                  type: string
                  enum:
                  - self_hosted
                  description: Travel Rule — declare `self_hosted` when the destination is the account
                    holder's own wallet (requires `beneficiary_name`).
                beneficiary_name:
                  type: string
                  description: Travel Rule — name of the destination holder. Required above the threshold
                    (with `travel_address` or `wallet_type=self_hosted`).
            examples:
              usdt_tron:
                summary: USDT over TRON
                value:
                  chain: tron
                  to_address: TVJ6njG5Fyrq6XwYok3xPQx8kR7HQx6vXk
