  /v1/crypto/wallets:
    post:
      tags:
      - Crypto
      operationId: createCryptoWallet
      summary: Restore a missing deposit wallet
      description: 'Every account — person and company — holds exactly **one deposit wallet per supported
        pair** (`tron`/`usdt`, `eth`/`usdt`, `eth`/`usdc`), provisioned automatically and free of charge
        on registration. Deposit wallets only **receive** crypto that credits the account''s virtual balance:
        they cannot send, and cannot be exported or imported (use segregated wallets for that). This endpoint
        exists only to restore a missing pair (an exceptional case): with the pair already provisioned
        it responds `422 wallet_limit_reached` for every account type.


        A manual restoration bills the `wallet_creation` fee when configured by CBPay (fixed per wallet;
        0 = free, the default); birth wallets are always free. The charge is refunded automatically if
        creation fails.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - chain
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                asset:
                  type: string
                  enum:
                  - usdt
                  - usdc
                  default: usdt
                  description: Wallet asset (usdc only over `eth`).
                label:
                  type: string
                  description: Optional descriptive label.
            examples:
              tron_usdt:
                summary: Restore the TRON USDT pair
                value:
                  chain: tron
              usdc_wallet:
                summary: Restore the USDC pair (Ethereum only)
                value:
                  chain: eth
                  asset: usdc
      responses:
        '201':
          description: Wallet created.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CryptoWallet'
                - type: object
                  properties:
                    creation_fee:
                      type: string
              example:
                wallet_id: b7e3a940-6f1d-4c2b-9a8e-5d4c3b2a1f0e
                chain: tron
                asset: USDT
                address: TQmZ1kfWzcmRDYkqLnybXnbWzPMYNvbYqT
                label: Main treasury
                type: deposit
                receive_only: true
                created_at: '2026-07-07T12:00:00Z'
                creation_fee: '1.000000'
        '400':
          description: invalid_chain / invalid_asset
          content:
            application/json:
              schema: &id008
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_chain
                message: unsupported chain "btc" (tron, eth)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '422':
          description: The account already holds its deposit wallet for that pair (applies to every account
            type).
          content:
            application/json:
              schema: *id008
              example:
                error: wallet_limit_reached
                message: accounts hold one deposit wallet per network/asset pair (created automatically
                  with the account); use segregated wallets for additional wallets
    get:
      tags:
      - Crypto
      operationId: listCryptoWallets
      summary: List my wallets
      description: Returns every wallet of the calling account, oldest first.
      responses:
        '200':
          description: The account's wallets.
          content:
