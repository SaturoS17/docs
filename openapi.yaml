    post:
      tags:
      - KYC / KYB
      operationId: presignKycDocument
      summary: Presign a KYC document upload
      description: 'Step 1 of the document flow: returns a temporary upload URL. Then PUT the binary to
        upload_url with the same Content-Type (step 2) and confirm (step 3). Categories: identity, proofOfResidence.
        Types: application/pdf, image/png, image/jpeg; 15 MB max; the URL expires in 15 minutes.'
      parameters:
      - name: submissionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDocumentPresignRequest'
            example:
              category: identity
              filename: cedula.jpg
              content_type: image/jpeg
              file_size: 482133
      responses:
        '200':
          description: Temporary upload URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_url:
                    type: string
                  key:
                    type: string
                  expires_in:
                    type: integer
              example:
                upload_url: https://storage.example.com/presigned/abc
                key: public-api/2026/07/10/cedula.jpg
                expires_in: 900
        '400':
          description: invalid_category / invalid_payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_category
                message: category must be one of identity, proofOfResidence
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
