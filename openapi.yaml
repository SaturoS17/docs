openapi: 3.1.0
info:
  title: CBPay API
  version: '1.0'
  description: 'CBPay is a multi-currency payment platform: fiat payouts and collections

    across Latin America, internal transfers, on-chain USDT funding and

    withdrawals, and KYC screening — all against a single USDT-denominated

    balance per account.


    All amounts are decimal strings. Balances are held in USDT with 6 decimal

    places. Errors always return `{"error": "<code>", "message": "<detail>"}`.

    '
servers:
- url: https://exchange.qbank.cl/platform
security:
- bearerAuth: []
tags:
- name: Authentication
  description: Register and log in account members. Sessions last 24 hours.
- name: Account
  description: Profile, members and API keys of the calling account.
- name: Balances
  description: Balances, movement history and FX rates.
- name: Payouts
  description: Fiat dispersals debited from the USDT balance.
- name: Payins
  description: Fiat top-ups credited to the USDT balance.
- name: Transfers
  description: Free internal transfers between accounts of the same organization.
- name: Crypto
  description: On-chain USDT funding and withdrawals (TRON and Ethereum).
- name: KYC
  description: Compliance screening of persons and companies.
- name: Webhooks
  description: Subscriptions to receive signed event notifications.
paths:
  /v1/auth/register:
    post:
      tags:
      - Authentication
      security: []
      operationId: register
      summary: Register an account
      description: 'Creates a person or company account with its owner login member and

        returns a session token. One endpoint for both types: `type` is data.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - type
              - email
              - password
              - display_name
              properties:
                org:
                  type: string
                  description: Organization slug provided by your operator (e.g. `cbpay`).
                type:
                  type: string
                  enum:
                  - person
                  - company
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                display_name:
                  type: string
                tax_id:
                  type: string
                phone:
                  type: string
                country:
                  type: string
                  description: ISO 3166-1 alpha-2 country code.
                profile:
                  type: object
                  description: Free-form profile data.
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
                  access_token:
                    type: string
                    description: Session JWT, valid for 24 hours.
                  expires_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Organization suspended (`org_suspended`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An account with that email already exists (`duplicate`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/login:
    post:
      tags:
      - Authentication
      security: []
      operationId: login
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - email
              - password
              properties:
                org:
                  type: string
                  description: Organization slug.
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  account_id:
                    type: string
                    format: uuid
                  role:
                    type: string
                    enum:
                    - owner
                    - operator
                    - viewer
        '401':
          description: Email or password is incorrect (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/me:
    get:
      tags:
      - Account
      operationId: getMe
      summary: Get my account
      responses:
        '200':
          description: The calling account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '403':
          $ref: '#/components/responses/AccountRequired'
    patch:
      tags:
      - Account
      operationId: updateMe
      summary: Update my profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                tax_id:
                  type: string
                phone:
                  type: string
                country:
                  type: string
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/members:
    get:
      tags:
      - Account
      operationId: listMembers
      summary: List members
      description: Login members of the calling account (company accounts).
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/AccountRequired'
    post:
      tags:
      - Account
      operationId: addMember
      summary: Add a member
      description: Adds a login member. Only available for company accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum:
                  - owner
                  - operator
                  - viewer
                  default: operator
      responses:
        '201':
          description: Member created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '403':
          description: Not a company account (`company_only`) or missing account credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/api-keys:
    post:
      tags:
      - Account
      operationId: createApiKey
      summary: Create an API key
      description: 'Issues a server-to-server API key bound to the calling account. The

        plaintext token (`pk_...`) is returned exactly once and cannot be

        retrieved again.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
      responses:
        '201':
          description: Key issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyIssued'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/balances:
    get:
      tags:
      - Balances
      operationId: getBalances
      summary: Get balances
      responses:
        '200':
          description: Balances of the calling account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancesResponse'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/movements:
    get:
      tags:
      - Balances
      operationId: listMovements
      summary: List movements
      description: Immutable ledger history of the calling account.
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - name: asset
        in: query
        schema:
          type: string
          example: USDT
      - name: type
        in: query
        description: Filter by ledger entry type.
        schema:
          type: string
          enum:
          - payout_debit
          - payout_refund
          - payin_credit
          - adjustment
          - transfer_in
          - transfer_out
          - funding
          - withdrawal_debit
          - withdrawal_refund
          - compliance_fee
          - compliance_refund
          - wallet_creation_fee
          - wallet_creation_refund
      responses:
        '200':
          description: Paged movements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementsResponse'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/rates:
    get:
      tags:
      - Balances
      operationId: getRates
      summary: Get FX rates and my fees
      description: 'USD/local reference rates plus the effective fee configuration of the

        calling account, so clients can compute net prices before operating.

        '
      responses:
        '200':
          description: Rates and fees.
          content:
            application/json:
              schema:
                type: object
                properties:
                  base:
                    type: string
                    example: USD
                  rates:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: CLP
                        rate:
                          type: string
                          example: '950.123456'
                  updated_at:
                    type: string
                  fees:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeeConfig'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '502':
          description: FX rates temporarily unavailable (`rates_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/payouts:
    post:
      tags:
      - Payouts
      operationId: createPayout
      summary: Create a payout
      description: 'Disperses fiat to a local bank account. The local amount is converted

        to USDT at the current rate; `usdt_amount + fee` is debited and held

        until the dispersal completes. If it fails, the full debit is refunded.


        Requires an idempotency key (body field or `Idempotency-Key` header).

        Retrying with the same key returns the original payout (`200` with

        `idempotency_hit: true`).

        '
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              - currency
              - amount
              - beneficiary
              properties:
                country:
                  type: string
                  description: ISO 3166-1 alpha-2 destination country (e.g. CL, PE, MX).
                currency:
                  type: string
                  description: Local currency (e.g. CLP, PEN, MXN).
                method:
                  type: string
                  description: Payout method from `GET /v1/payouts/methods` (e.g. `bank_transfer`).
                amount:
                  type: string
                  description: Local currency amount as a positive decimal string.
                  example: '50000.00'
                beneficiary:
                  type: object
                  additionalProperties:
                    type: string
                  description: 'Destination account details. Required keys depend on the

                    country and method; see `GET /v1/payouts/methods` and

                    `GET /v1/payouts/banks`.

                    '
                description:
                  type: string
                idempotency_key:
                  type: string
      responses:
        '202':
          description: Payout accepted and dispatching.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '200':
          description: Idempotency replay of an existing payout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          description: Account not active (`account_blocked`) or missing account credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'No FX rate for the currency (`currency_not_supported`), or the

            payout was rejected upfront — the response is the payout object

            with `status: failed` and the debit already refunded.

            '
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/Payout'
    get:
      tags:
      - Payouts
      operationId: listPayouts
      summary: List payouts
      description: Returns the payouts of the calling account.
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
      responses:
        '200':
          description: Paged payouts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  page_size:
                    type: integer
                  payouts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payout'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/payouts/{payoutID}:
    get:
      tags:
      - Payouts
      operationId: getPayout
      summary: Get a payout
      parameters:
      - name: payoutID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The payout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/payouts/methods:
    get:
      tags:
      - Payouts
      operationId: getPayoutMethods
      summary: List payout methods
      description: 'Available payout corridors (country, currency, method) for your

        organization. Pass-through of the processing core catalog.

        '
      responses:
        '200':
          description: Methods catalog.
          content:
            application/json:
              schema:
                type: object
                description: Catalog of available corridors.
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/payouts/banks:
    get:
      tags:
      - Payouts
      operationId: getPayoutBanks
      summary: List destination banks
      parameters:
      - name: country
        in: query
        schema:
          type: string
          example: CL
      responses:
        '200':
          description: Banks catalog for the country.
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/payins:
    post:
      tags:
      - Payins
      operationId: createPayin
      summary: Create a payin (top-up charge)
      description: 'Creates an active fiat charge (e.g. a QR) through the processing core.

        When the payment arrives, the account is credited automatically in

        USDT (gross at FX rate, minus the payin fee) and the

        `payin_credited` webhook fires.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              - currency
              - amount
              properties:
                country:
                  type: string
                  example: BO
                currency:
                  type: string
                  example: BOB
                amount:
                  type: string
                  description: Local currency amount as a positive decimal string.
                description:
                  type: string
                channel:
                  type: string
                  description: Optional channel hint passed to the core.
                expires_in:
                  type: integer
                  description: Charge expiration in seconds.
      responses:
        '201':
          description: Charge created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: pending
                  charge:
                    type: object
                    description: Charge details (QR data, references) from the core.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '422':
          description: The core rejected the charge (`core_rejected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Core unavailable (`core_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Payins
      operationId: listPayins
      summary: List payins
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - credited
          - unassigned
          - expired
          - failed
      responses:
        '200':
          description: Paged payins.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  page_size:
                    type: integer
                  payins:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payin'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/payins/{payinID}:
    get:
      tags:
      - Payins
      operationId: getPayin
      summary: Get a payin
      parameters:
      - name: payinID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The payin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payin'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/payins/methods:
    get:
      tags:
      - Payins
      operationId: getPayinMethods
      summary: List payin methods
      responses:
        '200':
          description: Catalog of available payin corridors.
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/transfers:
    post:
      tags:
      - Transfers
      operationId: createTransfer
      summary: Create an internal transfer
      description: 'Moves USDT between two accounts of the same organization, atomically

        and free of charge. The destination is resolved by `to_account_id` or

        `to_email`. The recipient''s webhook subscribers receive

        `transfer_received`.

        '
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                to_account_id:
                  type: string
                  format: uuid
                to_email:
                  type: string
                  format: email
                asset:
                  type: string
                  default: USDT
                amount:
                  type: string
                  description: Positive decimal string, up to 6 decimal places.
                  example: '10.500000'
                description:
                  type: string
                idempotency_key:
                  type: string
      responses:
        '201':
          description: Transfer completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '200':
          description: Idempotency replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '404':
          description: Destination not found (`recipient_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Destination cannot receive transfers (`recipient_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/crypto/deposit-address:
    get:
      tags:
      - Crypto
      operationId: getDepositAddress
      summary: Create or get my wallet (deposit address)
      description: 'Returns (creating on first call) the on-chain USDT deposit address of the calling
        account. Confirmed deposits credit the balance automatically, minus the funding fee.


        The first creation on each chain bills the `wallet_creation` fee when configured (fixed per wallet;
        0 = free, the default), reported in `creation_fee` and refunded if creation fails. Fetching an
        existing address is always free.'
      parameters:
      - name: chain
        in: query
        schema:
          type: string
          enum:
          - tron
          - eth
          default: tron
      - name: asset
        in: query
        schema:
          type: string
          enum:
          - usdt
          default: usdt
      responses:
        '200':
          description: Existing address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositAddress'
        '201':
          description: Address created.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DepositAddress'
                - type: object
                  properties:
                    creation_fee:
                      type: string
                      example: '0.000000'
                      description: Wallet creation fee charged (0.000000 when free).
        '403':
          $ref: '#/components/responses/AccountRequired'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
  /v1/crypto/withdrawals:
    post:
      tags:
      - Crypto
      operationId: createCryptoWithdrawal
      summary: Create an on-chain withdrawal
      description: 'Sends USDT on-chain. `amount + withdrawal fee` is debited atomically

        and held; final state arrives via the

        `crypto_withdrawal_status_changed` webhook. `failed` refunds the full

        debit.

        '
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - to_address
              - amount
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                  default: tron
                asset:
                  type: string
                  default: USDT
                to_address:
                  type: string
                amount:
                  type: string
                  description: Positive decimal string, up to 6 decimal places.
                idempotency_key:
                  type: string
      responses:
        '202':
          description: Withdrawal accepted and broadcasting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoWithdrawal'
        '200':
          description: Idempotency replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoWithdrawal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '422':
          description: The core rejected the withdrawal; the debit was refunded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoWithdrawal'
        '503':
          description: Withdrawals not enabled for this corridor (`withdrawals_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/crypto/withdrawals/{withdrawalID}:
    get:
      tags:
      - Crypto
      operationId: getCryptoWithdrawal
      summary: Get a withdrawal
      parameters:
      - name: withdrawalID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The withdrawal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoWithdrawal'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/crypto/transactions:
    get:
      tags:
      - Crypto
      operationId: listCryptoTransactions
      summary: List on-chain activity
      description: Funding credits and withdrawals of the calling account.
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Deposits and withdrawals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  page_size:
                    type: integer
                  deposits:
                    type: array
                    items:
                      type: object
                      properties:
                        asset:
                          type: string
                        amount:
                          type: string
                          description: Net credited amount.
                        reference:
                          type: string
                        tx_id:
                          type: string
                        chain:
                          type: string
                        from_address:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                  withdrawals:
                    type: array
                    items:
                      $ref: '#/components/schemas/CryptoWithdrawal'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/kyc:
    post:
      tags:
      - KYC
      operationId: submitKyc
      summary: Submit KYC screening
      description: 'Screens the calling account (person or company, detected from the

        payload) against the compliance service. If a compliance fee is

        configured, it is debited before the call and refunded if the

        screening fails. The response includes the screening result plus

        `kyc_status`, `compliance_service` and `compliance_fee`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  type: object
                  description: 'Identity data. Provide `person` or `company`; when omitted

                    it is filled from the account profile.

                    '
                  properties:
                    person:
                      type: object
                      properties:
                        full_name:
                          type: string
                    company:
                      type: object
                      properties:
                        legal_name:
                          type: string
                    email:
                      type: string
                    country:
                      type: string
                monitor:
                  type: boolean
                  default: false
                  description: Enable continuous monitoring from the start.
      responses:
        '201':
          description: Screening submitted; account KYC status set to `pending`.
          content:
            application/json:
              schema:
                type: object
                description: Screening result (pass-through) plus billing fields.
                properties:
                  kyc_status:
                    type: string
                    example: pending
                  compliance_service:
                    type: string
                    enum:
                    - compliance_person
                    - compliance_company
                  compliance_fee:
                    type: string
                    example: '0.000000'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '502':
          description: Screening temporarily unavailable (`compliance_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/kyc/rescreen:
    post:
      tags:
      - KYC
      operationId: rescreenKyc
      summary: Re-run KYC screening
      description: 'Re-runs the account''s screening. Requires a prior KYC submission.

        Bills the `compliance_rescreen` fee if configured; refunded on

        upstream failure.

        '
      responses:
        '200':
          description: Rescreen result plus billing fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  compliance_service:
                    type: string
                    example: compliance_rescreen
                  compliance_fee:
                    type: string
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: Account has no prior screening (`no_kyc`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/kyc/monitoring:
    patch:
      tags:
      - KYC
      operationId: setKycMonitoring
      summary: Enable or disable monitoring
      description: 'Toggles continuous compliance monitoring for the account''s screened

        identity. Enabling bills the `compliance_monitoring` fee if

        configured; disabling is free. Requires a prior KYC submission.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Monitoring state plus billing fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  monitored:
                    type: boolean
                  compliance_service:
                    type: string
                    example: compliance_monitoring
                  compliance_fee:
                    type: string
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: Account has no prior screening (`no_kyc`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/webhooks/subscriptions:
    post:
      tags:
      - Webhooks
      operationId: createWebhookSubscription
      summary: Create a webhook subscription
      description: 'Subscribes an HTTPS callback to the calling account''s events.


        Deliveries are signed: `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`
        with the timestamp in `X-Webhook-Timestamp`. Up to 5 attempts with incremental backoff.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - event_type
              - callback_url
              - secret
              properties:
                event_type:
                  type: string
                  enum:
                  - payin_credited
                  - payout_status_changed
                  - transfer_received
                  - crypto_deposit_credited
                  - crypto_withdrawal_status_changed
                  - '*'
                callback_url:
                  type: string
                  format: uri
                  description: HTTPS only; localhost and private IPs are rejected.
                secret:
                  type: string
                  minLength: 16
      responses:
        '201':
          description: Subscription created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  event_type:
                    type: string
                  callback_url:
                    type: string
                  status:
                    type: string
                    example: active
                  created_at:
                    type: string
                    format: date-time
                  secret_stored:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Session JWT (from register/login) or API key (`pk_...`).

        `X-API-Key: <token>` is accepted as an alternative header.

        '
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    pageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Alternative to the `idempotency_key` body field.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request (see `error` code for the specific validation).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InsufficientFunds:
      description: Account balance is not enough for this operation (`insufficient_funds`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccountRequired:
      description: This endpoint requires an account credential (`account_required`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Credential level not allowed for this endpoint (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code (snake_case).
          example: insufficient_funds
        message:
          type: string
          description: Human-readable explanation.
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - person
          - company
        status:
          type: string
          enum:
          - active
          - blocked
          - closed
        kyc_status:
          type: string
          enum:
          - none
          - pending
          - approved
          - rejected
        email:
          type: string
        display_name:
          type: string
        tax_id:
          type: string
        phone:
          type: string
        country:
          type: string
        profile:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
          - owner
          - operator
          - viewer
        status:
          type: string
          enum:
          - active
          - disabled
        created_at:
          type: string
          format: date-time
    ApiKeyIssued:
      type: object
      properties:
        api_key_id:
          type: string
          format: uuid
        key_id:
          type: string
        token:
          type: string
          description: Plaintext key (`pk_...`). Shown exactly once.
        label:
          type: string
        note:
          type: string
    BalancesResponse:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        balances:
          type: array
          items:
            type: object
            properties:
              asset:
                type: string
                example: USDT
              available:
                type: string
                example: '100.000000'
              held:
                type: string
                description: Reserved by in-flight payouts/withdrawals.
                example: '5.000000'
              updated_at:
                type: string
                format: date-time
    MovementsResponse:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        page:
          type: integer
        page_size:
          type: integer
        movements:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              asset:
                type: string
              amount:
                type: string
                description: Signed; negative debits, positive credits.
              type:
                type: string
                description: Ledger entry type.
              reference_type:
                type: string
              reference_id:
                type: string
              description:
                type: string
              balance_after:
                type: string
              created_at:
                type: string
                format: date-time
    FeeConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        account_id:
          type: string
          description: Empty for organization defaults.
        service:
          type: string
          enum:
          - payout
          - payin
          - funding
          - withdrawal
          - compliance_person
          - compliance_company
          - compliance_rescreen
          - compliance_transaction
          - compliance_monitoring
        country:
          type: string
        asset:
          type: string
          example: USDT
        percent:
          type: string
          example: '1.5'
        fixed_amount:
          type: string
          example: '0.30'
        status:
          type: string
          example: active
        updated_at:
          type: string
          format: date-time
    Payout:
      type: object
      properties:
        payout_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        country:
          type: string
        currency:
          type: string
        method:
          type: string
        local_amount:
          type: string
        fx_rate:
          type: string
          description: Local units per 1 USD at execution time.
        usdt_amount:
          type: string
        fee:
          type: string
        total_debit:
          type: string
        beneficiary:
          type: object
        description:
          type: string
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        status_code:
          type: string
        status_message:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        idempotency_hit:
          type: boolean
          description: Present (true) when the response is an idempotent replay.
    Payin:
      type: object
      properties:
        payin_id:
          type: string
          format: uuid
        account_id:
          type: string
        kind:
          type: string
          enum:
          - qr
          - collect
          - push
        country:
          type: string
        currency:
          type: string
        method:
          type: string
        local_amount:
          type: string
        status:
          type: string
          enum:
          - pending
          - credited
          - unassigned
          - expired
          - failed
        reference:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        fx_rate:
          type: string
          description: Present once the payment was received and converted.
        usdt_gross:
          type: string
        fee:
          type: string
        usdt_credited:
          type: string
    Transfer:
      type: object
      properties:
        transfer_id:
          type: string
          format: uuid
        from_account_id:
          type: string
          format: uuid
        to_account_id:
          type: string
          format: uuid
        asset:
          type: string
          example: USDT
        amount:
          type: string
        description:
          type: string
        status:
          type: string
          example: completed
        created_at:
          type: string
          format: date-time
        idempotency_hit:
          type: boolean
    DepositAddress:
      type: object
      properties:
        chain:
          type: string
          enum:
          - tron
          - eth
        asset:
          type: string
          example: USDT
        address:
          type: string
        created_at:
          type: string
          format: date-time
    CryptoWithdrawal:
      type: object
      properties:
        withdrawal_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        chain:
          type: string
          enum:
          - tron
          - eth
        asset:
          type: string
          example: USDT
        to_address:
          type: string
        amount:
          type: string
        fee:
          type: string
        total_debit:
          type: string
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        status_code:
          type: string
        status_message:
          type: string
        tx_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        idempotency_hit:
          type: boolean
  x-webhooks:
    payin_credited:
      description: A fiat top-up was received and credited.
      payload:
        payin_id: uuid
        account_id: uuid
        country: string
        currency: string
        local_amount: string
        fx_rate: string
        usdt_credited: string
        fee: string
    payout_status_changed:
      description: A payout changed state (processing/completed/failed).
      payload:
        payout_id: uuid
        account_id: uuid
        country: string
        currency: string
        local_amount: string
        usdt_amount: string
        total_debit: string
        status: string
        status_code: string
    transfer_received:
      description: The account received an internal transfer.
      payload:
        transfer_id: uuid
        from_account_id: uuid
        to_account_id: uuid
        asset: string
        amount: string
        description: string
        created_at: date-time
    crypto_deposit_credited:
      description: An on-chain deposit was confirmed and credited (net of fee).
      payload:
        account_id: uuid
        chain: string
        asset: string
        tx_id: string
        amount: string
        fee: string
    crypto_withdrawal_status_changed:
      description: An on-chain withdrawal changed state.
      payload:
        withdrawal_id: uuid
        account_id: uuid
        chain: string
        asset: string
        tx_id: string
        status: string
        amount: string
