  /v1/banking/operations:
    post:
      tags:
      - Banking
      operationId: createBankingOperation
      summary: Send a bank payment
      description: Executes a TRANSFER (between your own bank accounts) or WITHDRAW (to a registered beneficiary).
        Requires an idempotency key; retries with the same key return the original operation without re-charging.
        Billed as the fixed `banking_operation` fee; refunded if the corridor rejects. The final state
        arrives via the banking_operation_status_changed webhook.
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currency
              - type
              - sourceRequisit
              - destinationRequisit
              - amount
              properties:
                currency:
                  type: string
                  example: USD
                type:
                  type: string
                  enum:
                  - TRANSFER
                  - WITHDRAW
                paymentType:
                  type: string
                  description: EMPTY for TRANSFER; rail code (e.g. SEPA_CT) for WITHDRAW.
                sourceRequisit:
                  type: object
                  properties:
                    account:
                      type: string
                destinationRequisit:
                  type: object
                  properties:
                    account:
                      type: string
                      description: Destination account (TRANSFER).
                    beneficiar:
                      type: string
                      description: Beneficiary account (WITHDRAW).
                amount:
                  type: object
                  properties:
                    currencyCode:
                      type: string
                    units:
                      type: string
                    nanos:
                      type: integer
                comment:
                  type: string
                idempotency_key:
                  type: string
            examples:
              withdraw:
                summary: WITHDRAW to a beneficiary (SEPA)
                value:
                  currency: USD
                  type: WITHDRAW
                  paymentType: SEPA_CT
                  sourceRequisit:
                    account: c4d1e2f3-a4b5-c6d7-e8f9-a0b1c2d3e4f5
                  destinationRequisit:
                    beneficiar: BNK-CPACC-11
                  amount:
                    currencyCode: USD
                    units: '250'
                    nanos: 0
                  comment: Invoice 8841
                  idempotency_key: acme-payment-0071
              transfer:
                summary: TRANSFER between own accounts
                value:
                  currency: USD
                  type: TRANSFER
                  paymentType: EMPTY
                  sourceRequisit:
                    account: c4d1e2f3-a4b5-c6d7-e8f9-a0b1c2d3e4f5
                  destinationRequisit:
                    account: d5e2f3a4-b5c6-d7e8-f9a0-b1c2d3e4f5a6
                  amount:
                    currencyCode: USD
                    units: '100'
                    nanos: 0
                  idempotency_key: internal-move-0012
      responses:
        '202':
          description: Operation accepted (final state via webhook).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                operation_id: 7e8a9b0c-1d2e-3f4a-5b6c-7d8e9f0a1b2c
                provider_id: BNK-OP-90213
                status: pending
                idempotency_key: platform:9b1deb4d:acme-payment-0071
                data:
                  type: WITHDRAW
                  paymentType: SEPA_CT
                banking_fee: '2.000000'
        '200':
          description: Idempotency replay of an existing operation (no new charge).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                operation_id: 7e8a9b0c-1d2e-3f4a-5b6c-7d8e9f0a1b2c
                provider_id: BNK-OP-90213
                status: pending
                idempotency_key: platform:9b1deb4d:acme-payment-0071
                data:
                  type: WITHDRAW
                  paymentType: SEPA_CT
                idempotency_hit: true
        '400':
          description: idempotency_key_required / invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: provide idempotency_key (body or Idempotency-Key header)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: No banking profile yet (no_banking_customer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_banking_customer
                message: create your banking customer first (POST /v1/banking/customer)
        '502':
          description: Banking corridor error; any fee was refunded (banking_request_failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: banking_request_failed
                  message: request rejected
