  /v1/cards:
    post:
      tags:
      - Cards
      operationId: createCard
      summary: Create a card
      description: 'Issues a card (virtual or physical) that spends Just-In-Time from the account''s
        central USDT balance — no prefunding: every purchase is authorized in real time against the
        available balance and the card''s own limits. Person accounts can hold **1 virtual + 1
        physical** card; company accounts can create **unlimited** cards, for the company itself or
        for designated persons (e.g. employees, passing their identity documents). Issuance bills the
        `card_creation_virtual` / `card_creation_physical` fee when configured (0 = free); the charge
        is refunded automatically if issuance fails. Physical cards are born `pending_activation`
        until the holder confirms reception.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotency_key
              properties:
                physical:
                  type: boolean
                  default: false
                idempotency_key:
                  type: string
                  description: Required (also accepted as the Idempotency-Key header). A retry with
                    the same key returns the original card and never double-charges the issuance fee.
                limits:
                  type: object
                  description: Optional spending limits in USDT (enforced at authorization time; 0 or
                    omitted = no limit).
                  properties:
                    per_transaction:
                      type: string
                    daily:
                      type: string
                    monthly:
                      type: string
                cardholder:
                  type: object
                  description: 'Cardholder data. REQUIRED on the account''s FIRST issuance (it creates
                    and verifies the holder at the issuer: personal data, occupation catalog code and
                    identity documents by URL — id_front_url, id_back_url, residence_proof_url; company
                    accounts issuing for themselves send corporate data and documents instead). Omit it
                    on subsequent cards: the verified holder is reused. Company accounts can also set
                    kind "person" to issue for a designated person (full data + documents required on
                    every designation).'
            examples:
              person_first_card:
                summary: Person — FIRST card (full cardholder data)
                value:
                  physical: false
                  idempotency_key: card-v-1
                  cardholder:
                    first_name: Ana
                    last_name: Perez
                    email: ana@example.com
                    phone: '+56912345678'
                    occupation: '52201'
                    salary_usd: 1800
                    id_front_url: https://files.example.com/kyc/ap-front.jpg
                    id_back_url: https://files.example.com/kyc/ap-back.jpg
                    residence_proof_url: https://files.example.com/kyc/ap-address.pdf
                    address:
                      line1: Av. Providencia 123
                      city: Santiago
                      region: RM
                      postal_code: '7500000'
                      country: CL
              subsequent_card:
                summary: Subsequent card — holder already verified (no data needed)
                value:
                  physical: true
                  idempotency_key: card-f-ops-1
                  limits:
                    per_transaction: '500.00'
                    monthly: '5000.00'
              company_for_employee:
                summary: Company — card for a designated person
                value:
                  physical: false
                  idempotency_key: card-emp-77
                  limits:
                    monthly: '1500.00'
                  cardholder:
                    kind: person
                    first_name: Maria
                    last_name: Perez
                    email: maria@empresa.com
                    occupation: '52201'
                    salary_usd: 1800
                    id_front_url: https://files.example.com/kyc/mp-front.jpg
                    id_back_url: https://files.example.com/kyc/mp-back.jpg
                    residence_proof_url: https://files.example.com/kyc/mp-address.pdf
                    address:
                      line1: Av. Providencia 123
                      city: Santiago
                      region: RM
                      postal_code: '7500000'
                      country: CL
      responses:
        '201':
          description: Card created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject'
              example:
                card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                physical: false
                cardholder_kind: account
                cardholder_name: Client X SpA
                status: active
                limits:
                  monthly: '5000.000000'
                created_at: '2026-07-08T12:00:00Z'
                updated_at: '2026-07-08T12:00:00Z'
                creation_fee: '3.000000'
        '400':
          description: idempotency_key_required / invalid_amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: provide idempotency_key (body or Idempotency-Key header)
        '402':
          description: Balance cannot cover the issuance fee (insufficient_funds).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient_funds
                message: account balance is not enough for this operation
        '409':
          description: card_limit_reached (person accounts) / cardholder_kyc_pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: card_limit_reached
                message: person accounts can hold at most 1 virtual card (cancel the existing one first)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
    get:
      tags:
