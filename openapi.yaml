                  expires_at: '2026-07-08T21:10:00Z'
                  verified_at: '2026-07-08T21:01:12Z'
                  consumed_at: '2026-07-08T21:01:40Z'
        '400':
          $ref: '#/components/responses/InvalidRange'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/otp/challenges/{challengeID}:
    get:
      tags:
      - Security (OTP)
      operationId: getOTPChallenge
      summary: Get an OTP challenge
      parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPChallenge'
              example: *otpChallengeExample
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/otp/challenges/{challengeID}/verify:
    post:
      tags:
      - Security (OTP)
      operationId: verifyOTPChallenge
      summary: Verify the code
      description: Validates the code received over SMS/WhatsApp and returns
        the single-use `otp_token` that authorizes the protected action
        (send it in the `X-OTP-Token` header). 5 attempts per challenge.
      parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 10
            example:
              code: '482913'
      responses:
        '200':
          description: Code approved; single-use token issued.
          content:
            application/json:
              example:
                challenge_id: 6f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                action: payout
                otp_token: otp_Zk9uY2XIr1EYE0lq8xqlM3VayVZYX4aa11bb22cc33
                expires_at: '2026-07-08T21:10:00Z'
                note: 'single use: send it in the X-OTP-Token header of the protected action'
        '401':
          description: The code is incorrect (`invalid_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_code
                message: the code is incorrect; check it and try again
        '409':
          description: The challenge expired or was already used
            (`challenge_not_pending`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: challenge_not_pending
                message: the challenge already expired or was used; create a new one
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/services:
    get:
      tags:
      - Account
      operationId: getServices
      summary: Enabled services
      description: 'Effective map of which products this account can use right now (payouts, payins,
        transfers, crypto, banking, kyc, cards). When a service is disabled, its action endpoints
        answer 403 service_disabled; reads and money already in flight are never affected. Use it to
        decide what to show in your UI.'
      responses:
        '200':
          description: Effective services map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  services:
                    type: object
                    additionalProperties:
                      type: boolean
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                services:
                  payouts: true
                  payins: true
                  transfers: true
                  crypto: true
                  banking: true
                  kyc: true
                  cards: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/cards/catalog/occupations:
    get:
      tags:
      - Cards
      operationId: listCardOccupations
      summary: Occupation catalog
      description: 'Official issuer occupation codes (for the `occupation` field when designating a
        person cardholder). Search with `q` (matches code or label). Use the `code` value; a
        free-text occupation is rejected with 400 invalid_occupation.'
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Optional case-insensitive filter over code or label.
      responses:
        '200':
          description: Catalog entries.
          content:
            application/json:
              example:
                items:
                - code: '12101'
                  label: Director General
                - code: '21313'
                  label: Computer Systems Designer
                meta:
                  retrieved: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/cards/catalog/business-activities:
    get:
      tags:
      - Cards
      operationId: listCardBusinessActivities
      summary: Business activity catalog
      description: 'Official issuer economic-activity codes (for `kind_of_business` when creating a
        company cardholder). Search with `q`. Use the `code` value; a free-text value is rejected
        with 400 invalid_kind_of_business.'
      parameters:
      - name: q
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Catalog entries.
          content:
            application/json:
              example:
                items:
                - code: J6201
                  label: Computer programming activities
                meta:
                  retrieved: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Session JWT (from register/login) or API key (`pk_...`).

        `X-API-Key: <token>` is accepted as an alternative header.

        '
  parameters:
    cardID:
      name: cardID
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    pageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Alternative to the `idempotency_key` body field.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request (see `error` code for the specific validation).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_json
            message: 'request body is not valid JSON: unknown field'
    InsufficientFunds:
      description: Account balance is not enough for this operation (`insufficient_funds`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: insufficient_funds
            message: account balance is not enough for this operation
    InvalidRange:
      description: Invalid `from`/`to` date filter (`invalid_range`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_range
            message: invalid from date (YYYY-MM-DD)
    AccountRequired:
      description: This endpoint requires an account credential (`account_required`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: account_required
            message: this endpoint requires an account credential
    Forbidden:
      description: Credential level not allowed for this endpoint (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
            message: credentials required
    NotFound:
      description: Resource not found (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: resource not found
    Unauthorized:
      description: Missing or invalid credential (`unauthorized`).
      content:
        application/json:
          schema: *id014
          example:
            error: unauthorized
            message: invalid or missing credentials
