        '403':
          $ref: '#/components/responses/AccountRequired'
    put:
      tags:
      - Account
      operationId: updateSettlement
      summary: Set my default settlement asset
      description: Changes the balance your payouts and service fees debit from when a request does not
        send an explicit `settlement_asset`. Any of USDT, USDC, BTC or GOLD (if enabled for your organization).
        The change applies to new operations only; nothing in flight is re-quoted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - default_settlement_asset
              properties:
                default_settlement_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
            example:
              default_settlement_asset: BTC
      responses:
        '200':
          description: Updated settlement settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementSettings'
              example:
                default_settlement_asset: BTC
                enabled_assets:
                - USDT
                - USDC
                - BTC
                - GOLD
                volatile_op_limit_usdt: '10000.000000'
                volatile_daily_limit_usdt: '50000.000000'
        '400':
          description: Invalid or disabled asset (`invalid_settlement_asset`, `settlement_asset_disabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: settlement_asset_disabled
                message: settlement asset is disabled for this organization
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
