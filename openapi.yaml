                  format: uuid
                to_email:
                  type: string
                  format: email
                asset:
                  type: string
                  default: USDT
                amount:
                  type: string
                  description: Positive decimal string, up to 6 decimal places.
                  example: '10.500000'
                description:
                  type: string
                idempotency_key:
                  type: string
            example:
              to_email: carlos@example.com
