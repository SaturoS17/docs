  /v1/segregated-wallets:
    post:
      tags:
      - Segregated wallets
      operationId: createSegregatedWallet
      summary: Create a segregated wallet
      description: 'Creates a new on-chain wallet owned by the calling account. Its balance lives on-chain
        (never in the ledger) and it is exempt from the treasury sweep. Supported pairs: `tron`/`usdt`,
        `eth`/`usdt`, `eth`/`usdc`. Company accounts can create unlimited wallets; person accounts hold
        **1 per network+asset pair** (a second one responds `422 wallet_limit_reached`). An optional `Idempotency-Key`
        (or `idempotency_key` in the body) makes retries safe: a repeat returns the same wallet without
        creating a second one. May bill the `wallet_creation` fee (refunded if creation fails).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - chain
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                asset:
                  type: string
                  enum:
                  - usdt
                  - usdc
                  default: usdt
                label:
                  type: string
                idempotency_key:
                  type: string
            examples:
              tron_usdt:
                summary: TRON USDT
                value:
                  chain: tron
                  asset: usdt
                  label: Acme Client
                  idempotency_key: wallet-client-001
              eth_usdc:
                summary: Ethereum USDC
                value:
                  chain: eth
                  asset: usdc
                  label: Project X
                  idempotency_key: wallet-project-x
      responses:
        '201':
          description: Wallet created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegregatedWallet'
              example:
                wallet_id: b7e3a1c2-9f4d-4a8b-8c1e-2d3f4a5b6c7d
                chain: tron
                asset: USDT
                address: TRmSZRaMAqLEevAdGwo3R43bRBXamWR5bd
                label: Acme Client
                type: segregated
                origin: created
                custody: cbpay
                exported: false
                created_at: '2026-07-11T12:00:00Z'
        '400':
          description: invalid_chain / invalid_asset
          content:
            application/json:
              schema: &id009
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_asset
                message: 'unsupported chain/asset pair (supported: tron/usdt, eth/usdt, eth/usdc)'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Service disabled for the account.
          content:
            application/json:
              schema: *id009
              example:
                error: service_disabled
                message: this service is not enabled for the account
        '409':
          description: A wallet with this idempotency key is still being provisioned.
          content:
            application/json:
              schema: *id009
              example:
                error: idempotency_conflict
                message: a wallet with this idempotency key is still being provisioned; retry with the
                  same key
        '422':
          description: A person account already holds its segregated wallet for that pair.
          content:
            application/json:
              schema: *id009
