                customer_id: e1d2c3b4-a596-8778-695a-4b3c2d1e0f9a
                monitored: true
                compliance_service: compliance_monitoring
                compliance_fee: '0.500000'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: Account has no prior screening (`no_kyc`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_kyc
                message: account has no compliance screening to monitor
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/webhooks/subscriptions:
    post:
      tags:
      - Webhooks
      operationId: createWebhookSubscription
      summary: Create a webhook subscription
      description: 'Subscribes an HTTPS callback to the calling account''s events.


        Deliveries are signed: `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`
        with the timestamp in `X-Webhook-Timestamp`. Up to 5 attempts with incremental backoff.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - event_type
              - callback_url
              - secret
              properties:
                event_type:
                  type: string
                  enum:
                  - payin_credited
                  - payout_status_changed
                  - transfer_received
                  - crypto_deposit_credited
                  - crypto_withdrawal_status_changed
                  - '*'
                callback_url:
                  type: string
                  format: uri
                  description: HTTPS only; localhost and private IPs are rejected.
                secret:
                  type: string
                  minLength: 16
            example:
              event_type: payout_status_changed
              callback_url: https://api.myapp.com/webhooks/cbpay
              secret: a-strong-shared-secret-123
      responses:
        '201':
          description: Subscription created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  event_type:
                    type: string
                  callback_url:
                    type: string
                  status:
                    type: string
                    example: active
                  created_at:
                    type: string
                    format: date-time
                  secret_stored:
                    type: boolean
              example:
                id: 8e7f6a5b-4c3d-2e1f-0a9b-8c7d6e5f4a3b
                event_type: payout_status_changed
                callback_url: https://api.myapp.com/webhooks/cbpay
                status: active
                created_at: '2026-07-07T12:00:00Z'
                secret_stored: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - Webhooks
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      description: Lists the account's webhook subscriptions (the secret is never returned).
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      responses:
        '200':
          description: Subscriptions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                page: 1
                page_size: 50
                subscriptions:
                - id: 475b48fc-2858-4ad3-81e2-ec68742d8245
                  event_type: payout_status_changed
                  callback_url: https://api.example.com/webhooks/cbpay
                  status: active
                  created_at: '2026-07-07T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /healthz:
    get:
      tags:
      - Status
      security: []
      operationId: healthz
      summary: Service health
      description: Public liveness check of the API and its database.
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              example:
                status: ok
        '503':
          description: Database not reachable (`store_unavailable`).
          content:
            application/json:
              schema: &id014
                $ref: '#/components/schemas/Error'
              example:
                error: store_unavailable
                message: database not reachable
  /v1/crypto/wallets:
    post:
      tags:
      - Crypto
      operationId: createCryptoWallet
      summary: Create a wallet
      description: 'Creates a new on-chain wallet for the calling account. Supported pairs: `tron`/`usdt`,
        `eth`/`usdt`, `eth`/`usdc` — every deposit credits the wallet''s own asset balance. Person accounts
        hold **one wallet per network+asset**; company accounts can create **unlimited** wallets (use
        `label` to tell them apart).


        Every creation bills the `wallet_creation` fee when configured by CBPay (fixed per wallet; 0 =
        free, the default; configurable per account). The charge is refunded automatically if creation
        fails.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - chain
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                asset:
                  type: string
                  enum:
                  - usdt
                  - usdc
                  default: usdt
                  description: Wallet asset (usdc only over `eth`).
                label:
                  type: string
                  description: Optional descriptive label.
            examples:
              person:
                summary: Person — one wallet per network+asset
                value:
                  chain: tron
              company_labeled:
                summary: Company — labeled wallet (unlimited)
                value:
                  chain: tron
                  label: Main treasury
              company_eth:
                summary: Company — Ethereum network
                value:
                  chain: eth
                  label: E-commerce collections
              usdc_wallet:
                summary: USDC wallet (Ethereum only)
                value:
                  chain: eth
                  asset: usdc
                  label: USDC treasury
      responses:
        '201':
          description: Wallet created.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CryptoWallet'
                - type: object
                  properties:
                    creation_fee:
                      type: string
              example:
                wallet_id: b7e3a940-6f1d-4c2b-9a8e-5d4c3b2a1f0e
                chain: tron
                asset: USDT
                address: TQmZ1kfWzcmRDYkqLnybXnbWzPMYNvbYqT
                label: Main treasury
                created_at: '2026-07-07T12:00:00Z'
                creation_fee: '1.000000'
        '400':
          description: invalid_chain / invalid_asset
          content:
            application/json:
              schema: &id008
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_chain
                message: unsupported chain "btc" (tron, eth)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '422':
          description: Person account already holds a wallet on that network.
          content:
            application/json:
              schema: *id008
              example:
                error: wallet_limit_reached
                message: person accounts hold one wallet per network; company accounts can create more
    get:
      tags:
      - Crypto
      operationId: listCryptoWallets
      summary: List my wallets
      description: Returns every wallet of the calling account, oldest first.
      responses:
        '200':
          description: The account's wallets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: '#/components/schemas/CryptoWallet'
              example:
                wallets:
                - wallet_id: b7e3a940-6f1d-4c2b-9a8e-5d4c3b2a1f0e
                  chain: tron
                  asset: USDT
                  address: TQmZ1kfWzcmRDYkqLnybXnbWzPMYNvbYqT
                  label: Main treasury
                  created_at: '2026-07-07T12:00:00Z'
                - wallet_id: a1c9d8e7-2b3c-4d5e-6f70-8a9b0c1d2e3f
                  chain: eth
                  asset: USDT
                  address: '0x8f3Bc55D9F4a2E71c06b9a3D2e1F0A9B8C7D6E5F'
                  label: E-commerce collections
                  created_at: '2026-07-07T12:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/payouts/qr/scan:
    post:
      tags:
      - Payouts
      operationId: payoutQrScan
      summary: Scan a payout QR (Bolivia, Brazil)
      description: 'Step 1 of the QR payout — Bolivia (local interoperable QR) and Brazil (PIX QR, including
        the "copia e cola" code): reads a collection QR and returns the recipient''s data plus the `provider_reference`
        needed to confirm. **Free of charge** — nothing is debited until the confirm step. Defaults to
        Bolivia; for Brazil send `country: "BR"` and `currency: "BRL"`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - qr_payload
              properties:
                country:
                  type: string
                  enum:
                  - BO
                  - BR
                  default: BO
                currency:
                  type: string
                  enum:
                  - BOB
                  - USD
                  - BRL
                  default: BOB
                qr_payload:
                  type: string
                  description: Raw content of the scanned QR (in Brazil, also the PIX "copia e cola" code).
            example:
              qr_payload: <QR content>
              currency: BOB
      responses:
        '200':
          description: Recipient data for user confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id:
                    type: string
                  provider_reference:
                    type: string
                  beneficiary_name:
                    type: string
                  destination_account:
                    type: string
                  amount:
                    type: string
                  currency:
                    type: string
                  glosa:
                    type: string
                  status:
                    type: string
              example:
                scan_id: 5c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
                provider_reference: QR-REF-889923
                beneficiary_name: Juan Quispe
                destination_account: '****4521'
                amount: '700.00'
                currency: BOB
                glosa: ''
                status: scanned
        '400':
          description: qr_payload missing (invalid_request).
          content:
            application/json:
              schema: &id009
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_request
                message: qr_payload is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '502':
          description: Core unavailable (core_unavailable).
          content:
            application/json:
              schema: *id009
              example:
                error: core_unavailable
                message: could not scan the QR
  /v1/payouts/qr/confirm:
    post:
      tags:
      - Payouts
      operationId: payoutQrConfirm
      summary: Confirm a QR payout (Bolivia, Brazil)
      description: 'Step 2 of the QR payout (Bolivia and Brazil/PIX), charged exactly like a regular payout:
        the local amount converts at **your account''s rate** and `usdt_amount + fixed fee` is debited.
        The result is **synchronous** — the response carries the final state (`completed`, or `failed`
        with an automatic refund). A scanned QR can only be paid once; requires an idempotency key like
        every money-moving operation.'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - provider_reference
              - amount
              properties:
                country:
                  type: string
                  enum:
                  - BO
                  - BR
                  default: BO
                currency:
                  type: string
                  enum:
                  - BOB
                  - USD
                  - BRL
                  default: BOB
                provider_reference:
                  type: string
                  description: From the scan step.
                amount:
                  type: string
                  description: Local amount as a positive decimal string.
                description:
                  type: string
                idempotency_key:
                  type: string
            example:
              provider_reference: QR-REF-889923
              amount: '700.00'
              currency: BOB
              description: QR lunch payment
              idempotency_key: qr-2026-07-07-a
      responses:
        '202':
          description: Final result (synchronous).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
              example:
                payout_id: 8e2a1b0c-9d8e-7f60-5a4b-3c2d1e0f9a8b
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                idempotency_key: qr-2026-07-07-a
                country: BO
                currency: BOB
                method: qr
                local_amount: '700.00'
                fx_rate: '6.91'
                usdt_amount: '101.302460'
                fee: '0.300000'
                total_debit: '101.602460'
                beneficiary: &id010
                  qr_reference: QR-REF-889923
                description: QR lunch payment
                status: completed
                status_code: ''
                status_message: ''
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:01Z'
        '200':
          description: Idempotency replay of an existing QR payout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
              example:
                payout_id: 8e2a1b0c-9d8e-7f60-5a4b-3c2d1e0f9a8b
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                idempotency_key: qr-2026-07-07-a
                country: BO
                currency: BOB
                method: qr
                local_amount: '700.00'
                fx_rate: '6.91'
                usdt_amount: '101.302460'
                fee: '0.300000'
                total_debit: '101.602460'
                beneficiary: *id010
                description: QR lunch payment
                status: completed
                status_code: ''
                status_message: ''
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:01Z'
                idempotency_hit: true
        '400':
          description: invalid_request / idempotency_key_required / invalid_amount
          content:
            application/json:
              schema: *id009
              example:
                error: invalid_request
                message: provider_reference (from the scan) is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          description: Account not active (account_blocked).
          content:
            application/json:
              schema: *id009
              example:
                error: account_blocked
                message: account is not active
        '422':
          description: Rejected by the processor; the debit was refunded (payout with status failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
              example:
                payout_id: 8e2a1b0c-9d8e-7f60-5a4b-3c2d1e0f9a8b
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                idempotency_key: qr-2026-07-07-a
                country: BO
                currency: BOB
                method: qr
                local_amount: '700.00'
                fx_rate: '6.91'
                usdt_amount: '101.302460'
                fee: '0.300000'
                total_debit: '101.602460'
                beneficiary: *id010
                description: QR lunch payment
                status: failed
                status_code: core_rejected
                status_message: QR already paid
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:01Z'
  /v1/payins/collect:
    post:
      tags:
      - Payins
      operationId: payinCollect
      summary: Active collection (pull)
      description: 'Charges the payer directly in corridors that support pull collections (e.g. Venezuela
        `c2p` / `debito_inmediato`). Synchronous: if the charge is approved the deposit converts at your
        current `payin_rate` and is credited in the same call, net of the payin fee. If the payer declines,
        `paid` is false, the payin is marked failed and nothing is charged.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - amount
              - idempotency_key
              properties:
                country:
                  type: string
                  default: VE
                currency:
                  type: string
                  default: VES
                method:
                  type: string
                  description: Collection method (e.g. c2p, debito_inmediato).
                amount:
                  type: string
                  description: Local amount as a positive decimal string.
                description:
                  type: string
                our_reference:
                  type: string
                payer_document:
                  type: string
                payer_phone:
                  type: string
                payer_bank:
                  type: string
                payer_account:
                  type: string
                payer_name:
                  type: string
                payer_account_type:
                  type: string
                otp:
                  type: string
                otp_reference:
                  type: string
                idempotency_key:
                  type: string
                  description: Required — a collect executes a real charge; retries with the same key
                    never re-charge.
            example:
              method: c2p
              amount: '1200.00'
              description: Order 5512
              payer_document: V12345678
              payer_phone: '04141234567'
              payer_bank: '0102'
              otp: '12345678'
              idempotency_key: collect-2026-07-07-a
      responses:
        '200':
          description: 'Collection result. `paid: true` means the deposit was credited.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                  kind:
                    type: string
                  country:
                    type: string
                  currency:
                    type: string
                  method:
                    type: string
                  local_amount:
                    type: string
                  status:
                    type: string
                  fx_rate:
                    type: string
                  usdt_gross:
                    type: string
                  fee:
                    type: string
                  usdt_credited:
                    type: string
                  paid:
                    type: boolean
                  provider_reference:
                    type: string
                  status_code:
                    type: string
                  status_message:
                    type: string
              example:
                payin_id: 7b3c9e2f-1a2b-3c4d-5e6f-7a8b9c0d1e2f
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: collect
                country: VE
                currency: VES
                method: c2p
                local_amount: '1200.00'
                status: credited
                reference: REF-102030
                fx_rate: '36.50'
                usdt_gross: '32.876712'
                fee: '0.300000'
                usdt_credited: '32.576712'
                paid: true
                provider_reference: PRV-889911
                status_code: '00'
                status_message: approved
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:02Z'
        '400':
          description: invalid_request / invalid_amount
          content:
            application/json:
              schema: &id011
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_request
                message: method is required (e.g. c2p, debito_inmediato)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account not active (account_blocked).
          content:
            application/json:
              schema: *id011
              example:
                error: account_blocked
                message: account is not active
        '502':
          description: Core unavailable (core_unavailable).
          content:
            application/json:
              schema: *id011
              example:
                error: core_unavailable
                message: could not execute the collection
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
