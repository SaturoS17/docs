webhooks:
  payin_credited:
    post:
      summary: Payin credited
      description: 'A fiat collection was received and credited to the account in USDT.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payin_id: &id017
                  type: string
                account_id: *id017
                country: *id017
                currency: *id017
                local_amount: *id017
                fx_rate: *id017
                usdt_credited: *id017
                fee: *id017
            example:
              payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              country: BO
              currency: BOB
              local_amount: '700.00'
              fx_rate: '6.91'
              usdt_credited: '100.302460'
              fee: '1.000000'
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  payin_expired:
    post:
      summary: Payin expired
      description: 'An active collection (QR or hosted checkout) reached a final state without receiving
        the payment: the payin moves from `pending` to `expired` (or `failed`). No funds move; create
        a new payin to retry the charge.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payin_id:
                  type: string
                account_id:
                  type: string
                status:
                  type: string
                  enum:
                  - expired
                  - failed
                country:
                  type: string
                currency:
                  type: string
                local_amount:
                  type: string
                reference:
                  type: string
            example:
              payin_id: 567d0d1a-49bc-437e-92e3-77e921112e49
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              status: expired
              country: BO
              currency: BOB
              local_amount: '60.99'
              reference: CBK7Q2M4XZ9P
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  payout_status_changed:
    post:
      summary: Payout status changed
      description: 'A payout reached a new state (processing, completed or failed).


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payout_id: *id017
                account_id: *id017
                country: *id017
                currency: *id017
                local_amount: *id017
                usdt_amount: *id017
                total_debit: *id017
                status: *id017
                status_code: *id017
            example:
              payout_id: 7d5c2f0a-1e9b-4a6d-8f3c-0b2a1d9e8c7f
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              country: MX
              currency: MXN
              local_amount: '1500.00'
              usdt_amount: '85.714286'
              total_debit: '86.014286'
              status: completed
              status_code: ''
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  transfer_received:
    post:
      summary: Transfer received
      description: 'The account received an internal transfer.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transfer_id: *id017
                from_account_id: *id017
                to_account_id: *id017
                asset: *id017
                amount: *id017
                description: *id017
                created_at: *id017
            example:
              transfer_id: 2a7b9c1d-4e5f-6a70-8b9c-0d1e2f3a4b5c
              from_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              to_account_id: 5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b
              asset: USDT
              amount: '25.000000'
              description: Expense split
              created_at: '2026-07-07T12:00:00Z'
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  crypto_deposit_credited:
    post:
      summary: Crypto deposit credited
      description: 'An on-chain deposit was confirmed and credited (net of the funding fee) to the balance
        of the wallet''s asset (`USDT` or `USDC`).


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id: *id017
                chain: *id017
                asset: *id017
                tx_id: *id017
                amount: *id017
                fee: *id017
            example:
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              chain: tron
              asset: USDT
              tx_id: b1946ac92492d2347c6235b4d2611184e0f0f8c9d3a1e2b3c4d5e6f708192a3b
              amount: '499.000000'
              fee: '1.000000'
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  crypto_deposit_held:
    post:
      summary: Crypto deposit held for compliance review
      description: An incoming on-chain deposit was NOT credited because the sender address shows severe
        risk (sanctions / direct illicit funds). The operator's compliance team reviews the hold and releases
        (credits) or rejects it.
      requestBody:
        content:
          application/json:
            example:
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              hold_id: c1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e5f
              chain: tron
              asset: usdt
              tx_id: 8a5b3c92492d2347c6235b4d2611184e0f0f8c9d3a1e2b3c4d5e6f708192a3b1
              risk: Severe
              status: held
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  crypto_deposit_alert:
    post:
      summary: Crypto deposit credited with a risk alert
      description: An incoming deposit was credited normally, but the sender address shows high risk.
        Informational — no action is required on the funds.
      requestBody:
        content:
          application/json:
            example:
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              chain: tron
              asset: usdt
              tx_id: 9c6d4e92492d2347c6235b4d2611184e0f0f8c9d3a1e2b3c4d5e6f708192a3b2
              risk: High
              status: credited
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  crypto_withdrawal_status_changed:
    post:
      summary: Crypto withdrawal status changed
      description: 'An on-chain withdrawal reached a new state.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                withdrawal_id: *id017
                account_id: *id017
                chain: *id017
                asset: *id017
                tx_id: *id017
                status: *id017
                amount: *id017
            example:
              withdrawal_id: 6c5d4e3f-2a1b-0c9d-8e7f-6a5b4c3d2e1f
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              chain: tron
              asset: USDT
              tx_id: b1946ac92492d2347c6235b4d2611184e0f0f8c9d3a1e2b3c4d5e6f708192a3b
              status: completed
              amount: '100.000000'
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  banking_customer_status_changed:
