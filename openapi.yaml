  /v1/payouts:
    post:
      tags:
      - Payouts
      operationId: createPayout
      summary: Create a payout
      description: 'Disperses fiat to a local bank account. The local amount converts to USDT at **your
        account''s rate** (the same one returned by `GET /v1/rates`); `usdt_amount` plus the fixed fee
        (when configured) is debited and held until the dispersal completes. If it fails, the full debit
        is refunded.


        **Pay from any balance**: by default the debit comes from your account''s default settlement asset
        (USDT unless changed via `PUT /v1/settlement`). Send `settlement_asset` (USDT, USDC, BTC or GOLD)
        to pay this specific operation from another balance: the USDT total converts to that asset at
        the effective settlement price of the moment (see the `settlement` block in `GET /v1/rates`) and
        the debit, hold and — if it fails — the refund all live in that asset for the exact same amount.
        If the execution price for BTC/GOLD is unavailable the request returns `503 pricing_unavailable`;
        volatile assets also have a per-operation limit (`422 settlement_limit_exceeded`).


        Requires an idempotency key (body field or `Idempotency-Key` header). Retrying with the same key
        returns the original payout (`200` with `idempotency_hit: true`).'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              - currency
              - amount
              properties:
                country:
                  type: string
                  description: ISO 3166-1 alpha-2 destination country (e.g. CL, PE, MX).
                currency:
                  type: string
                  description: Local currency (e.g. CLP, PEN, MXN).
                method:
                  type: string
                  description: Payout method from `GET /v1/payouts/methods` (e.g. `bank_transfer`).
                amount:
                  type: string
                  description: Local currency amount as a positive decimal string.
                  example: '50000.00'
                beneficiary:
                  type: object
                  additionalProperties:
                    type: string
                  description: 'Destination account details. Required keys depend on the

                    country and method; see `GET /v1/payouts/methods` and

                    `GET /v1/payouts/banks`. Examples: RUT + bank in Chile, CLABE in

                    Mexico, CCI in Peru. Brazil PIX: `pix_key` + `pix_key_type` (cpf,

                    cnpj, phone, email, evp), or a bank account without key using

                    `bank_code` (ISPB) + `branch_code` + `account_number` + `tax_id`.

                    '
                beneficiary_contact_id:
                  type: string
                  format: uuid
                  description: Use the contact's most recent saved beneficiary for this country (and method,
                    when sent) instead of typing `beneficiary` again. An explicit `beneficiary` always
                    wins; 422 no_saved_destination if the contact has none.
                save_contact:
                  type: boolean
                  default: true
                  description: The beneficiary is saved as a contact automatically; send false to skip
                    it.
                description:
                  type: string
                settlement_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: Virtual balance to debit for this operation. Omit to use your account's
                    default settlement asset (USDT unless changed via `PUT /v1/settlement`).
                idempotency_key:
                  type: string
            examples:
              cl_bank_transfer:
                summary: Chile — bank transfer (CLP)
                value:
                  country: CL
                  currency: CLP
                  method: bank_transfer
                  amount: '100000'
                  beneficiary:
                    name: Pedro Soto Fuentes
                    tax_id: 12.345.678-5
                    bank_code: '012'
                    account_type: checking
                    account_number: '123456789'
                  description: Supplier payment
                  idempotency_key: cl-prov-0091
              pe_bank_transfer:
                summary: Peru — bank transfer via CCI (PEN)
                value:
                  country: PE
                  currency: PEN
                  method: bank_transfer
                  amount: '1000.00'
                  beneficiary:
                    name: Rosa Alvarez Diaz
                    account_number: 00219300123456789012
                  idempotency_key: pe-cci-3310
              pe_yape:
                summary: Peru — Yape to a phone number (PEN)
                value:
                  country: PE
                  currency: PEN
                  method: yape
                  amount: '150.00'
                  beneficiary:
                    name: Luis Ramos Vega
                    phone: '51987654321'
                  idempotency_key: pe-yape-8874
              mx_clabe:
                summary: Mexico — SPEI to a CLABE (MXN)
                value:
                  country: MX
                  currency: MXN
                  method: bank_transfer
                  amount: '1500.00'
                  beneficiary:
                    name: Maria Lopez
                    account_type: clabe
                    account_number: 012180001234567895
                  idempotency_key: mx-clabe-8841
              mx_debit_card:
