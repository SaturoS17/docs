                  type: string
                  description: Your reference for the verified customer.
                idempotency_key:
                  type: string
                person:
                  type: object
                  description: Person fields (first_name, last_name, email, phone, nationality, date_of_birth,
                    tax_id, id_type, id_number, address, primary_purpose, most_recent_occupation, source_of_funds).
                metadata:
                  type: object
            example:
              external_customer_id: cust_789
              idempotency_key: kyc-sub-cust-789-1
              person:
                first_name: Ana
                last_name: Perez
                email: ana@example.com
                phone: '+56912345678'
                nationality: CHL
                date_of_birth: '1990-04-12'
                tax_id: 12.345.678-5
                id_type: id_card
