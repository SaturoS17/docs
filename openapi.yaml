                  compliance_fee:
                    type: string
              example:
                customer_id: e1d2c3b4-a596-8778-695a-4b3c2d1e0f9a
                status: completed
                screening_result: no_hits
                compliance_service: compliance_rescreen
                compliance_fee: '1.000000'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: Account has no prior screening (`no_kyc`).
          content:
            application/json:
              schema:
