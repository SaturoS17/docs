  /v1/me/verification/link:
    post:
      tags:
      - KYC / KYB
      operationId: createMyVerificationLink
      summary: Request my onboarding verification link
      description: 'Returns the account''s own identity-verification link (person accounts get a KYC link,
        company accounts a KYB link — derived from the account type). The hosted wizard covers the full
        flow: form, document uploads and video liveness. Free. If an open link already exists it is returned
        with 200; an already-approved account gets 409 already_verified. Until the account''s verification
        is approved, every outgoing-money action answers 403 verification_required (funding and reads
        stay available).'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days:
                  type: integer
                  description: Optional link expiry (1-30 days). Omitted, the link never expires.
            example:
              expires_in_days: 14
      responses:
        '201':
          description: Onboarding link created (200 when an open link is reused).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationLink'
              example:
                link_id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                kind: kyc
                url: https://verify.example.com/on/usd/individual/new?invite=abc123
                status: pending
                label: Ana Perez
                created_at: '2026-07-10T12:00:00Z'
                updated_at: '2026-07-10T12:00:00Z'
        '409':
          description: The account already completed its verification (already_verified).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: already_verified
                message: this account already completed its identity verification
        '403':
          $ref: '#/components/responses/AccountRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
