                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  source_of_income:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  source_of_wealth:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  industries:
