  /v1/payins:
    post:
      tags:
      - Payins
      operationId: createPayin
      summary: Create a payin (top-up charge)
      description: 'Creates a fiat top-up. With `method: "qr"` (default) an active QR charge is generated
        through the processor — in Bolivia the local interoperable QR, in Brazil a dynamic PIX QR whose
        `charge` carries the QR image and the "copia e cola" payload. With `method: "bank_transfer"` the
        deposit is announced and the response carries the reference the sender must include so the arriving
        transfer is matched and credited automatically — a short 12-character alphanumeric code that fits
        any bank concept field (some rails cap it at 20 characters with no special characters). With `method:
        "fintoc"` (Chile) the response carries a hosted `payment_url`: the payer opens it and transfers
        from any Chilean bank or wallet; the deposit is detected, validated and credited automatically.
        Charging is free; the payin fee applies when the deposit is credited.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              - currency
              - amount
              properties:
                country:
                  type: string
                  example: BO
                currency:
                  type: string
                  example: BOB
                amount:
                  type: string
                  description: Local currency amount as a positive decimal string.
                description:
                  type: string
                channel:
                  type: string
                  description: Optional channel hint passed to the core.
                expires_in:
                  type: integer
                  description: Charge expiration in seconds.
                method:
                  type: string
                  enum:
                  - qr
                  - bank_transfer
                  - fintoc
                  default: qr
                  description: Collection mode. `qr` creates an active QR charge through the processor;
                    `bank_transfer` announces an incoming deposit and returns the reference to include
                    in the transfer description; `fintoc` (Chile only) returns a hosted `payment_url`
                    where the payer transfers from any Chilean bank or wallet and the deposit is detected
                    automatically. Use /v1/payins/collect for pull collections.
                idempotency_key:
                  type: string
                  description: Optional idempotency key (`fintoc` method; also accepted as the `Idempotency-Key`
                    header). A retry with the same key returns the original payin and its `payment_url`
                    instead of opening a second payment session.
            examples:
              bo_qr:
                summary: Bolivia — QR charge (BOB)
                value:
                  country: BO
                  currency: BOB
                  method: qr
                  amount: '700.00'
                  description: App top-up
                  expires_in: 3600
              br_pix_qr:
                summary: Brazil — dynamic PIX QR (BRL)
                value:
                  country: BR
                  currency: BRL
                  method: qr
                  amount: '120.00'
                  description: Order 7719
                  expires_in: 1800
              cl_announced_transfer:
                summary: Chile — announced bank transfer (CLP)
                value:
                  country: CL
                  currency: CLP
                  method: bank_transfer
                  amount: '500000'
              py_announced_transfer:
                summary: Paraguay — announced bank transfer (PYG, integer amounts)
                value:
                  country: PY
                  currency: PYG
                  method: bank_transfer
                  amount: '596000'
              cl_fintoc:
                summary: Chile — hosted payment page, any bank (CLP)
                value:
                  country: CL
                  currency: CLP
                  method: fintoc
                  amount: '150000'
                  description: Top-up order 8841
                  idempotency_key: topup-8841
      responses:
        '201':
          description: Charge created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: pending
                  charge:
                    type: object
                    description: Charge details (QR data, references) from the core.
              examples:
                qr:
                  summary: 'QR charge (method: qr)'
                  value:
                    payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
                    status: pending
                    charge:
                      charge_id: c9d8e7f6-a5b4-c3d2-e1f0-a9b8c7d6e5f4
                      our_reference: QR-778812
                      qr_image: data:image/png;base64,iVBORw0KGgo…
                      qr_image_url: https://cdn.cbpayapp.com/public/payin-qr/c9d8e7f6-a5b4-c3d2-e1f0-a9b8c7d6e5f4.png
                bank_transfer:
                  summary: 'Announced deposit (method: bank_transfer)'
                  value:
                    payin_id: 4f81c1d0-aaaa-bbbb-cccc-ddddeeeeffff
                    status: pending
                    reference: CBJ6T3W9M2K5
                    note: include the reference in the transfer description so the deposit is credited
                      automatically
                fintoc:
                  summary: 'Hosted payment page (method: fintoc, Chile)'
                  value:
                    payin_id: 7a2b3c4d-1111-2222-3333-444455556666
                    status: pending
                    reference: 7a2b3c4d-1111-2222-3333-444455556666
                    payment_url: https://pay.fintoc.com/plink_K2zwNNSxPyx8w3GZ
                    expires_at: '2026-07-08T18:48:25Z'
                    note: share the payment_url with the payer; the deposit is credited automatically
                      once the transfer is detected
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '422':
          description: The core rejected the charge (`core_rejected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: core_rejected
                message: amount is below the minimum for this corridor
        '502':
          description: Core unavailable (`core_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: core_unavailable
                message: could not create the charge
        '401':
          $ref: '#/components/responses/Unauthorized'
