openapi: 3.1.0
info:
  title: CBPay API
  version: '1.63'
  description: 'CBPay is a multi-currency payment platform: fiat payouts and collections

    across Latin America, internal transfers, on-chain funding and

    withdrawals, and KYC screening. Every account holds four independent

    virtual balances — USDT (the operating currency), USDC, BTC and GOLD

    (grams of fine gold) — that never mix or convert automatically.

    Payouts and service fees can be paid from any of the four balances:

    set a default with `PUT /v1/settlement` or override per payout with

    `settlement_asset`.


    All amounts are decimal strings in each currency''s precision (6 decimals

    for USDT/USDC/GOLD, 8 for BTC). Errors always return

    `{"error": "<code>", "message": "<detail>"}`.

    '
servers:
- url: https://api.qbank.cl/platform
  description: Live (production, real money)
- url: https://cryptobank.qbank.cl/platform
  description: Test (sandbox, simulated money — pk_test_ keys)
security:
- bearerAuth: []
tags:
- name: Receipts
  description: Branded PDF receipt per operation, with a public signed-QR authenticity check, receipt_url
    on every response/webhook and automatic email delivery on final states.
- name: Authentication
  description: Register and log in account members. Sessions last 24 hours.
- name: Account
  description: Profile, members and API keys of the calling account.
- name: Balances
  description: Balances, movement history and FX rates.
- name: Payouts
  description: Fiat dispersals debited from the settlement balance of your choice (USDT by default).
- name: Payins
  description: Fiat top-ups credited to the USDT balance.
- name: Transfers
- name: Contacts
- name: Swaps
  description: Free internal transfers between CBPay accounts (person or company, any combination).
- name: Crypto
  description: On-chain USDT funding and withdrawals (TRON and Ethereum).
- name: Segregated wallets
  description: On-chain wallets with their own balance (companies unlimited; persons 1 per network+asset
    pair) — create, import, send, export the private key and auto-forward. The balance lives on-chain,
    never in the ledger.
- name: KYC / KYB
- name: AML screening
  description: 'Identity verification: KYC for persons, KYB for companies, with AML screening, rescreening
    and continuous monitoring.'
- name: Wallet screening
  description: AML risk assessment of blockchain addresses (sanctions, illicit-fund exposure) with a per-scan
    fee, plus free automatic protection on withdrawals and deposits.
- name: Analytics
- name: Webhooks
  description: Subscriptions to receive signed event notifications.
- name: Status
  description: Service availability.
- name: Banking
  description: 'Real bank accounts: receive, hold and send money over international banking rails.'
- name: Cards
  description: Virtual and physical cards that spend Just-In-Time from the account's USDT balance, with
    per-card spending limits.
- name: Security (OTP)
  description: One-time verification codes over SMS/WhatsApp/email protecting sensitive actions, plus
    self-service 2FA preferences. Applies to user sessions only — API keys are exempt.
- name: Passkeys
  description: Passwordless sign-in with the device's biometrics (Face ID, Touch ID, Windows Hello, security
    keys) via WebAuthn, authenticator apps (TOTP) with backup codes, and session/device management.
- name: Social login
  description: Passwordless sign up and sign in with Google, Apple, Microsoft and Facebook via token exchange.
    The front end obtains the provider credential; the API verifies it and issues the CBPay session.
paths:
  /v1/payouts/{payoutID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getPayoutReceipt
      summary: Download the payout receipt (PDF)
      description: Branded PDF receipt of the payout, with the beneficiary data, amounts, status badge
        and the signed verification QR. Non-final states carry a diagonal watermark. Only the payout's
        owner (or the org admin) can download it.
      parameters:
      - name: payoutID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/payins/{payinID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getPayinReceipt
      summary: Download the payin receipt (PDF)
      description: Branded PDF receipt of the collection, with the reference, amounts, status badge and
        the signed verification QR. Non-final states carry a diagonal watermark.
      parameters:
      - name: payinID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/transfers/{transferID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getTransferReceipt
      summary: Download the transfer receipt (PDF)
      description: Branded PDF receipt of the internal transfer (both parties can download it; the counterparty
        is shown by display name).
      parameters:
      - name: transferID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/crypto/withdrawals/{withdrawalID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getCryptoWithdrawalReceipt
      summary: Download the crypto withdrawal receipt (PDF)
      description: Branded PDF receipt of the on-chain withdrawal, with the network, destination address,
        tx hash and the signed verification QR.
      parameters:
      - name: withdrawalID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/crypto/deposits/{depositID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getCryptoDepositReceipt
      summary: Download the crypto deposit receipt (PDF)
      description: Branded PDF receipt of a credited on-chain deposit. The `depositID` is the `deposit_id`
        field returned by `GET /v1/crypto/transactions`.
      parameters:
      - name: depositID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/swaps/{swapID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getSwapReceipt
      summary: Download the swap receipt (PDF)
      description: Branded PDF receipt of the balance conversion, with both legs, the applied rate and
        the signed verification QR.
      parameters:
      - name: swapID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/cards/{cardID}/transactions/{transactionID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getCardTransactionReceipt
      summary: Download the card purchase receipt (PDF)
      description: Branded PDF receipt of a card transaction, with the merchant, USD amount, debited balance
        and the signed verification QR.
      parameters:
      - name: cardID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: transactionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/banking/operations/{operationID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getBankingOperationReceipt
      summary: Download the banking operation receipt (PDF)
      description: Branded PDF receipt of a banking operation (amount, currency, counterparty, status)
        with the signed verification QR. Available for operations created after the traceability mirror
        went live.
      parameters:
      - name: operationID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/segregated-wallets/{walletID}/sends/{sendID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getWalletSendReceipt
      summary: Download the segregated wallet send receipt (PDF)
      description: Branded PDF receipt of an on-chain send from a segregated wallet, with the network,
        destination address, tx hash and the signed verification QR.
      parameters:
      - name: walletID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sendID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/segregated-wallets/{walletID}/deposits/{depositID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getWalletDepositReceipt
      summary: Download the segregated wallet deposit receipt (PDF)
      description: Branded PDF receipt of an on-chain deposit received by a segregated wallet, with the
        network, origin address, tx hash and the signed verification QR.
      parameters:
      - name: walletID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: depositID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /verify/receipts/{code}:
    get:
      security: []
      tags:
      - Receipts
      operationId: verifyReceipt
      summary: Verify a receipt's authenticity (public)
      description: 'Public endpoint (no credentials) behind the QR printed on every receipt. The code
        is cryptographically signed: a tampered or made-up one answers 404 with `valid: false`. The response
        shows the operation''s REAL current status and amount — never the beneficiary''s personal data.
        Browsers get a branded HTML page; API clients get JSON. Rate limited per IP.'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Verification code printed on the receipt (also embedded in the QR URL).
      responses:
        '200':
          description: The receipt is authentic; current facts of the operation.
          content:
            application/json:
              example:
                valid: true
                type: payout
                status: ok
                raw_status: completed
                amount: 800.00 VES
                detail: Venezuela — Pago Móvil
                date: 2026-07-11 15:29 UTC
                issued_by: CBPay
        '404':
          description: Invalid, tampered or unknown verification code.
          content:
            application/json:
              example:
                valid: false
                message: this verification code does not correspond to any receipt issued by this platform
        '429':
          description: Too many verification attempts from this IP.
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many verification attempts; wait a moment and retry
  /v1/branding:
    get:
      tags:
      - Account
      operationId: getBranding
      summary: Get the platform branding
      description: Effective branding of the platform you operate on (name, colors, logos in base64) so
        a white-label front end can theme itself from the API instead of hardcoding assets. `logo_url`/`symbol_url`
        are public CDN URLs for the same logos — prefer them over the base64 payloads. Read-only, no PII.
      responses:
        '200':
          description: Effective branding.
          content:
            application/json:
              example:
                brand_name: CBPay
                website: www.cbpayapp.com
                footer_address: 'Miami: 25 SW 9th STREET, Suite 406, Miami, FL 33130'
                support_email: ''
                colors:
                  primary: '#FBC140'
                  header: '#2E2E2E'
                  accent: '#A16207'
                logo_png_base64: iVBORw0KGgoAAAANSUhEUg...
                symbol_png_base64: iVBORw0KGgoAAAANSUhEUg...
                logo_url: https://cdn.cbpayapp.com/public/branding/default/logo.png
                symbol_url: https://cdn.cbpayapp.com/public/branding/default/symbol.png
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/register:
    post:
      tags:
      - Authentication
      security: []
      operationId: register
      summary: Register an account
      description: 'Creates a person or company account with its owner login member and

        returns a session token. One endpoint for both types: `type` is data.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - type
              - email
              - password
              - display_name
              properties:
                org:
                  type: string
                  description: CBPay organization slug (`cbpay`).
                type:
                  type: string
                  enum:
                  - person
                  - company
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                display_name:
                  type: string
                tax_id:
                  type: string
                phone:
                  type: string
                country:
                  type: string
                  description: ISO 3166-1 alpha-2 country code.
                profile:
                  type: object
                  description: Free-form profile data.
            example:
              org: cbpay
              type: person
              email: ana@example.com
              password: a-secure-password
              display_name: Ana Perez
              country: CL
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
                  access_token:
                    type: string
                    description: Session JWT, valid for 24 hours.
                  expires_at:
                    type: string
                    format: date-time
                  refresh_token:
                    type: string
                    description: Single-use rotating refresh token for `POST /v1/auth/refresh`.
                  refresh_expires_at:
                    type: string
                    format: date-time
              example:
                account: &id001
                  id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  org_id: 1c9e7a2b-5f6d-4e3a-8c1b-2a9d8e7f6a5b
                  type: person
                  status: active
                  kyc_status: approved
                  email: ana@example.com
                  display_name: Ana Perez
                  tax_id: 12345678-9
                  phone: '+56912345678'
                  country: CL
                  profile: &id002 {}
                  created_at: '2026-07-07T12:00:00Z'
                  updated_at: '2026-07-07T12:00:00Z'
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                expires_at: '2026-07-08T12:00:00Z'
                refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                refresh_expires_at: '2026-08-06T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Service suspended (`org_suspended`); contact the CBPay team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: org_suspended
                message: organization is not active
        '409':
          description: An account with that email already exists (`duplicate`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: duplicate
                message: resource already exists
  /v1/auth/environment-handoff:
    post:
      tags:
      - Authentication
      operationId: createEnvironmentHandoff
      summary: Get a test-mode handoff token
      description: 'Issues a single-use token (60-second TTL) that moves the CURRENT member session to
        the test environment — this is what powers the dashboard''s one-click test/live switch, with no
        second login and no new OTP challenge. Only the live environment issues handoffs, and only member
        sessions (JWT) can request one: API keys never switch environments (each environment manages its
        own keys).'
      responses:
        '201':
          description: Handoff token issued. Exchange it right away at the test environment's `POST /v1/auth/handoff`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  handoff_token:
                    type: string
                    description: Single-use signed token (expires in 60 seconds).
                  expires_at:
                    type: string
                    format: date-time
                  exchange_url:
                    type: string
                    description: Test-environment URL where the token is exchanged.
              example:
                handoff_token: eyJqdGkiOiI2ZjFjMDJhYS0uLi4ifQ.9zXk1v…
                expires_at: '2026-07-13T12:01:00Z'
                exchange_url: https://cryptobank.qbank.cl/platform/v1/auth/handoff
        '403':
          description: The caller is not a member session (`session_required`) — API keys cannot switch
            environments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: session_required
                message: environment handoff requires a member session
  /v1/auth/handoff:
    post:
      tags:
      - Authentication
      security: []
      operationId: exchangeEnvironmentHandoff
      summary: Exchange a handoff token for a test session
      description: Test environment only (live always answers 404). Exchanges the single-use token issued
        by `POST /v1/auth/environment-handoff` in live for a session of the test environment. If the account
        does not exist in test yet, its mirror is provisioned automatically — the test mode always exists
        for every user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  description: The `handoff_token` issued by the live environment.
            example:
              token: eyJqdGkiOiI2ZjFjMDJhYS0uLi4ifQ.9zXk1v…
      responses:
        '200':
          description: Test session issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  refresh_token:
                    type: string
                  refresh_expires_at:
                    type: string
                    format: date-time
                  account:
                    type: object
                    description: The mirror account in the test environment.
                  livemode:
                    type: boolean
                    description: Always false in the test environment.
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                expires_at: '2026-07-14T12:00:00Z'
                refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                refresh_expires_at: '2026-08-12T12:00:00Z'
                account:
                  id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  type: person
                  display_name: Ana Test
                livemode: false
        '401':
          description: The token is invalid, expired or was already used (`invalid_handoff`, `handoff_replayed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_handoff
                message: handoff token is invalid or expired
  /v1/auth/login:
    post:
      tags:
      - Authentication
      security: []
      operationId: login
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - email
              - password
              properties:
                org:
                  type: string
                  description: CBPay organization slug (`cbpay`).
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              org: cbpay
              email: ana@example.com
              password: a-secure-password
      responses:
        '200':
          description: Session issued — or, when the account's policy requires OTP on login, an intermediate
            response with `otp_required` true and a `pending_token` to exchange at `POST /v1/auth/login/otp`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  refresh_token:
                    type: string
                    description: Single-use rotating refresh token (`rt_…`) to renew the session at `POST
                      /v1/auth/refresh` without re-login.
                  refresh_expires_at:
                    type: string
                    format: date-time
                  account_id:
                    type: string
                    format: uuid
                  role:
                    type: string
                    enum:
                    - owner
                    - operator
                    - viewer
                  otp_required:
                    type: boolean
                    description: Present (true) when the login needs a second step.
                  pending_token:
                    type: string
                    description: Intermediate token for `POST /v1/auth/login/otp`. It cannot authenticate
                      API requests.
                  challenge_id:
                    type: string
                    format: uuid
                  channel:
                    type: string
                    enum:
                    - sms
                    - whatsapp
                  phone:
                    type: string
                    description: Masked phone the code was sent to.
              examples:
                session:
                  summary: Session issued (no OTP policy)
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                    expires_at: '2026-07-08T12:00:00Z'
                    refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    refresh_expires_at: '2026-08-06T12:00:00Z'
                    account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                    role: owner
                otpRequired:
                  summary: Two-step login (OTP policy active)
                  value:
                    otp_required: true
                    pending_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                    challenge_id: 6f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                    channel: sms
                    phone: '********5678'
                    expires_at: '2026-07-08T21:10:00Z'
                    note: verify the code with POST /v1/auth/login/otp to receive the session token
        '401':
          description: Email or password is incorrect (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_credentials
                message: email or password is incorrect
  /v1/auth/login/otp:
    post:
      tags:
      - Authentication
      security: []
      operationId: loginOTP
      summary: Complete two-step login
      description: Exchanges the `pending_token` from `POST /v1/auth/login` plus the OTP code received
        over SMS/WhatsApp for the real session token. The pending token expires after 10 minutes and can
        never call the API by itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pending_token
              - code
              properties:
                pending_token:
                  type: string
                code:
                  type: string
                  minLength: 4
                  maxLength: 10
            example:
              pending_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
              code: '482913'
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  refresh_token:
                    type: string
                  refresh_expires_at:
                    type: string
                    format: date-time
                  account_id:
                    type: string
                    format: uuid
                  role:
                    type: string
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                expires_at: '2026-07-09T21:00:00Z'
                refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                refresh_expires_at: '2026-08-07T21:00:00Z'
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                role: owner
        '401':
          description: The code is wrong (`invalid_code`) or the pending token expired (`invalid_pending_token`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_code
                message: the code is incorrect; check it and try again
        '409':
          description: The challenge expired or was already used (`challenge_not_pending`); log in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: challenge_not_pending
                message: the challenge already expired or was used; log in again
  /v1/auth/refresh:
    post:
      tags:
      - Authentication
      security: []
      operationId: refreshSession
      summary: Refresh the session
      description: 'Exchanges a single-use refresh token (`rt_…`, issued with every login) for a fresh
        access token + refresh token pair without asking for credentials again. Strict rotation: the previous
        access token of that device is revoked on exchange, and presenting an already-exchanged refresh
        token revokes the device''s entire token chain (theft response) and records a `refresh_token_reuse`
        security event. Refresh tokens last 30 days per rotation with an absolute cap of 90 days from
        the original login; signing out, revoking sessions or changing the password also invalidates them.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: The `rt_…` token from the last login or refresh.
            example:
              refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      responses:
        '200':
          description: New pair issued; the previous pair is now invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  refresh_token:
                    type: string
                    description: Replaces the exchanged token (single use).
                  refresh_expires_at:
                    type: string
                    format: date-time
                  account_id:
                    type: string
                    format: uuid
                  role:
                    type: string
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                expires_at: '2026-07-15T12:00:00Z'
                refresh_token: rt_9f2b1c30-51ab-4dd0-93e2-7a6b5c4d3e2f.YYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY
                refresh_expires_at: '2026-08-13T12:00:00Z'
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                role: owner
        '401':
          description: The refresh token is invalid, expired, already used or revoked (`invalid_refresh_token`).
            Send the user back to the login screen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_refresh_token
                message: the refresh token is invalid or expired; log in again
        '429':
          description: Too many refresh attempts from this address (`too_many_attempts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: too_many_attempts
                message: too many refresh attempts from this address; retry later
  /v1/auth/oauth:
    post:
      tags:
      - Social login
      security: []
      operationId: oauthLogin
      summary: Sign in or register with a social provider
      description: Token exchange. The front end obtains the provider credential (Google/Apple/Microsoft
        `id_token`, Facebook `access_token`) and posts it here. The API verifies it against the provider
        and returns the CBPay session — creating the account on first use. Respects the account's OTP-on-login
        policy (may return `otp_required`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - provider
              - credential
              properties:
                org:
                  type: string
                  description: CBPay organization slug (`cbpay`).
                provider:
                  type: string
                  enum:
                  - google
                  - apple
                  - microsoft
                  - facebook
                credential:
                  type: string
                  description: Provider credential from the front-end SDK.
                type:
                  type: string
                  enum:
                  - person
                  - company
                  description: Account type when creating a new account (default person; ignored if it
                    already exists).
            example:
              org: cbpay
              provider: google
              credential: eyJhbGciOiJSUzI1Ni…
              type: person
      responses:
        '200':
          description: Existing user signed in (or `otp_required` when the account enforces OTP on login).
          content:
            application/json:
              example:
                access_token: eyJhbGciOiJIUzI1Ni…
                expires_at: '2026-07-09T21:00:00Z'
                refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                refresh_expires_at: '2026-08-07T21:00:00Z'
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                role: owner
        '201':
          description: New account created and signed in.
          content:
            application/json:
              example:
                account:
                  id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  type: person
                  email: ana@gmail.com
                  display_name: Ana
                access_token: eyJhbGciOiJIUzI1Ni…
                expires_at: '2026-07-09T21:00:00Z'
                refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                refresh_expires_at: '2026-08-07T21:00:00Z'
                created: true
        '401':
          description: The credential is invalid, expired or from another app (`invalid_credential`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_credential
                message: the login credential is invalid or expired
        '400':
          description: Unknown org, invalid provider, or provider not enabled for the org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: provider_not_configured
                message: this login provider is not enabled for this organization
        '409':
          description: An account with this email already exists (`email_conflict`); sign in and link
            from your session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: email_conflict
                message: an account with this email already exists; sign in with your current method and
                  link this provider from your session
  /v1/auth/oauth/providers:
    get:
      tags:
      - Social login
      security: []
      operationId: oauthProviders
      summary: List enabled social providers
      description: Public. Returns the social providers enabled for the org and their `client_id`, so
        the front end can render the right buttons.
      parameters:
      - name: org
        in: query
