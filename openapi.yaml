  /v1/banking/customer:
    post:
      tags:
      - Banking
      operationId: createBankingCustomer
      summary: Create my banking profile
      description: Opens the account's banking profile (once per account). Omitted `type`/`name`/`email`
        autofill from the CBPay account. Billed as the fixed `banking_customer` fee from the USDT balance;
        refunded if the corridor rejects.
