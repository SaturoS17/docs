  /v1/otp/challenges/{challengeID}/verify:
    post:
      tags:
      - Security (OTP)
      operationId: verifyOTPChallenge
      summary: Verify the code
      description: Validates the code received over SMS/WhatsApp and returns the single-use `otp_token`
        that authorizes the protected action (send it in the `X-OTP-Token` header). 5 attempts per challenge.
      parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 10
            example:
              code: '482913'
      responses:
        '200':
          description: Code approved; single-use token issued.
          content:
            application/json:
              example:
                challenge_id: 6f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                action: payout
                otp_token: otp_Zk9uY2XIr1EYE0lq8xqlM3VayVZYX4aa11bb22cc33
                expires_at: '2026-07-08T21:10:00Z'
                note: 'single use: send it in the X-OTP-Token header of the protected action'
        '401':
          description: The code is incorrect (`invalid_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_code
                message: the code is incorrect; check it and try again
        '409':
          description: The challenge expired or was already used (`challenge_not_pending`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: challenge_not_pending
                message: the challenge already expired or was used; create a new one
        '404':
          $ref: '#/components/responses/NotFound'
