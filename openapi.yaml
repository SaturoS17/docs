  /v1/crypto/withdrawals:
    post:
      tags:
      - Crypto
      operationId: createCryptoWithdrawal
      summary: Create an on-chain withdrawal
      description: 'Sends USDT or USDC on-chain from its own balance. Supported pairs: `tron`/`USDT`,
        `eth`/`USDT`, `eth`/`USDC` (BTC and GOLD have no on-chain rail). `amount + withdrawal fee` is
        debited atomically and held; final state arrives via the `crypto_withdrawal_status_changed` webhook.
        `failed` refunds the full debit.'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
