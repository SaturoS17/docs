      operationId: getRates
      summary: Get my FX rates and fees
      description: Returns the exchange rates that apply to the calling account for each country — the
        same rates used when operations execute (`local_amount / rate = USDT`) — plus the account's fee
        configuration so clients can compute net prices. `rate` is the payout (dispersal) side and
        `payin_rate` the payin (deposit) side. `asset_prices` carries the display-only USD reference
        price of each virtual balance asset (BTC per unit, GOLD per gram; stablecoins are 1 by
        convention) — no conversion and no spread.
      responses:
        '200':
          description: Rates, reference asset prices and fees.
          content:
            application/json:
              schema:
                type: object
                properties:
                  base:
                    type: string
                    example: USD
                  rates:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: CLP
                        rate:
                          type: string
                          description: Rate applied to payouts (dispersals).
                          example: '950.123456'
                        payin_rate:
                          type: string
                          description: Rate applied to payins (fiat deposits/collections).
                          example: '955.10'
                  asset_prices:
                    type: object
                    description: Display-only USD reference price per virtual balance asset.
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: USD
                        unit:
                          type: string
                          description: Unit the price refers to (`btc`, `gram`, `usdt`, `usdc`).
                          example: gram
                        price:
                          type: string
                          example: '107.5341'
