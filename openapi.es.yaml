  /v1/payins/collect:
    post:
      tags:
      - Payins
      operationId: payinCollect
      summary: Cobro activo (pull)
      description: 'Cobra al pagador directamente en los corredores que soportan cobros pull (ej. Venezuela
        `c2p` / `debito_inmediato`). Síncrono: si el cobro se aprueba, el depósito se convierte a tu
        `payin_rate` vigente y se acredita en la misma llamada, neto de la comisión de payin. Si el pagador
        rechaza, `paid` es false, el payin queda marcado como failed y no se cobra nada.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - amount
              - idempotency_key
              properties:
                country:
                  type: string
                  default: VE
                currency:
                  type: string
                  default: VES
                method:
                  type: string
                  description: Método de cobro (ej. c2p, debito_inmediato).
                amount:
                  type: string
                  description: Monto local como string decimal positivo.
                description:
                  type: string
                our_reference:
                  type: string
                payer_document:
                  type: string
                payer_phone:
                  type: string
                payer_bank:
                  type: string
                payer_account:
                  type: string
                payer_name:
                  type: string
                payer_account_type:
                  type: string
                otp:
                  type: string
                otp_reference:
                  type: string
                idempotency_key:
                  type: string
                  description: Obligatoria — el collect ejecuta un cargo real; reintentos con la misma
                    clave no vuelven a cobrar.
            example:
              method: c2p
              amount: '1200.00'
              description: Order 5512
              payer_document: V12345678
              payer_phone: '04141234567'
              payer_bank: '0102'
              otp: '12345678'
              idempotency_key: collect-2026-07-07-a
      responses:
        '200':
          description: 'Resultado del cobro. `paid: true` significa que el depósito fue acreditado.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                  kind:
                    type: string
                  country:
                    type: string
                  currency:
                    type: string
                  method:
                    type: string
                  local_amount:
                    type: string
                  status:
                    type: string
                  fx_rate:
                    type: string
                  usdt_gross:
                    type: string
                  fee:
                    type: string
                  usdt_credited:
                    type: string
                  paid:
                    type: boolean
                  provider_reference:
                    type: string
                  status_code:
                    type: string
                  status_message:
                    type: string
              example:
                payin_id: 7b3c9e2f-1a2b-3c4d-5e6f-7a8b9c0d1e2f
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: collect
                country: VE
                currency: VES
                method: c2p
                local_amount: '1200.00'
                status: credited
                reference: REF-102030
                fx_rate: '36.50'
                usdt_gross: '32.876712'
                fee: '0.300000'
                usdt_credited: '32.576712'
                paid: true
                provider_reference: PRV-889911
                status_code: '00'
                status_message: approved
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:02Z'
        '400':
          description: invalid_request / invalid_amount
          content:
            application/json:
              schema: &id011
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_request
                message: method is required (e.g. c2p, debito_inmediato)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cuenta no activa (account_blocked).
          content:
            application/json:
              schema: *id011
              example:
                error: account_blocked
                message: account is not active
        '502':
          description: Core no disponible (core_unavailable).
          content:
            application/json:
              schema: *id011
              example:
                error: core_unavailable
                message: could not execute the collection
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
