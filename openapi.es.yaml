          description: Liveness link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  status:
                    type: string
                  expires_at:
                    type: integer
              example:
                url: https://verify.example.com/on/liveness/tok_abc123
                status: pending
                expires_at: 1751234567
        '400':
          description: liveness_already_completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: liveness_already_completed
                message: the liveness check already passed for this submission
