  /v1/rates:
    get:
      tags:
      - Saldos
      operationId: getRates
      summary: Obtener mis tasas de cambio y comisiones
      description: Devuelve las tasas de cambio que aplican a la cuenta que llama para cada país — las
        mismas tasas usadas cuando las operaciones se ejecutan (`local_amount / rate = USDT`) — más la
        configuración de comisiones **efectiva** de la cuenta — los defaults de la organización ya
        resueltos contra los overrides de tu cuenta — para calcular el costo exacto de una operación
        antes de crearla.
        `rate` es la punta de payouts (dispersiones) y `payin_rate` la de payins (depósitos).
        `asset_prices` trae el precio USD de referencia de cada saldo virtual (BTC por unidad, GOLD por
        gramo; los stablecoins valen 1 por convención) para valorizar. El bloque `settlement` muestra,
        por asset habilitado, el **precio efectivo de settlement** que tu cuenta obtendría ahora mismo
        si pagara una operación desde ese saldo (`settlement_rate`, spread incluido) y si el asset está
        `available` — úsalo para estimar antes de enviar `settlement_asset` en un payout.
      responses:
        '200':
          description: Tasas, precios de referencia por activo y comisiones.
          content:
            application/json:
              schema:
                type: object
                properties:
                  base:
                    type: string
                    example: USD
                  rates:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: CLP
                        rate:
                          type: string
                          description: Tasa aplicada a los payouts (dispersiones).
                          example: '950.123456'
                        payin_rate:
                          type: string
                          description: Tasa aplicada a los payins (depósitos/cobros fiat).
                          example: '955.10'
                  asset_prices:
                    type: object
                    description: Precio USD de referencia por activo del saldo virtual (display/valorización).
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: USD
                        unit:
                          type: string
                          description: Unidad a la que refiere el precio (`btc`, `gram`, `usdt`, `usdc`).
                          example: gram
                        price:
                          type: string
                          example: '107.5341'
                        updated_at:
                          type: string
                          description: Cuándo se actualizó este precio por última vez.
                        settlement_grade:
                          type: boolean
                          description: True cuando el precio está lo bastante fresco para ejecutar
                            settlements (operaciones pagadas desde ese saldo).
                  settlement:
                    type: object
                    description: Pricing de settlement efectivo para la cuenta que llama.
                    properties:
                      default_asset:
                        type: string
