            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: banking_customer_exists
                message: this account already has a banking customer
        '502':
          description: Error del corredor bancario; la comisión (si hubo) se reembolsó (banking_request_failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: banking_request_failed
                  message: request rejected
    get:
      tags:
      - Banking
      operationId: getBankingCustomer
      summary: Consultar mi perfil bancario
      description: Devuelve el perfil bancario de la cuenta con su estado de verificación en vivo.
      responses:
        '200':
          description: Perfil bancario con estado normalizado (draft, submitted, under_review, approved,
            rejected).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                customer_id: 9f2b1c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                provider_id: BNK-88f13a
                status: approved
                data:
                  item:
                    type: INDIVIDUAL
                    name: Ana Perez Rojas
                created_at: '2026-07-07T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
