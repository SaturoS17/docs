  /v1/balances/history:
    get:
      tags:
      - Saldos
      operationId: getBalancesHistory
      summary: Obtener historial de saldos
      description: >
        Evolución diaria de los saldos de la cuenta para gráficos de
        dashboard: una serie por asset (el saldo disponible de cierre de
        cada día, arrastrado en días sin movimientos) más una serie agregada
        en USD que valoriza BTC/GOLD al precio de referencia histórico de
        cada día. Incluye las entradas/salidas totales del período y el
        snapshot actual (available + held), para que el front arme una
        tarjeta de saldo estilo dashboard con su variación porcentual. La
        serie refleja el saldo **disponible** (los holds no tienen
        historia); `current` trae el `held` de hoy por asset. Los días
        valorizados con el precio spot de hoy (antes de que exista precio
        histórico) se declaran en `spot_priced_dates` — los valores jamás
        se inventan.


        El mapa `assets` incluye también los espejos de las cuentas banking
        (`BANK_USD`, `BANK_EUR`) como serie propia en su propia moneda
        (2 decimales). **No** forman parte del agregado `total_usd`, que
        cubre solo los saldos operativos (USDT, USDC, BTC, GOLD).
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Fecha inicial (YYYY-MM-DD, UTC, inclusive).
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Fecha final (YYYY-MM-DD, UTC, inclusive). Rango máximo 366 días.
      responses:
        '200':
          description: Serie diaria de saldo por asset más el agregado USD.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  from:
                    type: string
                  to:
                    type: string
                  granularity:
                    type: string
                    example: day
                  timezone:
                    type: string
                    example: UTC
                  assets:
                    type: object
                    description: >
                      Una serie de saldo de cierre diario por asset. Incluye
                      los saldos operativos (USDT, USDC, BTC, GOLD) y los
                      espejos de las cuentas banking (BANK_USD, BANK_EUR) en su
                      propia moneda; las series banking quedan fuera de
                      `total_usd`.
                    additionalProperties:
                      type: object
                      properties:
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                example: '2026-07-10'
                              balance:
                                type: string
                                example: '125.430000'
                        first:
                          type: string
                        last:
                          type: string
                        change_pct:
                          type: string
                          nullable: true
                          description: Variación porcentual con signo primero→último (null cuando la serie parte en cero).
                  total_usd:
                    type: object
                    description: Valor agregado en USD de todos los saldos por día.
                    properties:
                      series:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            balance_usd:
                              type: string
                      first:
                        type: string
                      last:
                        type: string
                      change_pct:
                        type: string
                        nullable: true
                      spot_priced_dates:
                        type: array
                        items:
                          type: string
                        description: Días valorizados con el precio spot de hoy porque no existía precio histórico.
                      unpriced_assets:
                        type: array
                        items:
                          type: string
                        description: Assets excluidos del agregado USD por falta de precio.
                  period:
                    type: object
                    description: Entradas/salidas totales del período en USD.
                    properties:
                      in_usd:
                        type: string
                      out_usd:
                        type: string
                      net_usd:
                        type: string
                  current:
                    type: object
                    description: Snapshot actual (available + held, valorizado a spot).
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            asset:
                              type: string
                            available:
                              type: string
                            held:
                              type: string
                            usd_estimate:
                              type: string
                              nullable: true
                      net_worth_usd_estimate:
                        type: string
                        nullable: true
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                from: '2026-06-12'
                to: '2026-07-11'
                granularity: day
                timezone: UTC
                assets:
                  USDT:
                    series:
                    - date: '2026-06-12'
                      balance: '100.000000'
                    - date: '2026-06-13'
                      balance: '100.000000'
                    - date: '2026-07-11'
                      balance: '125.430000'
                    first: '100.000000'
                    last: '125.430000'
                    change_pct: '25.43'
                  BTC:
                    series:
                    - date: '2026-06-12'
                      balance: '0.00060000'
                    - date: '2026-07-11'
                      balance: '0.00060000'
                    first: '0.00060000'
                    last: '0.00060000'
                    change_pct: '0.00'
                  BANK_USD:
                    series:
                    - date: '2026-06-12'
                      balance: '1500.00'
                    - date: '2026-07-11'
                      balance: '1725.50'
                    first: '1500.00'
                    last: '1725.50'
                    change_pct: '15.03'
                total_usd:
                  series:
                  - date: '2026-06-12'
                    balance_usd: '163.73'
                  - date: '2026-07-11'
                    balance_usd: '191.34'
                  first: '163.73'
                  last: '191.34'
                  change_pct: '16.86'
                  spot_priced_dates: []
                  unpriced_assets: []
                period:
                  in_usd: '280.20'
                  out_usd: '254.77'
                  net_usd: '25.43'
                current:
                  items:
                  - asset: USDT
                    available: '125.430000'
                    held: '10.000000'
                    usd_estimate: '135.43'
                  - asset: USDC
                    available: '0.000000'
                    held: '0.000000'
                    usd_estimate: '0.00'
                  - asset: BTC
                    available: '0.00060000'
                    held: '0.00000000'
                    usd_estimate: '65.91'
                  - asset: GOLD
                    available: '0.000000'
                    held: '0.000000'
                    usd_estimate: '0.00'
                  net_worth_usd_estimate: '201.34'
        '400':
          description: Rango de fechas faltante o inválido (`invalid_range`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_range
                message: from and to are required (YYYY-MM-DD)
        '403':
          $ref: '#/components/responses/AccountRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
