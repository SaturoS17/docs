webhooks:
  payin_credited:
    post:
      summary: Payin acreditado
      description: 'Se recibió un cobro fiat y se acreditó a la cuenta en USDT.


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payin_id: &id015
                  type: string
                account_id: *id015
                country: *id015
                currency: *id015
                local_amount: *id015
                fx_rate: *id015
                usdt_credited: *id015
                fee: *id015
            example:
              payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              country: BO
              currency: BOB
              local_amount: '700.00'
              fx_rate: '6.91'
              usdt_credited: '100.302460'
              fee: '1.000000'
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  payout_status_changed:
    post:
      summary: Estado de payout cambiado
      description: 'Un payout alcanzó un nuevo estado (processing, completed o failed).


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payout_id: *id015
                account_id: *id015
                country: *id015
                currency: *id015
                local_amount: *id015
                usdt_amount: *id015
                total_debit: *id015
                status: *id015
                status_code: *id015
            example:
              payout_id: 7d5c2f0a-1e9b-4a6d-8f3c-0b2a1d9e8c7f
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              country: MX
              currency: MXN
              local_amount: '1500.00'
              usdt_amount: '85.714286'
              total_debit: '86.014286'
              status: completed
              status_code: ''
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  transfer_received:
    post:
      summary: Transferencia recibida
      description: 'La cuenta recibió una transferencia interna.


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transfer_id: *id015
                from_account_id: *id015
                to_account_id: *id015
                asset: *id015
                amount: *id015
                description: *id015
                created_at: *id015
            example:
              transfer_id: 2a7b9c1d-4e5f-6a70-8b9c-0d1e2f3a4b5c
              from_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              to_account_id: 5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b
              asset: USDT
              amount: '25.000000'
              description: Expense split
              created_at: '2026-07-07T12:00:00Z'
      responses:
