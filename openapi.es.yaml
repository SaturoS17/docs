      description: 'Se dispara en cada cambio del ciclo de vida de una transacción de tarjeta:
        authorized (hold en tiempo real), reversed (fondos devueltos) y ajustes de liquidación.
        Mismos headers de firma que toda entrega.'
      requestBody:
        content:
          application/json:
            example:
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
