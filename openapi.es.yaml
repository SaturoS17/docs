          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                  example: USD
                type:
                  type: string
                  enum:
                  - INDIVIDUAL
                  - COMPANY
                name:
                  type: string
                email:
                  type: string
                address:
                  type: object
                  additionalProperties: true
            example:
              currency: USD
              address:
                countryIso: CL
                city: Santiago
      responses:
        '201':
          description: Perfil bancario creado (estado draft).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                customer_id: 9f2b1c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                provider_id: BNK-88f13a
                status: draft
                data:
                  item:
