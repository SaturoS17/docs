  /v1/crypto/wallets:
    post:
      tags:
      - Crypto
      operationId: createCryptoWallet
      summary: Crear una wallet
      description: 'Crea una nueva wallet on-chain de USDT para la cuenta que llama. Las cuentas de persona
        mantienen **una wallet por red**; las cuentas de empresa pueden crear wallets **ilimitadas** por
        red (usa `label` para distinguirlas).


        Cada creación cobra la comisión `wallet_creation` cuando CBPay la tiene configurada (fija por
        wallet; 0 = gratis, el valor por defecto; configurable por cuenta). El cargo se reembolsa automáticamente
        si la creación falla.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - chain
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                asset:
                  type: string
                  default: USDT
                label:
                  type: string
                  description: Etiqueta descriptiva opcional.
            examples:
              person:
                summary: Persona — una wallet por red
                value:
                  chain: tron
              company_labeled:
                summary: Empresa — wallet con etiqueta (ilimitadas)
                value:
                  chain: tron
                  label: Main treasury
              company_eth:
                summary: Empresa — red Ethereum
                value:
                  chain: eth
                  label: E-commerce collections
      responses:
        '201':
          description: Wallet creada.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CryptoWallet'
                - type: object
                  properties:
                    creation_fee:
                      type: string
              example:
                wallet_id: b7e3a940-6f1d-4c2b-9a8e-5d4c3b2a1f0e
                chain: tron
                asset: USDT
                address: TQmZ1kfWzcmRDYkqLnybXnbWzPMYNvbYqT
                label: Main treasury
                created_at: '2026-07-07T12:00:00Z'
                creation_fee: '1.000000'
        '400':
          description: invalid_chain / invalid_asset
          content:
            application/json:
              schema: &id008
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_chain
                message: unsupported chain "btc" (tron, eth)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '422':
          description: La cuenta de persona ya tiene una wallet en esa red.
          content:
            application/json:
              schema: *id008
              example:
                error: wallet_limit_reached
                message: person accounts hold one wallet per network; company accounts can create more
