                currency: BOB
                glosa: ''
                status: scanned
        '400':
          description: Falta qr_payload (invalid_request).
          content:
            application/json:
              schema: &id009
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_request
                message: qr_payload is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '502':
          description: Core no disponible (core_unavailable).
          content:
            application/json:
              schema: *id009
              example:
                error: core_unavailable
                message: could not scan the QR
  /v1/payouts/qr/confirm:
    post:
      tags:
      - Payouts
      operationId: payoutQrConfirm
      summary: Confirmar un payout por QR (Bolivia, Brasil)
      description: 'Paso 2 del payout por QR (Bolivia y Brasil/PIX), cobrado exactamente igual que un
        payout normal: el monto local se convierte a **la tasa de tu cuenta** y se debita `usdt_amount
        + comisión fija`. El resultado es **síncrono** — la respuesta trae el estado final (`completed`,
        o `failed` con reembolso automático). Un QR escaneado solo puede pagarse una vez; requiere una
        llave de idempotencia como toda operación que mueve dinero.'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - provider_reference
              - amount
              properties:
                country:
                  type: string
                  enum:
                  - BO
                  - BR
                  default: BO
                currency:
                  type: string
                  enum:
                  - BOB
                  - USD
                  - BRL
                  default: BOB
                provider_reference:
                  type: string
                  description: Del paso de escaneo.
                amount:
                  type: string
                  description: Monto local como string decimal positivo.
                description:
                  type: string
                idempotency_key:
                  type: string
            example:
              provider_reference: QR-REF-889923
              amount: '700.00'
              currency: BOB
              description: QR lunch payment
              idempotency_key: qr-2026-07-07-a
      responses:
        '202':
          description: Resultado final (síncrono).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
              example:
                payout_id: 8e2a1b0c-9d8e-7f60-5a4b-3c2d1e0f9a8b
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                idempotency_key: qr-2026-07-07-a
                country: BO
                currency: BOB
                method: qr
                local_amount: '700.00'
                fx_rate: '6.91'
                usdt_amount: '101.302460'
                fee: '0.300000'
                total_debit: '101.602460'
                beneficiary: &id010
                  qr_reference: QR-REF-889923
                description: QR lunch payment
                status: completed
                status_code: ''
                status_message: ''
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:01Z'
        '200':
          description: Respuesta idempotente de un payout por QR existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
              example:
                payout_id: 8e2a1b0c-9d8e-7f60-5a4b-3c2d1e0f9a8b
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                idempotency_key: qr-2026-07-07-a
                country: BO
                currency: BOB
                method: qr
                local_amount: '700.00'
                fx_rate: '6.91'
                usdt_amount: '101.302460'
                fee: '0.300000'
                total_debit: '101.602460'
                beneficiary: *id010
                description: QR lunch payment
                status: completed
                status_code: ''
                status_message: ''
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:01Z'
                idempotency_hit: true
        '400':
          description: invalid_request / idempotency_key_required / invalid_amount
          content:
            application/json:
              schema: *id009
              example:
                error: invalid_request
