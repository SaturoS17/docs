  /v1/aml/screenings:
    post:
      tags:
      - AML screening
      operationId: submitAmlScreening
      summary: Enviar un screening AML
      description: Screenea una persona o empresa (detectado desde el payload) contra listas de sanciones, PEP y prensa adversa vía el servicio de compliance. Es solo screening de listas — la verificación de identidad con documentos y prueba de vida vive en /v1/kyc y /v1/kyb. Todos los campos de identidad son opcionales y se reenvían íntegros al motor; mientras más datos envíes, más preciso es el análisis. Si hay comisión de compliance, se debita antes de la llamada y se reembolsa si falla. El resultado queda guardado localmente para historial (`GET /v1/aml/screenings`). `idempotency_key` es obligatoria — repetir con la misma clave devuelve el screening original con `idempotency_hit` true sin cobrar dos veces.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotency_key
              properties:
                idempotency_key:
                  type: string
                  description: Obligatoria (el screening cobra comisión). También aceptada en el header Idempotency-Key.
                customer:
                  type: object
                  description: 'Identity data. Provide `person` or `company`; when omitted

                    it is filled from the account profile. Additional fields are accepted

                    and forwarded to the screening engine.

                    '
                  properties:
                    person:
                      type: object
                      description: Person identity. Every field is optional; more identity data yields
                        a more precise screening.
                      properties:
                        full_name:
                          type: string
                        first_name:
                          type: string
                        middle_name:
                          type: string
                        last_name:
                          type: string
                        date_of_birth:
                          description: '"YYYY-MM-DD" string or an object {year, month, day}.'
                        nationality:
                          type: string
                          description: ISO-3166 country code (or `nationalities` array).
                        country_of_birth:
                          type: string
                        residential_information:
                          type: array
                          items:
                            type: object
                            properties:
                              country_of_residence:
                                type: string
                        personal_identification:
                          type: array
                          description: Strong identity documents (national ID, passport, ...).
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                              issuing_country:
                                type: string
                              number:
                                type: string
                        alias:
                          type: array
                          items:
                            type: string
                          description: Other known names.
                    company:
                      type: object
                      description: Company identity. Every field is optional; more identity data yields
                        a more precise screening.
                      properties:
                        legal_name:
                          type: string
                        alias:
                          type: array
                          items:
                            type: string
                          description: Trade / brand names.
                        tax_id:
                          type: string
                        registration_number:
                          type: string
                        registration_authority_identification:
                          type: string
                          description: Company registry number.
                        place_of_registration:
                          type: string
                        country_of_incorporation:
                          type: string
                        incorporation_date:
                          type: string
                        address:
                          type: array
                          items:
                            type: object
                            properties:
                              country:
                                type: string
                    email:
                      type: string
                    country:
                      type: string
                monitor:
                  type: boolean
                  default: false
                  description: Enable continuous monitoring from the start.
            examples:
              person:
                summary: Person (KYC)
                value:
                  customer:
                    person:
                      full_name: Ana Perez Rojas
                      date_of_birth: '1990-04-12'
                      personal_identification:
                      - type: national_id
                        issuing_country: CL
                        number: 12.345.678-5
                    email: ana@example.com
                    country: CL
                  monitor: false
              personFull:
                summary: Person (KYC) — full identity for the most precise screening
                value:
                  customer:
                    person:
                      full_name: Ana Perez Rojas
                      date_of_birth: '1990-04-12'
                      nationality: CL
                      country_of_birth: CL
                      residential_information:
                      - country_of_residence: CL
                      personal_identification:
                      - type: national_id
                        issuing_country: CL
                        number: 12.345.678-5
                      - type: passport
                        issuing_country: CL
                        number: P0123456
                    email: ana@example.com
                    country: CL
                  monitor: false
              company:
                summary: Company (KYB)
                value:
                  customer:
                    company:
                      legal_name: Comercial Andina SpA
                      tax_id: 76.543.210-8
                    email: legal@andina.cl
                    country: CL
                  monitor: true
              companyFull:
                summary: Company (KYB) — full identity for the most precise screening
                value:
                  customer:
                    company:
                      legal_name: Comercial Andina SpA
                      alias:
                      - Andina Market
                      tax_id: 76.543.210-8
                      registration_authority_identification: '76543210'
                      place_of_registration: CL
                      incorporation_date: '2015-08-01'
                      address:
                      - country: CL
                    email: legal@andina.cl
                    country: CL
                  monitor: true
              minimal:
                summary: Minimal — autofilled from the account
                value:
                  customer: {}
                  monitor: false
      responses:
        '201':
          description: Screening enviado y guardado localmente.
          content:
            application/json:
              schema:
                type: object
                description: Espejo local del screening más campos de cobro. El resultado completo está en `result`.
                properties:
                  screening_id:
                    type: string
                  kind:
                    type: string
                    enum:
                    - screening
                  service:
                    type: string
                    enum:
                    - compliance_person
                    - compliance_company
                  subject_type:
                    type: string
                    enum:
                    - person
                    - company
                  subject_name:
                    type: string
                  risk:
                    type: string
                  monitor:
                    type: boolean
                  screening_fee:
                    type: string
                  fee_asset:
                    type: string
                  idempotency_key:
                    type: string
                  idempotency_hit:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  result:
                    type: object
                    description: Resultado neutro del servicio de compliance.
              example:
                screening_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                kind: screening
                service: compliance_person
                subject_type: person
                subject_name: Ana Perez Rojas
                risk: low
                monitor: false
                screening_fee: '2.000000'
                fee_asset: USDT
                idempotency_key: aml-screen-ana-1
                created_at: '2026-07-12T18:00:00Z'
                result:
                  customer_id: e1d2c3b4-a596-8778-695a-4b3c2d1e0f9a
                  status: completed
                  risk_level: low
                  screening_result: no_hits
                  monitored: false
        '400':
          description: Falta idempotency_key (`idempotency_key_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: provide idempotency_key (body or Idempotency-Key header)
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '502':
          description: Screening temporarily unavailable (`compliance_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: compliance_unavailable
                message: screening temporarily unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
