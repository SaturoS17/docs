      operationId: createSegregatedWallet
      summary: Crear una wallet segregada
      description: 'Crea una wallet on-chain nueva de la cuenta que llama. Su saldo vive
        on-chain (nunca en el ledger) y queda exenta del barrido de tesorería. Pares soportados:
        `tron`/`usdt`, `eth`/`usdt`, `eth`/`usdc`. Las cuentas empresa pueden crear wallets ilimitadas;
        las cuentas persona tienen **1 por combinación red+activo** (la segunda responde
        `422 wallet_limit_reached`). Un `Idempotency-Key` opcional (o `idempotency_key` en el body) hace
        el reintento seguro: una repetición devuelve la misma wallet sin crear otra. Puede cobrar el fee
        `wallet_creation` (reembolsado si la creación falla).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - chain
              properties:
                chain:
                  type: string
                  enum: [tron, eth]
                asset:
                  type: string
                  enum: [usdt, usdc]
                  default: usdt
                label:
                  type: string
                idempotency_key:
                  type: string
            examples:
              tron_usdt:
                summary: TRON USDT
                value:
                  chain: tron
                  asset: usdt
                  label: Acme Client
                  idempotency_key: wallet-client-001
              eth_usdc:
                summary: Ethereum USDC
                value:
                  chain: eth
                  asset: usdc
                  label: Project X
                  idempotency_key: wallet-project-x
