openapi: 3.1.0
info:
  title: CBPay API
  version: '1.55'
  description: 'CBPay es una plataforma de pagos multimoneda: payouts y cobros fiat

    en toda América Latina, transferencias internas, fondeo y retiros

    on-chain, y screening KYC. Cada cuenta mantiene cuatro saldos virtuales

    independientes — USDT (la moneda operativa), USDC, BTC y GOLD (gramos de

    oro fino) — que nunca se mezclan ni se convierten automáticamente.

    Los payouts y las comisiones de servicios pueden pagarse desde cualquiera

    de los cuatro saldos: define un predeterminado con `PUT /v1/settlement` o

    haz override por payout con `settlement_asset`.


    Todos los montos son strings decimales en la precisión de cada moneda (6

    decimales para USDT/USDC/GOLD, 8 para BTC). Los errores siempre devuelven

    `{"error": "<code>", "message": "<detail>"}`.

    '
servers:
- url: https://api.qbank.cl/platform
security:
- bearerAuth: []
tags:
- name: Comprobantes
  description: Comprobante PDF brandeado por operacion, con verificacion publica de autenticidad
    (QR firmado), receipt_url en cada respuesta/webhook y envio automatico por email en estados
    finales.
- name: Autenticación
  description: Registra e inicia sesión de los miembros de la cuenta. Las sesiones duran 24 horas.
- name: Cuenta
  description: Perfil, miembros y llaves de API de la cuenta que llama.
- name: Saldos
  description: Saldos, historial de movimientos y tasas de cambio.
- name: Payouts
  description: Dispersiones fiat que se debitan del saldo de settlement que elijas (USDT por defecto).
- name: Payins
  description: Recargas fiat que se acreditan al saldo en USDT.
- name: Transferencias
- name: Contacts
- name: Swaps
  description: Transferencias internas gratuitas entre cuentas CBPay (persona o empresa, cualquier combinación).
- name: Crypto
  description: Fondeo y retiros on-chain de USDT (TRON y Ethereum).
- name: Wallets segregadas
  description: Wallets on-chain con saldo propio (empresas ilimitadas; personas 1 por combinación red+activo) — crear, importar, enviar, exportar la llave privada y auto-forward. El saldo vive on-chain, nunca en el ledger.
- name: KYC / KYB
- name: Screening de wallets
  description: Evaluación de riesgo AML de direcciones blockchain (sanciones, exposición a fondos
    ilícitos) con comisión por scan, más protección automática gratuita en retiros y depósitos.
- name: AML screening
  description: 'Verificación de identidad: KYC para personas, KYB para empresas, con screening AML, re-screening
    y monitoreo continuo.'
- name: Analytics
- name: Webhooks
  description: Suscripciones para recibir notificaciones de eventos firmadas.
- name: Estado
  description: Disponibilidad del servicio.
- name: Banking
  description: 'Cuentas bancarias reales: recibe, mantén y envía dinero por rieles bancarios internacionales.'
- name: Cards
  description: 'Tarjetas virtuales y físicas que gastan Just-In-Time del saldo USDT de la cuenta,
    con límites de gasto por tarjeta.'
- name: Seguridad (OTP)
  description: Códigos de verificación de un solo uso por SMS/WhatsApp/email que
    protegen acciones sensibles, más las preferencias de 2FA self-service.
    Aplican solo a sesiones de usuario — las API keys quedan exentas.
- name: Passkeys
  description: Inicio de sesión sin contraseña con la biometría del dispositivo
    (Face ID, Touch ID, Windows Hello, llaves de seguridad) vía WebAuthn,
    apps autenticadoras (TOTP) con códigos de respaldo, y gestión de
    sesiones/dispositivos.
- name: Login social
  description: Registro e inicio de sesión sin contraseña con Google, Apple,
    Microsoft y Facebook vía token exchange. El front obtiene la credencial
    del proveedor; la API la verifica y emite la sesión CBPay.
paths:
  /v1/payouts/{payoutID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getPayoutReceipt
      summary: Descargar el comprobante del payout (PDF)
      description: Comprobante PDF brandeado del payout, con los datos del beneficiario, montos,
        badge de estado y el QR de verificación firmado. Los estados no finales llevan marca de agua
        diagonal. Solo el dueño del payout (o el admin de la org) puede descargarlo.
      parameters:
      - name: payoutID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/payins/{payinID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getPayinReceipt
      summary: Descargar el comprobante del payin (PDF)
      description: Comprobante PDF brandeado del cobro, con la referencia, montos, badge de estado
        y el QR de verificación firmado. Los estados no finales llevan marca de agua diagonal.
      parameters:
      - name: payinID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/transfers/{transferID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getTransferReceipt
      summary: Descargar el comprobante de la transferencia (PDF)
      description: Comprobante PDF brandeado de la transferencia interna (las dos partes pueden
        descargarlo; la contraparte se muestra por display name).
      parameters:
      - name: transferID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/crypto/withdrawals/{withdrawalID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getCryptoWithdrawalReceipt
      summary: Descargar el comprobante del retiro crypto (PDF)
      description: Comprobante PDF brandeado del retiro on-chain, con la red, dirección de destino,
        tx hash y el QR de verificación firmado.
      parameters:
      - name: withdrawalID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/crypto/deposits/{depositID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getCryptoDepositReceipt
      summary: Descargar el comprobante del depósito crypto (PDF)
      description: Comprobante PDF brandeado de un depósito on-chain acreditado. El `depositID` es
        el campo `deposit_id` que devuelve `GET /v1/crypto/transactions`.
      parameters:
      - name: depositID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/swaps/{swapID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getSwapReceipt
      summary: Descargar el comprobante del swap (PDF)
      description: Comprobante PDF brandeado de la conversión de saldos, con las dos puntas, la
        tasa aplicada y el QR de verificación firmado.
      parameters:
      - name: swapID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/cards/{cardID}/transactions/{transactionID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getCardTransactionReceipt
      summary: Descargar el comprobante de la compra con tarjeta (PDF)
      description: Comprobante PDF brandeado de una transacción de tarjeta, con el comercio, monto
        USD, saldo debitado y el QR de verificación firmado.
      parameters:
      - name: cardID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: transactionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/banking/operations/{operationID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getBankingOperationReceipt
      summary: Descargar el comprobante de la operación bancaria (PDF)
      description: Comprobante PDF brandeado de una operación bancaria (monto, moneda,
        contraparte, estado) con el QR de verificación firmado. Disponible para operaciones
        creadas desde que el espejo de trazabilidad quedó activo.
      parameters:
      - name: operationID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/wallets/{walletID}/sends/{sendID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getWalletSendReceipt
      summary: Descargar el comprobante del envío desde wallet segregada (PDF)
      description: Comprobante PDF brandeado de un envío on-chain desde una wallet segregada,
        con la red, dirección destino, hash de la transacción y el QR de verificación firmado.
      parameters:
      - name: walletID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sendID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/wallets/{walletID}/deposits/{depositID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getWalletDepositReceipt
      summary: Descargar el comprobante del depósito en wallet segregada (PDF)
      description: Comprobante PDF brandeado de un depósito on-chain recibido en una wallet
        segregada, con la red, dirección de origen, hash de la transacción y el QR de
        verificación firmado.
      parameters:
      - name: walletID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: depositID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /verify/receipts/{code}:
    get:
      security: []
      tags:
      - Comprobantes
      operationId: verifyReceipt
      summary: Verificar la autenticidad de un comprobante (público)
      description: 'Endpoint PÚBLICO (sin credenciales) detrás del QR impreso en cada comprobante.
        El código viene firmado criptográficamente: uno adulterado o inventado responde 404 con
        `valid: false`. La respuesta muestra el estado y monto REALES y vigentes de la operación —
        jamás datos personales del beneficiario. Los navegadores reciben una página HTML brandeada;
        los clientes API reciben JSON. Rate-limited por IP.'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Código de verificación impreso en el comprobante (también embebido en la URL del QR).
      responses:
        '200':
          description: El comprobante es auténtico; datos vigentes de la operación.
          content:
            application/json:
              example:
                valid: true
                type: payout
                status: ok
                raw_status: completed
                amount: 800.00 VES
                detail: "Venezuela — Pago Móvil"
                date: 2026-07-11 15:29 UTC
                issued_by: CBPay
        '404':
          description: Código de verificación inválido, adulterado o desconocido.
          content:
            application/json:
              example:
                valid: false
                message: this verification code does not correspond to any receipt issued by this platform
        '429':
          description: Demasiados intentos de verificación desde esta IP.
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many verification attempts; wait a moment and retry
  /v1/branding:
    get:
      tags:
      - Account
      operationId: getBranding
      summary: Obtener el branding de la plataforma
      description: Branding efectivo de la plataforma donde operas (nombre, colores, logos en
        base64) para que un front white-label se auto-tematice desde la API en vez de hardcodear
        assets. `logo_url`/`symbol_url` son URLs públicas de CDN de los mismos
        logos — prefiérelas por sobre los payloads base64. Solo lectura, sin PII.
      responses:
        '200':
          description: Branding efectivo.
          content:
            application/json:
              example:
                brand_name: CBPay
                website: www.cbpayapp.com
                footer_address: "Miami: 25 SW 9th STREET, Suite 406, Miami, FL 33130"
                support_email: ''
                colors:
                  primary: '#FBC140'
                  header: '#2E2E2E'
                  accent: '#A16207'
                logo_png_base64: iVBORw0KGgoAAAANSUhEUg...
                symbol_png_base64: iVBORw0KGgoAAAANSUhEUg...
                logo_url: https://cdn.cbpayapp.com/public/branding/default/logo.png
                symbol_url: https://cdn.cbpayapp.com/public/branding/default/symbol.png
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/register:
    post:
      tags:
      - Autenticación
      security: []
      operationId: register
      summary: Registrar una cuenta
      description: 'Crea una cuenta de persona o empresa con su miembro de acceso owner y

        devuelve un token de sesión. Un solo endpoint para ambos tipos: `type` es un dato.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - type
              - email
              - password
              - display_name
              properties:
                org:
                  type: string
                  description: Slug de la organización CBPay (`cbpay`).
                type:
                  type: string
                  enum:
                  - person
                  - company
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                display_name:
                  type: string
                tax_id:
                  type: string
                phone:
                  type: string
                country:
                  type: string
                  description: Código de país ISO 3166-1 alpha-2.
                profile:
                  type: object
                  description: Datos de perfil de formato libre.
            example:
              org: cbpay
              type: person
              email: ana@example.com
              password: a-secure-password
              display_name: Ana Perez
              country: CL
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
                  access_token:
                    type: string
                    description: JWT de sesión, válido por 24 horas.
                  expires_at:
                    type: string
                    format: date-time
              example:
                account: &id001
                  id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  org_id: 1c9e7a2b-5f6d-4e3a-8c1b-2a9d8e7f6a5b
                  type: person
                  status: active
                  kyc_status: approved
                  email: ana@example.com
                  display_name: Ana Perez
                  tax_id: 12345678-9
                  phone: '+56912345678'
                  country: CL
                  profile: &id002 {}
                  created_at: '2026-07-07T12:00:00Z'
                  updated_at: '2026-07-07T12:00:00Z'
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                expires_at: '2026-07-08T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Servicio suspendido (`org_suspended`); contacta al equipo de CBPay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: org_suspended
                message: organization is not active
        '409':
          description: Ya existe una cuenta con ese email (`duplicate`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: duplicate
                message: resource already exists
  /v1/auth/login:
    post:
      tags:
      - Autenticación
      security: []
      operationId: login
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - email
              - password
              properties:
                org:
                  type: string
                  description: Slug de la organización CBPay (`cbpay`).
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              org: cbpay
              email: ana@example.com
              password: a-secure-password
      responses:
        '200':
          description: >-
            Sesión emitida — o, cuando la política de la cuenta exige OTP en
            el login, una respuesta intermedia con `otp_required` true y un
            `pending_token` para canjear en `POST /v1/auth/login/otp`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  account_id:
                    type: string
                    format: uuid
                  role:
                    type: string
                    enum:
                    - owner
                    - operator
                    - viewer
                  otp_required:
                    type: boolean
                    description: Presente (true) cuando el login necesita un segundo paso.
                  pending_token:
                    type: string
                    description: Token intermedio para `POST /v1/auth/login/otp`. No autentica requests de la API.
                  challenge_id:
                    type: string
                    format: uuid
                  channel:
                    type: string
                    enum: [sms, whatsapp]
                  phone:
                    type: string
                    description: Teléfono enmascarado al que viajó el código.
              examples:
                session:
                  summary: Sesión emitida (sin política OTP)
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                    expires_at: '2026-07-08T12:00:00Z'
                    account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                    role: owner
                otpRequired:
                  summary: Login en dos pasos (política OTP activa)
                  value:
                    otp_required: true
                    pending_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                    challenge_id: 6f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                    channel: sms
                    phone: '********5678'
                    expires_at: '2026-07-08T21:10:00Z'
                    note: verify the code with POST /v1/auth/login/otp to receive the session token
        '401':
          description: Email o contraseña incorrectos (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_credentials
                message: email or password is incorrect
  /v1/auth/login/otp:
    post:
      tags:
      - Autenticación
      security: []
      operationId: loginOTP
      summary: Completar el login en dos pasos
      description: Canjea el `pending_token` de `POST /v1/auth/login` más el
        código OTP recibido por SMS/WhatsApp por el token de sesión real. El
        token intermedio expira a los 10 minutos y jamás puede llamar a la
        API por sí solo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pending_token
              - code
              properties:
                pending_token:
                  type: string
                code:
                  type: string
                  minLength: 4
                  maxLength: 10
            example:
              pending_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
              code: '482913'
      responses:
        '200':
          description: Sesión emitida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  account_id:
                    type: string
                    format: uuid
                  role:
                    type: string
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                expires_at: '2026-07-09T21:00:00Z'
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                role: owner
        '401':
          description: El código no coincide (`invalid_code`) o el token
            intermedio expiró (`invalid_pending_token`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_code
                message: the code is incorrect; check it and try again
        '409':
          description: El desafío expiró o ya se usó (`challenge_not_pending`);
            vuelve a iniciar sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: challenge_not_pending
                message: the challenge already expired or was used; log in again
  /v1/auth/oauth:
    post:
      tags:
      - Login social
      security: []
      operationId: oauthLogin
      summary: Iniciar sesión o registrarse con un proveedor social
      description: Token exchange. El front obtiene la credencial del
        proveedor (Google/Apple/Microsoft `id_token`, Facebook
        `access_token`) y la envía aquí. La API la verifica contra el
        proveedor y devuelve la sesión CBPay — creando la cuenta en el primer
        uso. Respeta la política de OTP en login de la cuenta (puede devolver
        `otp_required`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - provider
              - credential
              properties:
                org:
                  type: string
                  description: Slug de la organización CBPay (`cbpay`).
                provider:
                  type: string
                  enum: [google, apple, microsoft, facebook]
                credential:
                  type: string
                  description: Credencial del proveedor obtenida por el SDK del front.
                type:
                  type: string
                  enum: [person, company]
                  description: Tipo de cuenta al crear una nueva (default person; se ignora si ya existe).
            example:
              org: cbpay
              provider: google
              credential: eyJhbGciOiJSUzI1Ni…
              type: person
      responses:
        '200':
          description: Usuario existente inició sesión (o `otp_required` si la
            cuenta exige OTP en login).
          content:
            application/json:
              example:
                access_token: eyJhbGciOiJIUzI1Ni…
                expires_at: '2026-07-09T21:00:00Z'
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                role: owner
        '201':
          description: Cuenta nueva creada y sesión iniciada.
          content:
            application/json:
              example:
                account:
                  id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
