      - KYC / KYB
      operationId: createMyVerificationLink
      summary: Pedir mi link de verificación (onboarding)
      description: 'Devuelve el link de verificación de identidad PROPIO de la cuenta (persona ⇒
        link KYC, empresa ⇒ link KYB — derivado del tipo de cuenta). El wizard hosteado cubre el
        flujo completo: formulario, documentos y prueba de vida en video. Gratis. Si ya hay un link
        vigente se devuelve el mismo con 200; una cuenta ya aprobada recibe 409 already_verified.
