  /v1/webhooks/subscriptions:
    post:
      tags:
      - Webhooks
      operationId: createWebhookSubscription
      summary: Crear una suscripción de webhook
      description: 'Suscribe un callback HTTPS a los eventos de la cuenta que llama.


        Las entregas van firmadas: `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`
        con el timestamp en `X-Webhook-Timestamp`. Hasta 5 intentos con backoff incremental.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - event_type
              - callback_url
              - secret
              properties:
                event_type:
                  type: string
                  enum:
                  - payin_credited
                  - payout_status_changed
                  - transfer_received
                  - crypto_deposit_credited
                  - crypto_deposit_held
                  - crypto_deposit_alert
                  - crypto_withdrawal_status_changed
                  - banking_customer_status_changed
                  - banking_operation_status_changed
                  - aml_screening_updated
                  - kyc_verification_status_changed
                  - kyb_verification_status_changed
                  - kyc_link_completed
                  - kyb_link_completed
                  - kyc_document_validated
                  - kyb_document_validated
                  - kyc_liveness_completed
                  - wallet_deposit_received
                  - wallet_send_status_changed
                  - wallet_key_exported
                  - '*'
                callback_url:
                  type: string
                  format: uri
                  description: Solo HTTPS; localhost e IPs privadas se rechazan.
                secret:
                  type: string
                  minLength: 16
            example:
              event_type: payout_status_changed
              callback_url: https://api.myapp.com/webhooks/cbpay
              secret: a-strong-shared-secret-123
      responses:
        '201':
          description: Suscripción creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  event_type:
                    type: string
                  callback_url:
                    type: string
                  status:
                    type: string
                    example: active
                  created_at:
                    type: string
                    format: date-time
                  secret_stored:
                    type: boolean
              example:
                id: 8e7f6a5b-4c3d-2e1f-0a9b-8c7d6e5f4a3b
                event_type: payout_status_changed
                callback_url: https://api.myapp.com/webhooks/cbpay
                status: active
                created_at: '2026-07-07T12:00:00Z'
                secret_stored: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - Webhooks
      operationId: listWebhookSubscriptions
      summary: Listar suscripciones de webhook
      description: Lista las suscripciones de webhook de la cuenta (el secreto nunca se devuelve).
