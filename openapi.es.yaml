  /v1/crypto/wallets:
    post:
      tags:
      - Crypto
      operationId: createCryptoWallet
      summary: Reponer una wallet de depósito faltante
      description: 'Toda cuenta — persona y empresa — tiene exactamente **una wallet de depósito por par
        soportado** (`tron`/`usdt`, `eth`/`usdt`, `eth`/`usdc`), aprovisionadas automáticamente y gratis
        al registrarse. Las wallets de depósito solo **reciben** crypto que se abona al saldo virtual de
        la cuenta: no envían, y no se exportan ni importan (para eso están las wallets segregadas). Este
        endpoint existe solo para reponer un par faltante (caso excepcional): con el par ya
        aprovisionado responde `422 wallet_limit_reached` para todo tipo de cuenta.


        Una reposición manual cobra la comisión `wallet_creation` cuando CBPay la tiene configurada
        (fija por wallet; 0 = gratis, el valor por defecto); las wallets de nacimiento son siempre
        gratis. El cargo se reembolsa automáticamente si la creación falla.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - chain
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                asset:
                  type: string
                  enum:
                  - usdt
                  - usdc
                  default: usdt
                  description: Activo de la wallet (usdc solo por `eth`).
                label:
                  type: string
                  description: Etiqueta descriptiva opcional.
            examples:
              tron_usdt:
                summary: Reponer el par TRON USDT
                value:
                  chain: tron
              usdc_wallet:
                summary: Reponer el par USDC (solo Ethereum)
                value:
                  chain: eth
                  asset: usdc
      responses:
        '201':
          description: Wallet creada.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CryptoWallet'
                - type: object
                  properties:
                    creation_fee:
                      type: string
              example:
