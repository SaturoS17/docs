  /v1/cards:
    post:
      tags:
      - Cards
      operationId: createCard
      summary: Crear una tarjeta
      description: 'Emite una tarjeta (virtual o física) que gasta Just-In-Time del saldo USDT central
        de la cuenta — sin prefondeo: cada compra se autoriza en tiempo real contra el saldo
        disponible y los límites propios de la tarjeta. Las cuentas persona pueden tener **1 virtual +
        1 física**; las cuentas empresa crean tarjetas **ilimitadas**, para la empresa o para personas
        designadas (ej. empleados, pasando sus documentos de identidad). La emisión cobra el fee
        `card_creation_virtual` / `card_creation_physical` cuando está configurado (0 = gratis); el
        cargo se reembolsa automáticamente si la emisión falla. Las tarjetas físicas nacen
        `pending_activation` hasta que el titular confirma la recepción.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotency_key
              properties:
                physical:
                  type: boolean
                  default: false
                idempotency_key:
                  type: string
                  description: Obligatoria (también como header Idempotency-Key). Un retry con la
                    misma clave devuelve la tarjeta original y nunca cobra dos veces el fee de emisión.
                limits:
                  type: object
                  description: Límites de gasto opcionales en USDT (se aplican al autorizar; 0 u
                    omitido = sin límite).
                  properties:
                    per_transaction:
                      type: string
                    daily:
                      type: string
                    monthly:
                      type: string
                cardholder:
                  type: object
                  description: 'Solo cuentas empresa: emitir la tarjeta a una persona designada.
                    Requiere kind "person", datos personales y documentos de identidad por URL
                    (id_front_url, id_back_url, residence_proof_url) para verificar al titular de
                    inmediato.'
            examples:
              person_virtual:
                summary: Persona — tarjeta virtual
                value:
                  physical: false
                  idempotency_key: card-v-1
              company_physical_limited:
                summary: Empresa — tarjeta física con límites
                value:
                  physical: true
                  idempotency_key: card-f-ops-1
                  limits:
                    per_transaction: '500.00'
                    monthly: '5000.00'
              company_for_employee:
                summary: Empresa — tarjeta para una persona designada
                value:
                  physical: false
                  idempotency_key: card-emp-77
                  limits:
                    monthly: '1500.00'
                  cardholder:
                    kind: person
                    first_name: Maria
                    last_name: Perez
                    email: maria@empresa.com
                    occupation: Sales
                    salary_usd: 1800
                    id_front_url: https://files.example.com/kyc/mp-front.jpg
                    id_back_url: https://files.example.com/kyc/mp-back.jpg
                    residence_proof_url: https://files.example.com/kyc/mp-address.pdf
                    address:
                      line1: Av. Providencia 123
                      city: Santiago
                      region: RM
                      postal_code: '7500000'
                      country: CL
      responses:
        '201':
          description: Tarjeta creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject'
              example:
                card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                physical: false
                cardholder_kind: account
                cardholder_name: Client X SpA
                status: active
                limits:
                  monthly: '5000.000000'
