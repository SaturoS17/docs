  /v1/banking/customer:
    post:
      tags:
      - Banking
      operationId: createBankingCustomer
      summary: Crear mi perfil bancario
      description: Abre el perfil bancario de la cuenta (una vez por cuenta). Si omites `type`/`name`/`email`,
        se completan desde tu cuenta CBPay. Se cobra la comisión fija `banking_customer` del saldo USDT;
        se reembolsa si el corredor rechaza.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                  example: USD
                type:
                  type: string
                  enum:
                  - INDIVIDUAL
                  - COMPANY
                name:
                  type: string
                email:
                  type: string
                address:
                  type: object
                  additionalProperties: true
            example:
              currency: USD
              address:
                countryIso: CL
                city: Santiago
      responses:
        '201':
          description: Perfil bancario creado (estado draft).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                customer_id: 9f2b1c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                provider_id: BNK-88f13a
                status: draft
                data:
                  item:
                    type: INDIVIDUAL
                    name: Ana Perez Rojas
                created_at: '2026-07-07T12:00:00Z'
                banking_fee: '5.000000'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: Esta cuenta ya tiene perfil bancario (banking_customer_exists).
