                  status:
                    type: string
                  liveness:
                    type: object
                    properties:
                      status:
                        type: string
                      outcome:
                        type: string
                      passed:
                        type: boolean
              example:
                url: https://verify.example.com/on/liveness/tok_abc123
                status: completed
                liveness:
                  status: completed
                  outcome: PASS
