        description: Fecha final (YYYY-MM-DD, UTC, inclusive).
      responses:
        '200':
          description: Historial de desafíos (auditoría).
          content:
            application/json:
              example:
                page: 1
                page_size: 50
                challenges:
                - challenge_id: 6f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                  account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  action: payout
                  channel: whatsapp
                  phone: '********5678'
                  status: consumed
                  created_at: '2026-07-08T21:00:00Z'
                  expires_at: '2026-07-08T21:10:00Z'
                  verified_at: '2026-07-08T21:01:12Z'
                  consumed_at: '2026-07-08T21:01:40Z'
        '400':
          $ref: '#/components/responses/InvalidRange'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/otp/challenges/{challengeID}:
    get:
      tags:
      - Seguridad (OTP)
      operationId: getOTPChallenge
      summary: Consultar un desafío OTP
      parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: El desafío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPChallenge'
              example: *otpChallengeExample
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/otp/challenges/{challengeID}/verify:
    post:
      tags:
      - Seguridad (OTP)
      operationId: verifyOTPChallenge
      summary: Verificar el código
      description: Valida el código recibido por SMS/WhatsApp y devuelve el
        `otp_token` de un solo uso que autoriza la acción protegida (se envía
        en el header `X-OTP-Token`). 5 intentos por desafío.
      parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 10
            example:
              code: '482913'
      responses:
        '200':
          description: Código aprobado; token de un solo uso emitido.
          content:
            application/json:
              example:
                challenge_id: 6f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                action: payout
                otp_token: otp_Zk9uY2XIr1EYE0lq8xqlM3VayVZYX4aa11bb22cc33
                expires_at: '2026-07-08T21:10:00Z'
                note: 'single use: send it in the X-OTP-Token header of the protected action'
        '401':
          description: El código no coincide (`invalid_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_code
                message: the code is incorrect; check it and try again
        '409':
          description: El desafío expiró o ya se usó (`challenge_not_pending`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: challenge_not_pending
                message: the challenge already expired or was used; create a new one
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/services:
    get:
      tags:
      - Account
      operationId: getServices
      summary: Servicios habilitados
      description: 'Mapa efectivo de qué productos puede usar esta cuenta ahora mismo (payouts,
        payins, transfers, crypto, banking, kyc, cards). Cuando un servicio está deshabilitado, sus
        endpoints de acción responden 403 service_disabled; las lecturas y el dinero en tránsito
        nunca se ven afectados. Úsalo para decidir qué mostrar en tu UI.'
      responses:
        '200':
          description: Mapa efectivo de servicios.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  services:
                    type: object
                    additionalProperties:
                      type: boolean
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                services:
                  payouts: true
                  payins: true
                  transfers: true
                  crypto: true
                  banking: true
                  kyc: true
                  cards: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/settlement:
    get:
      tags:
      - Account
      operationId: getSettlement
      summary: Obtener mi configuración de settlement
      description: Devuelve desde qué saldo virtual se debitan por defecto tus operaciones (payouts y
        comisiones de servicios), qué assets permite tu organización, y el límite por operación
        (equivalente en USDT) que aplica a los assets volátiles (BTC/GOLD).
      responses:
        '200':
          description: Configuración de settlement vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementSettings'
              example:
                default_settlement_asset: USDT
                enabled_assets:
                - USDT
                - USDC
                - BTC
                - GOLD
                volatile_op_limit_usdt: '10000.000000'
                volatile_daily_limit_usdt: '50000.000000'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
    put:
      tags:
      - Account
      operationId: updateSettlement
      summary: Definir mi asset de settlement predeterminado
      description: 'Cambia el saldo desde el que se debitan tus payouts y comisiones de servicios
        cuando el request no envía un `settlement_asset` explícito. Cualquiera de USDT, USDC, BTC o
        GOLD (si tu organización lo tiene habilitado). El cambio aplica solo a operaciones nuevas;
        nada en tránsito se re-cotiza.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - default_settlement_asset
              properties:
                default_settlement_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
            example:
              default_settlement_asset: BTC
      responses:
        '200':
          description: Configuración de settlement actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementSettings'
              example:
                default_settlement_asset: BTC
                enabled_assets:
                - USDT
                - USDC
                - BTC
                - GOLD
                volatile_op_limit_usdt: '10000.000000'
                volatile_daily_limit_usdt: '50000.000000'
        '400':
          description: Asset inválido o deshabilitado (`invalid_settlement_asset`, `settlement_asset_disabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: settlement_asset_disabled
                message: settlement asset is disabled for this organization
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/cards/catalog/occupations:
    get:
      tags:
      - Cards
      operationId: listCardOccupations
      summary: Catálogo de ocupaciones
      description: 'Official issuer occupation codes (for the `occupation` field when designating a
        person cardholder). Search with `q` (matches code or label). Use the `code` value; a
        free-text occupation is rejected with 400 invalid_occupation.'
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Filtro opcional (case-insensitive) por código o etiqueta.
      responses:
        '200':
          description: Entradas del catálogo.
          content:
            application/json:
              example:
                items:
                - code: '12101'
                  label: Director General
                - code: '21313'
                  label: Computer Systems Designer
                meta:
                  retrieved: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/cards/catalog/business-activities:
    get:
      tags:
      - Cards
      operationId: listCardBusinessActivities
      summary: Catálogo de giros
      description: 'Official issuer economic-activity codes (for `kind_of_business` when creating a
        company cardholder). Search with `q`. Use the `code` value; a free-text value is rejected
        with 400 invalid_kind_of_business.'
      parameters:
      - name: q
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Entradas del catálogo.
          content:
            application/json:
              example:
                items:
                - code: J6201
                  label: Computer programming activities
                meta:
                  retrieved: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/analytics/summary:
    get:
      tags:
      - Analytics
      operationId: analyticsSummary
      summary: Resumen de la cuenta para dashboards
      description: >
        Aggregated view of the whole account flow in a single call: gross
        volume in/out, transaction counts, new banking users, per-service
        sections (payouts, payins, deposits, withdrawals, transfers, swaps,
        cards, banking, verifications, aml, contacts) with their dimensions
        (country, currency, method, status, chain, merchant), service
        spending and valued balances. Amounts are USD decimal strings;
        empty buckets are zero-filled. Account credential only.
      parameters:
      - {name: from, in: query, required: true, schema: {type: string, format: date}}
      - {name: to, in: query, required: true, schema: {type: string, format: date}}
