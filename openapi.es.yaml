  /v1/swaps/quote:
    get:
      tags:
      - Swaps
      operationId: quoteSwap
      summary: Cotizar un swap
      description: 'Cotización indicativa gratis para convertir entre tus saldos USDT, USDC, BTC y
        GOLD (cualquier par, origen distinto del destino). La tasa que ves es la tasa de ejecución de
        tu cuenta — cotizado = recibido, sin comisiones aparte. Indicativa: la ejecución usa el
        precio del momento del POST (los pares entre stablecoins son estables).'
      parameters:
      - name: from_asset
        in: query
        required: true
        schema:
          type: string
          enum: [USDT, USDC, BTC, GOLD]
      - name: to_asset
        in: query
        required: true
        schema:
          type: string
          enum: [USDT, USDC, BTC, GOLD]
      - name: amount
        in: query
        required: true
        schema:
          type: string
        description: Monto en la moneda de origen (hasta sus decimales).
      responses:
        '200':
          description: Cotización indicativa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  from_asset:
                    type: string
                  to_asset:
                    type: string
                  from_amount:
                    type: string
                  to_amount:
                    type: string
                  rate:
                    type: string
                    description: Unidades de destino por unidad de origen (tasa de ejecución marcada).
                  indicative:
                    type: boolean
              example:
                from_asset: USDT
                to_asset: BTC
                from_amount: '1000.000000'
                to_amount: '0.01568419'
                rate: '0.00001568'
                indicative: true
        '400':
          description: invalid_asset / invalid_pair / invalid_amount / amount_too_small / swap_asset_disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_pair
                message: from_asset and to_asset must differ
        '503':
          description: Precio de ejecución no disponible o desactualizado (pricing_unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: pricing_unavailable
                message: execution price is unavailable or stale; retry later
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/swaps:
    post:
      tags:
      - Swaps
      operationId: createSwap
      summary: Crear un swap
      description: 'Convierte saldo entre dos de tus monedas, de forma síncrona y atómica — tu
        saldo cambia al instante y la plata nunca sale de tu cuenta (sin OTP). Los pares volátiles
        (BTC/GOLD) comparten los límites por operación y de volumen 24h con payouts y compras con
        tarjeta. Requiere clave de idempotencia: el replay devuelve el swap original y jamás
        re-ejecuta.'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from_asset
              - to_asset
              - amount
              properties:
                from_asset:
                  type: string
                  enum: [USDT, USDC, BTC, GOLD]
                to_asset:
                  type: string
                  enum: [USDT, USDC, BTC, GOLD]
                amount:
                  type: string
                  description: Monto en la moneda de origen (6 decimales para USDT/USDC/GOLD, 8 para BTC).
                idempotency_key:
                  type: string
            examples:
              usdt_btc:
                summary: USDT a BTC
                value:
                  from_asset: USDT
                  to_asset: BTC
                  amount: '1000'
                  idempotency_key: swap-2026-07-10-a
              cross:
                summary: BTC a GOLD directo
                value:
                  from_asset: BTC
                  to_asset: GOLD
                  amount: '0.01'
                  idempotency_key: swap-2026-07-10-b
              stables:
                summary: USDT a USDC
                value:
                  from_asset: USDT
                  to_asset: USDC
                  amount: '500'
                  idempotency_key: swap-2026-07-10-c
      responses:
        '201':
          description: Swap ejecutado (síncrono).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swap'
              example:
                swap_id: 8a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                from_asset: USDT
                to_asset: BTC
                from_amount: '1000.000000'
                to_amount: '0.01568419'
                rate: '0.00001568'
                status: completed
                idempotency_key: swap-2026-07-10-a
                created_at: '2026-07-10T15:00:00Z'
        '200':
          description: Replay de idempotencia (swap original, jamás re-ejecutado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swap'
              example:
                swap_id: 8a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                from_asset: USDT
                to_asset: BTC
                from_amount: '1000.000000'
                to_amount: '0.01568419'
                rate: '0.00001568'
                status: completed
                idempotency_key: swap-2026-07-10-a
                created_at: '2026-07-10T15:00:00Z'
                idempotency_hit: true
        '400':
          description: invalid_asset / invalid_pair / invalid_amount / amount_too_small /
            swap_asset_disabled / idempotency_key_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: amount_too_small
                message: amount is too small to convert at the current rate
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          description: verification_required / service_disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: service_disabled
                message: this service is not enabled for your account
        '422':
          description: settlement_limit_exceeded / settlement_daily_limit_exceeded (topes volátiles
            compartidos con payouts y tarjetas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: settlement_daily_limit_exceeded
                message: the account exceeded its 24h volume for volatile assets; retry later or use smaller amounts
        '503':
          description: Precio de ejecución no disponible o desactualizado (pricing_unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: pricing_unavailable
                message: execution price is unavailable or stale; retry later
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
