  /v1/payins:
    post:
      tags:
      - Payins
      operationId: createPayin
      summary: Crear un payin (cobro de recarga)
      description: 'Crea una recarga fiat. Con `method: "qr"` (por defecto) se genera un cobro QR activo
        a través del procesador — en Bolivia el QR interoperable local, en Brasil un QR PIX dinámico cuyo
        `charge` trae la imagen del QR y el payload "copia e cola".         Con `method: "bank_transfer"` el depósito
        queda anunciado y la respuesta trae la referencia que el remitente debe incluir para que la transferencia
        entrante se concilie y acredite automáticamente — un código corto de 12 caracteres alfanuméricos
        que cabe en cualquier concepto bancario (algunos rieles lo limitan a 20 caracteres sin caracteres
        especiales). Con `method: "fintoc"` (Chile) la respuesta trae
        una `payment_url` hosted: el pagador la abre y transfiere desde cualquier banco o billetera chilena;
        el depósito se detecta, valida y acredita automáticamente. Cobrar es gratis; la comisión de payin
        aplica cuando el depósito se acredita.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              - currency
              - amount
              properties:
                country:
                  type: string
                  example: BO
                currency:
                  type: string
                  example: BOB
                amount:
                  type: string
                  description: Monto en moneda local como string decimal positivo.
                description:
                  type: string
                channel:
                  type: string
                  description: Indicación opcional de canal que se pasa al core.
                expires_in:
                  type: integer
                  description: Expiración del cobro en segundos.
                method:
                  type: string
                  enum:
                  - qr
                  - bank_transfer
                  - fintoc
                  default: qr
                  description: Modo de cobro. `qr` crea un cobro QR activo a través del procesador; `bank_transfer`
                    anuncia un depósito entrante y devuelve la referencia a incluir en la descripción
                    de la transferencia; `fintoc` (solo Chile) devuelve una `payment_url` hosted donde
                    el pagador transfiere desde cualquier banco o billetera chilena y el depósito se
                    detecta automáticamente. Usa /v1/payins/collect para cobros pull.
                idempotency_key:
                  type: string
                  description: Clave de idempotencia opcional (método `fintoc`; también se acepta como
                    header `Idempotency-Key`). Un retry con la misma clave devuelve el payin original
                    y su `payment_url` en vez de abrir una segunda sesión de pago.
            examples:
              bo_qr:
                summary: Bolivia — cobro QR (BOB)
                value:
                  country: BO
                  currency: BOB
                  method: qr
                  amount: '700.00'
                  description: App top-up
                  expires_in: 3600
              br_pix_qr:
                summary: Brasil — QR PIX dinámico (BRL)
                value:
                  country: BR
                  currency: BRL
                  method: qr
                  amount: '120.00'
                  description: Order 7719
                  expires_in: 1800
              cl_announced_transfer:
                summary: Chile — transferencia bancaria anunciada (CLP)
                value:
                  country: CL
                  currency: CLP
                  method: bank_transfer
                  amount: '500000'
              py_announced_transfer:
                summary: Paraguay — transferencia bancaria anunciada (PYG, montos enteros)
                value:
                  country: PY
                  currency: PYG
                  method: bank_transfer
                  amount: '596000'
              cl_fintoc:
                summary: Chile — página de pago hosted, cualquier banco (CLP)
                value:
                  country: CL
                  currency: CLP
                  method: fintoc
                  amount: '150000'
                  description: 'Top-up order 8841'
                  idempotency_key: topup-8841
      responses:
        '201':
          description: Cobro creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: pending
                  charge:
                    type: object
                    description: Detalles del cobro (datos del QR, referencias) desde el core.
              examples:
                qr:
                  summary: 'Cobro QR (method: qr)'
                  value:
                    payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
                    status: pending
                    charge:
                      charge_id: c9d8e7f6-a5b4-c3d2-e1f0-a9b8c7d6e5f4
                      our_reference: QR-778812
                      qr_image: data:image/png;base64,iVBORw0KGgo…
                      qr_image_url: https://cdn.cbpayapp.com/public/payin-qr/c9d8e7f6-a5b4-c3d2-e1f0-a9b8c7d6e5f4.png
                bank_transfer:
                  summary: 'Depósito anunciado (method: bank_transfer)'
                  value:
                    payin_id: 4f81c1d0-aaaa-bbbb-cccc-ddddeeeeffff
                    status: pending
                    reference: CBJ6T3W9M2K5
                    note: include the reference in the transfer description so the deposit is credited
                      automatically
                fintoc:
                  summary: 'Página de pago hosted (method: fintoc, Chile)'
                  value:
                    payin_id: 7a2b3c4d-1111-2222-3333-444455556666
                    status: pending
                    reference: 7a2b3c4d-1111-2222-3333-444455556666
                    payment_url: https://pay.fintoc.com/plink_K2zwNNSxPyx8w3GZ
                    expires_at: '2026-07-08T18:48:25Z'
                    note: share the payment_url with the payer; the deposit is credited automatically
                      once the transfer is detected
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '422':
          description: El core rechazó el cobro (`core_rejected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: core_rejected
                message: amount is below the minimum for this corridor
        '502':
          description: Core no disponible (`core_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: core_unavailable
                message: could not create the charge
        '401':
          $ref: '#/components/responses/Unauthorized'
