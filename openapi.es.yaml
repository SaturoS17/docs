  /v1/screenings/addresses:
    post:
      tags:
      - Screening de wallets
      operationId: createAddressScreening
      summary: Screenear una dirección blockchain
      description: 'Evalúa el riesgo AML de una dirección blockchain (entidad sancionada, exposición
        a fondos ilícitos) contra inteligencia on-chain global y devuelve un nivel de riesgo
        normalizado (Low/Medium/High/Severe) con la evidencia completa. Agnóstico a la red: la
        dirección se evalúa sobre todas las chains soportadas a la vez; `chain` solo etiqueta tu
        registro. Cobra la comisión fija `address_screening` (se reembolsa automáticamente si el
        screening falla), por lo que `idempotency_key` es obligatoria — reintentar con la misma clave
        devuelve el screening original con `idempotency_hit: true` y jamás cobra dos veces. Requiere
        el servicio `screenings` habilitado y la verificación de la cuenta aprobada.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - address
              - idempotency_key
              properties:
                address:
                  type: string
                  description: Dirección blockchain a evaluar (máx 128 caracteres).
                chain:
                  type: string
                  description: Etiqueta opcional (tron, eth, ...) para tu registro; no restringe la evaluación.
                idempotency_key:
                  type: string
                  description: Obligatoria (el scan cobra comisión). También se acepta como header Idempotency-Key.
            example:
              address: TN2BBWc9EF8MMB6i1c4HZHXAssTEXstMDo
              chain: tron
              idempotency_key: scan-cliente-742-1
      responses:
        '201':
          description: Screening ejecutado y guardado.
          content:
            application/json:
              examples:
                low_risk:
                  summary: Dirección limpia
                  value:
                    screening_id: 5f0b1c9a-2f3e-4a7b-9c1d-8e6f5a4b3c2d
                    address: TN2BBWc9EF8MMB6i1c4HZHXAssTEXstMDo
                    chain: tron
                    risk: Low
                    screening_fee: '0.500000'
                    fee_asset: USDT
                    idempotency_key: scan-cliente-742-1
                    created_at: '2026-07-12T14:30:00Z'
                    assessment:
                      address: TN2BBWc9EF8MMB6i1c4HZHXAssTEXstMDo
                      risk: Low
                      address_identifications: []
                      exposures:
                      - category: exchange
                        value_usd: '1250.75'
                      triggers: []
                severe_risk:
                  summary: Dirección sancionada
                  value:
                    screening_id: 7a2c4e6f-8b1d-4c3a-9e5f-1a2b3c4d5e6f
                    address: '0x098B716B8Aaf21512996dC57EB0615e2383E2f96'
                    chain: eth
                    risk: Severe
                    risk_reason: Identified as Sanctioned Entity
                    screening_fee: '0.500000'
                    fee_asset: USDT
                    idempotency_key: scan-sospechosa-9
                    created_at: '2026-07-12T14:31:00Z'
                    assessment:
                      address: '0x098B716B8Aaf21512996dC57EB0615e2383E2f96'
                      risk: Severe
                      risk_reason: Identified as Sanctioned Entity
                      cluster_name: OFAC SDN Ronin Bridge Exploiter
                      cluster_category: sanctioned entity
                      address_identifications:
                      - name: 'SANCTIONS: OFAC SDN Ronin Bridge Exploiter'
                        category: sanctioned entity
                      exposures: []
                      triggers: []
        '200':
          description: Replay idempotente — devuelve el screening original sin cobrar de nuevo.
          content:
            application/json:
              example:
                screening_id: 5f0b1c9a-2f3e-4a7b-9c1d-8e6f5a4b3c2d
                address: TN2BBWc9EF8MMB6i1c4HZHXAssTEXstMDo
                chain: tron
                risk: Low
                screening_fee: '0.500000'
                fee_asset: USDT
                idempotency_key: scan-cliente-742-1
                created_at: '2026-07-12T14:30:00Z'
                idempotency_hit: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: La dirección no pudo evaluarse (revisa el formato).
          content:
            application/json:
              example:
                error: invalid_address
                message: the address could not be screened (check the format)
        '502':
          description: Screening temporalmente no disponible (la comisión se reembolsó). Reintenta con la MISMA clave.
          content:
            application/json:
              example:
                error: screening_unavailable
                message: address screening temporarily unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
