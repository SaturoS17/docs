      description: Sube hasta 1.000 contactos por request (pagina si hay más). Los teléfonos se
        normalizan a E.164; los contactos existentes no se duplican; `has_cbpay` te dice qué
        contactos ya tienen una cuenta activa de tu mismo operador (match por teléfono).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contacts
              properties:
                contacts:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      phones:
                        type: array
                        items:
                          type: string
                      email:
                        type: string
            example:
              contacts:
              - name: Carlos Soto
                phones:
                - '+56 9 8765 4321'
              - name: Ana Perez
                phones:
                - '912345678'
      responses:
        '200':
          description: Resultado por contacto.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                  matched:
                    type: integer
                  total:
                    type: integer
                  contacts:
                    type: array
                    items:
                      type: object
              example:
                imported: 2
                matched: 1
                total: 2
                contacts:
                - name: Carlos Soto
                  phone: '+56987654321'
                  contact_id: 3f8a1b2c-4d5e-6f70-8a9b-0c1d2e3f4a5b
                  has_cbpay: true
                - name: Ana Perez
                  phone: '+56912345678'
                  contact_id: 9c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
                  has_cbpay: false
        '400':
          description: invalid_payload / batch_too_large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: batch_too_large
                message: send up to 1000 contacts per request (paginate the upload)
        '401':
          $ref: '#/components/responses/Unauthorized'
