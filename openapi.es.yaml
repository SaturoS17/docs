  /v1/payouts/qr/scan:
    post:
      tags:
      - Payouts
      operationId: payoutQrScan
      summary: Escanear un QR de payout (Bolivia, Brasil)
      description: 'Paso 1 del payout por QR — Bolivia (QR interoperable local) y Brasil (QR PIX, incluyendo
        el código "copia e cola"): lee un QR de cobro y devuelve los datos del destinatario más el `provider_reference`
        necesario para confirmar. **Sin costo** — no se debita nada hasta el paso de confirmación. Por
        defecto es Bolivia; para Brasil envía `country: "BR"` y `currency: "BRL"`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - qr_payload
              properties:
                country:
                  type: string
                  enum:
                  - BO
                  - BR
                  default: BO
                currency:
                  type: string
                  enum:
                  - BOB
                  - USD
                  - BRL
                  default: BOB
                qr_payload:
                  type: string
                  description: Contenido crudo del QR escaneado (en Brasil, también el código PIX "copia
                    e cola").
