components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'JWT de sesión (de register/login) o llave de API (`pk_...`).

        `X-API-Key: <token>` se acepta como header alternativo.

        '
  parameters:
    cardID:
      name: cardID
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    pageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Alternativa al campo `idempotency_key` del body.
      schema:
        type: string
  responses:
    BadRequest:
      description: Solicitud inválida (ver el código `error` para la validación específica).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_json
            message: 'request body is not valid JSON: unknown field'
    InsufficientFunds:
      description: El saldo de la cuenta no alcanza para esta operación (`insufficient_funds`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: insufficient_funds
            message: account balance is not enough for this operation
    AccountRequired:
      description: Este endpoint requiere una credencial de cuenta (`account_required`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: account_required
            message: this endpoint requires an account credential
    Forbidden:
      description: Nivel de credencial no permitido para este endpoint (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
            message: credentials required
    NotFound:
      description: Recurso no encontrado (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: resource not found
    Unauthorized:
      description: Credencial faltante o inválida (`unauthorized`).
      content:
        application/json:
          schema: *id014
          example:
            error: unauthorized
            message: invalid or missing credentials
  schemas:
    CardObject:
      type: object
      properties:
        card_id:
          type: string
        account_id:
          type: string
        physical:
          type: boolean
        cardholder_kind:
          type: string
          enum:
          - account
          - person
        cardholder_name:
          type: string
        status:
          type: string
          enum:
          - pending_activation
          - active
          - frozen
          - cancelled
        limits:
          type: object
          properties:
            per_transaction:
              type: string
            daily:
              type: string
            monthly:
              type: string
        creation_fee:
          type: string
        cancellation_fee:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: string
          description: Código de error legible por máquina (snake_case).
          example: insufficient_funds
        message:
          type: string
          description: Explicación legible por humanos.
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - person
