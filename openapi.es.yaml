  /v1/kyc/submissions/{submissionID}/liveness_link:
    post:
      tags:
      - KYC / KYB
      operationId: createKycLivenessLink
      summary: Crear un liveness link
      description: 'Página hosteada donde tu cliente completa SOLO la prueba de vida en video
        (gestos frente a la cámara + face match server-side contra el documento de identidad
        subido). Gratis — el servicio se cobró al crear la submission. Si hay un link vigente se
        devuelve el mismo; si la prueba ya fue superada, 400 liveness_already_completed.'
      parameters:
      - name: submissionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days:
                  type: integer
                  description: 1-30, default 7.
            example:
              expires_in_days: 7
