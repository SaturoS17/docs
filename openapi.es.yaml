  /v1/rates/history:
    get:
      tags:
      - Saldos
      operationId: getRatesHistory
      summary: Obtener historial de tasas de cambio
      description: >
        Serie temporal de las tasas de cambio que aplican a la cuenta que
        llama, para gráficos de evolución. Cada punto trae las mismas tasas
        que obtendrías operando en ese momento — `rate` (punta de payouts)
        y `payin_rate` (punta de depósitos) — y cada país incluye `first`,
        `last` y el `change_pct` con signo entre ambos, listo para el badge
        "+3.4% / -3.0%". `asset_prices` trae la serie de referencia USD de
        BTC y GOLD. Los buckets sin datos arrastran el valor anterior; los
        días previos al inicio del historial se omiten (jamás se inventan).
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Fecha inicial (YYYY-MM-DD, UTC, inclusive).
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Fecha final (YYYY-MM-DD, UTC, inclusive).
      - name: granularity
        in: query
        schema:
          type: string
          enum: [day, hour]
          default: day
        description: Tamaño del bucket. Rango máximo 366 días para `day` y 31 días para `hour`.
      - name: currency
        in: query
        schema:
          type: string
        description: Filtro opcional por moneda local (ej. CLP).
      responses:
        '200':
          description: Serie de tasas por país más series de precios de assets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  base:
                    type: string
                    example: USD
                  from:
                    type: string
                  to:
                    type: string
                  granularity:
                    type: string
                    example: day
                  rates:
                    type: object
                    description: Una serie por país (mismas llaves que `GET /v1/rates`).
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: CLP
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                example: '2026-07-10'
                              rate:
                                type: string
                                description: Tasa punta payout en ese bucket.
                                example: '950.123456'
                              payin_rate:
                                type: string
                                description: Tasa punta payin en ese bucket.
                                example: '978.912345'
                        first:
                          type: string
                          description: Primera tasa (punta payout) del rango.
                        last:
                          type: string
                          description: Última tasa (punta payout) del rango.
                        change_pct:
                          type: string
                          nullable: true
                          description: Variación porcentual con signo primero→último (píntala verde/roja en el front).
                  asset_prices:
                    type: object
                    description: Series de precio USD de referencia de BTC y GOLD (solo display).
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: USD
                        unit:
                          type: string
                          example: gram
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                              price:
                                type: string
                        first:
                          type: string
                        last:
                          type: string
                        change_pct:
                          type: string
                          nullable: true
                  retrieved_at:
                    type: string
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                base: USD
                from: '2026-06-12'
                to: '2026-07-11'
                granularity: day
                rates:
                  chile:
                    currency: CLP
                    series:
                    - date: '2026-06-12'
                      rate: '939.068965'
                      payin_rate: '967.452325'
                    - date: '2026-06-13'
                      rate: '940.886699'
                      payin_rate: '969.325000'
                    - date: '2026-07-11'
                      rate: '910.896551'
                      payin_rate: '938.428400'
                    first: '939.068965'
                    last: '910.896551'
                    change_pct: '-3.00'
                  mexico:
                    currency: MXN
                    series:
                    - date: '2026-06-12'
                      rate: '17.241379'
                      payin_rate: '17.762500'
                    - date: '2026-07-11'
                      rate: '17.832512'
                      payin_rate: '18.371500'
                    first: '17.241379'
                    last: '17.832512'
                    change_pct: '3.43'
                asset_prices:
                  BTC:
                    currency: USD
                    unit: btc
                    series:
                    - date: '2026-06-12'
                      price: '106214.55'
                    - date: '2026-07-11'
                      price: '109853.24'
                    first: '106214.55'
                    last: '109853.24'
                    change_pct: '3.43'
                  GOLD:
                    currency: USD
                    unit: gram
                    series:
                    - date: '2026-06-12'
                      price: '106.8812'
                    - date: '2026-07-11'
                      price: '107.5341'
                    first: '106.8812'
                    last: '107.5341'
                    change_pct: '0.61'
                retrieved_at: '2026-07-11T15:00:00Z'
        '400':
          description: Rango de fechas o granularidad faltante/inválida (`invalid_range`, `invalid_granularity`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_range
                message: from and to are required (YYYY-MM-DD)
        '403':
          $ref: '#/components/responses/AccountRequired'
        '502':
          description: Historial de tasas temporalmente no disponible (`rates_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: rates_unavailable
                message: could not fetch fx rate history
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/payouts:
    post:
      tags:
      - Payouts
      operationId: createPayout
      summary: Crear un payout
      description: 'Dispersa fiat a una cuenta bancaria local. El monto local se convierte a USDT a **la
        tasa de tu cuenta** (la misma que devuelve `GET /v1/rates`); se debita `usdt_amount` más la comisión
        fija (cuando está configurada) y queda retenido hasta que la dispersión se complete. Si falla,
        se reembolsa el débito completo.


        **Paga desde cualquier saldo**: por defecto el débito sale del asset de settlement
        predeterminado de tu cuenta (USDT salvo que lo cambies con `PUT /v1/settlement`). Envía
        `settlement_asset` (USDT, USDC, BTC o GOLD) para pagar esta operación puntual desde otro saldo:
        el total en USDT se convierte a ese asset al precio efectivo de settlement del momento (ver el
        bloque `settlement` de `GET /v1/rates`) y el débito, la retención y — si falla — el reembolso
        viven en ese asset por el monto exacto. Si el precio de ejecución de BTC/GOLD no está
        disponible, el request devuelve `503 pricing_unavailable`; los assets volátiles además tienen
        un límite por operación (`422 settlement_limit_exceeded`).


        Requiere una llave de idempotencia (campo del body o header `Idempotency-Key`). Reintentar con
        la misma llave devuelve el payout original (`200` con `idempotency_hit: true`).'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              - currency
              - amount
              properties:
                country:
                  type: string
                  description: País de destino ISO 3166-1 alpha-2 (ej. CL, PE, MX).
                currency:
                  type: string
                  description: Moneda local (ej. CLP, PEN, MXN).
                method:
                  type: string
                  description: Método de payout de `GET /v1/payouts/methods` (ej. `bank_transfer`).
                amount:
                  type: string
                  description: Monto en moneda local como string decimal positivo.
                  example: '50000.00'
                beneficiary:
                  type: object
                  additionalProperties:
                    type: string
                  description: 'Datos de la cuenta de destino. Las claves requeridas dependen del

                    país y del método; ver `GET /v1/payouts/methods` y

                    `GET /v1/payouts/banks`. Ejemplos: RUT + banco en Chile, CLABE en

                    México, CCI en Perú. PIX Brasil: `pix_key` + `pix_key_type` (cpf,

                    cnpj, phone, email, evp), o cuenta bancaria sin llave con

                    `bank_code` (ISPB) + `branch_code` + `account_number` + `tax_id`.

                    '
                beneficiary_contact_id:
                  type: string
                  format: uuid
                  description: Usa el beneficiario guardado más reciente del contacto para este país
                    (y método, si lo envías) en vez de tipear `beneficiary` de nuevo. Un
                    `beneficiary` explícito siempre gana; 422 no_saved_destination si el contacto
                    no tiene.
                save_contact:
                  type: boolean
                  default: true
                  description: El beneficiario se guarda como contacto automáticamente; envía false para no guardarlo.
                description:
                  type: string
                settlement_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: Saldo virtual a debitar para esta operación. Omítelo
                    para usar el asset de settlement predeterminado de tu cuenta
                    (USDT salvo que lo cambies con `PUT /v1/settlement`).
                idempotency_key:
                  type: string
            examples:
              cl_bank_transfer:
                summary: Chile — transferencia bancaria (CLP)
                value:
                  country: CL
                  currency: CLP
                  method: bank_transfer
                  amount: '100000'
                  beneficiary:
                    name: Pedro Soto Fuentes
                    tax_id: 12.345.678-5
                    bank_code: '012'
                    account_type: checking
                    account_number: '123456789'
                  description: Supplier payment
                  idempotency_key: cl-prov-0091
              pe_bank_transfer:
                summary: Perú — transferencia bancaria vía CCI (PEN)
                value:
                  country: PE
                  currency: PEN
                  method: bank_transfer
                  amount: '1000.00'
                  beneficiary:
                    name: Rosa Alvarez Diaz
                    account_number: 00219300123456789012
                  idempotency_key: pe-cci-3310
              pe_yape:
                summary: Perú — Yape a un número de teléfono (PEN)
                value:
                  country: PE
                  currency: PEN
                  method: yape
                  amount: '150.00'
                  beneficiary:
                    name: Luis Ramos Vega
                    phone: '51987654321'
                  idempotency_key: pe-yape-8874
              mx_clabe:
                summary: México — SPEI a una CLABE (MXN)
                value:
                  country: MX
                  currency: MXN
                  method: bank_transfer
                  amount: '1500.00'
                  beneficiary:
                    name: Maria Lopez
                    account_type: clabe
                    account_number: 012180001234567895
                  idempotency_key: mx-clabe-8841
              mx_debit_card:
                summary: México — SPEI a una tarjeta de débito (MXN)
                value:
                  country: MX
                  currency: MXN
                  method: bank_transfer
                  amount: '800.00'
                  beneficiary:
                    name: Jorge Herrera
                    account_type: debit_card
                    account_number: '4152313412341234'
                    bank_code: '40012'
                  idempotency_key: mx-card-1102
              ve_pago_movil:
                summary: Venezuela — Pago Móvil (VES)
                value:
                  country: VE
                  currency: VES
                  method: pago_movil
                  amount: '2000.00'
                  beneficiary:
                    phone: '04141234567'
                    bank_code: '0102'
                    document_value: V12345678
                  idempotency_key: ve-pm-5567
              ve_bank_transfer:
                summary: Venezuela — transferencia bancaria (VES)
                value:
                  country: VE
                  currency: VES
                  method: bank_transfer
                  amount: '5000.00'
                  beneficiary:
                    name: Carmen Delgado
                    account_number: 01020123456789012345
                    document_value: V87654321
                  idempotency_key: ve-bank-7810
              bo_bank_transfer:
                summary: Bolivia — transferencia ACH (BOB)
                value:
                  country: BO
