  /v1/kyc:
    post:
      tags:
      - KYC / KYB
      operationId: submitKyc
      summary: Enviar verificación KYC/KYB
      description: Verifica la identidad de la cuenta que llama — KYC para personas, KYB para empresas
        (detectado desde el payload) — contra el servicio de compliance. Todos los campos de identidad
        son opcionales y se reenvían íntegros al motor de screening; mientras más datos envíes (fecha
        de nacimiento, países, documentos fuertes, alias), más preciso es el análisis. Si hay una comisión
        de compliance configurada, se debita antes de la llamada y se reembolsa si el screening falla.
        La respuesta incluye el resultado del screening más `kyc_status`, `compliance_service` y `compliance_fee`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  type: object
                  description: 'Datos de identidad. Envía `person` o `company`; cuando se omite

                    se completa desde el perfil de la cuenta. Se aceptan campos adicionales

                    y se reenvían al motor de screening.

                    '
                  properties:
                    person:
                      type: object
                      description: Identidad de la persona. Todos los campos son opcionales; más datos
                        de identidad producen un screening más preciso.
                      properties:
                        full_name:
                          type: string
                        first_name:
                          type: string
                        middle_name:
                          type: string
                        last_name:
                          type: string
                        date_of_birth:
                          description: String "YYYY-MM-DD" u objeto {year, month, day}.
                        nationality:
                          type: string
                          description: Código de país ISO-3166 (o arreglo `nationalities`).
                        country_of_birth:
                          type: string
                        residential_information:
                          type: array
                          items:
                            type: object
                            properties:
                              country_of_residence:
                                type: string
                        personal_identification:
                          type: array
                          description: Documentos de identidad fuertes (cédula, pasaporte, ...).
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                              issuing_country:
                                type: string
                              number:
                                type: string
                        alias:
                          type: array
                          items:
                            type: string
                          description: Otros nombres conocidos.
                    company:
                      type: object
                      description: Identidad de la empresa. Todos los campos son opcionales; más datos
                        de identidad producen un screening más preciso.
                      properties:
                        legal_name:
                          type: string
                        alias:
                          type: array
                          items:
                            type: string
                          description: Nombres comerciales / de fantasía.
                        tax_id:
                          type: string
                        registration_number:
                          type: string
                        registration_authority_identification:
                          type: string
                          description: Número ante el registro mercantil.
                        place_of_registration:
                          type: string
                        country_of_incorporation:
                          type: string
                        incorporation_date:
                          type: string
                        address:
                          type: array
                          items:
                            type: object
                            properties:
                              country:
                                type: string
                    email:
                      type: string
                    country:
                      type: string
                monitor:
                  type: boolean
                  default: false
                  description: Habilita el monitoreo continuo desde el inicio.
            examples:
              person:
                summary: Persona (KYC)
                value:
                  customer:
                    person:
                      full_name: Ana Perez Rojas
                      date_of_birth: '1990-04-12'
                      personal_identification:
                      - type: national_id
                        issuing_country: CL
                        number: 12.345.678-5
                    email: ana@example.com
                    country: CL
                  monitor: false
              personFull:
                summary: Persona (KYC) — identidad completa para el screening más preciso
                value:
                  customer:
                    person:
                      full_name: Ana Perez Rojas
                      date_of_birth: '1990-04-12'
                      nationality: CL
                      country_of_birth: CL
                      residential_information:
                      - country_of_residence: CL
                      personal_identification:
                      - type: national_id
                        issuing_country: CL
                        number: 12.345.678-5
                      - type: passport
                        issuing_country: CL
                        number: P0123456
                    email: ana@example.com
                    country: CL
                  monitor: false
              company:
                summary: Empresa (KYB)
                value:
                  customer:
                    company:
                      legal_name: Comercial Andina SpA
                      tax_id: 76.543.210-8
                    email: legal@andina.cl
                    country: CL
                  monitor: true
              companyFull:
                summary: Empresa (KYB) — identidad completa para el screening más preciso
                value:
                  customer:
                    company:
                      legal_name: Comercial Andina SpA
                      alias:
                      - Andina Market
                      tax_id: 76.543.210-8
                      registration_authority_identification: '76543210'
                      place_of_registration: CL
                      incorporation_date: '2015-08-01'
                      address:
                      - country: CL
                    email: legal@andina.cl
                    country: CL
                  monitor: true
              minimal:
                summary: Mínimo — autocompletado desde la cuenta
                value:
                  customer: {}
                  monitor: false
      responses:
        '201':
          description: Screening enviado; el estado KYC de la cuenta pasa a `pending`.
          content:
            application/json:
              schema:
                type: object
                description: Resultado del screening (pass-through) más los campos de cobro.
                properties:
                  kyc_status:
                    type: string
                    example: pending
                  compliance_service:
                    type: string
                    enum:
                    - compliance_person
                    - compliance_company
                  compliance_fee:
                    type: string
                    example: '0.000000'
              example:
                customer_id: e1d2c3b4-a596-8778-695a-4b3c2d1e0f9a
                status: completed
                risk_level: low
                screening_result: no_hits
                monitored: false
                deduplicated: false
                kyc_status: pending
                compliance_service: compliance_person
                compliance_fee: '2.000000'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '502':
          description: Screening temporalmente no disponible (`compliance_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: compliance_unavailable
                message: screening temporarily unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/kyc/rescreen:
    post:
      tags:
      - KYC / KYB
      operationId: rescreenKyc
      summary: Reejecutar verificación KYC/KYB
      description: Reejecuta la verificación de la cuenta. Requiere un envío previo de KYC/KYB. Cobra
        la comisión `compliance_rescreen` si está configurada; se reembolsa ante una falla upstream.
      responses:
        '200':
          description: Resultado del re-screening más los campos de cobro.
          content:
            application/json:
              schema:
                type: object
                properties:
                  compliance_service:
                    type: string
                    example: compliance_rescreen
                  compliance_fee:
                    type: string
              example:
                customer_id: e1d2c3b4-a596-8778-695a-4b3c2d1e0f9a
                status: completed
                screening_result: no_hits
                compliance_service: compliance_rescreen
                compliance_fee: '1.000000'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: La cuenta no tiene un screening previo (`no_kyc`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_kyc
                message: account has no compliance screening to rescreen
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/kyc/monitoring:
    patch:
      tags:
      - KYC / KYB
      operationId: setKycMonitoring
      summary: Habilitar o deshabilitar el monitoreo
      description: Activa o desactiva el monitoreo continuo de compliance para la identidad verificada
        de la cuenta. Habilitarlo cobra la comisión `compliance_monitoring` si está configurada; deshabilitarlo
        es gratis. Requiere un envío previo de KYC/KYB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
            example:
              enabled: true
      responses:
        '200':
          description: Estado del monitoreo más los campos de cobro.
          content:
            application/json:
              schema:
                type: object
                properties:
                  monitored:
                    type: boolean
                  compliance_service:
                    type: string
                    example: compliance_monitoring
                  compliance_fee:
                    type: string
              example:
                customer_id: e1d2c3b4-a596-8778-695a-4b3c2d1e0f9a
                monitored: true
                compliance_service: compliance_monitoring
                compliance_fee: '0.500000'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: La cuenta no tiene un screening previo (`no_kyc`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_kyc
                message: account has no compliance screening to monitor
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/webhooks/subscriptions:
    post:
      tags:
      - Webhooks
      operationId: createWebhookSubscription
      summary: Crear una suscripción de webhook
      description: 'Suscribe un callback HTTPS a los eventos de la cuenta que llama.


        Las entregas van firmadas: `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`
        con el timestamp en `X-Webhook-Timestamp`. Hasta 5 intentos con backoff incremental.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - event_type
              - callback_url
              - secret
              properties:
                event_type:
                  type: string
                  enum:
                  - payin_credited
                  - payout_status_changed
                  - transfer_received
                  - crypto_deposit_credited
                  - crypto_withdrawal_status_changed
                  - '*'
                callback_url:
                  type: string
                  format: uri
                  description: Solo HTTPS; localhost e IPs privadas se rechazan.
                secret:
                  type: string
                  minLength: 16
            example:
              event_type: payout_status_changed
              callback_url: https://api.myapp.com/webhooks/cbpay
              secret: a-strong-shared-secret-123
      responses:
        '201':
          description: Suscripción creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  event_type:
                    type: string
                  callback_url:
                    type: string
                  status:
                    type: string
                    example: active
                  created_at:
                    type: string
                    format: date-time
                  secret_stored:
                    type: boolean
              example:
                id: 8e7f6a5b-4c3d-2e1f-0a9b-8c7d6e5f4a3b
                event_type: payout_status_changed
                callback_url: https://api.myapp.com/webhooks/cbpay
                status: active
                created_at: '2026-07-07T12:00:00Z'
                secret_stored: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - Webhooks
      operationId: listWebhookSubscriptions
      summary: Listar suscripciones de webhook
      description: Lista las suscripciones de webhook de la cuenta (el secreto nunca se devuelve).
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      responses:
        '200':
          description: Suscripciones.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                page: 1
                page_size: 50
                subscriptions:
                - id: 475b48fc-2858-4ad3-81e2-ec68742d8245
                  event_type: payout_status_changed
                  callback_url: https://api.example.com/webhooks/cbpay
                  status: active
                  created_at: '2026-07-07T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
