      summary: Estado de tarjeta cambiado
      description: Se dispara cuando una tarjeta cambia de estado (active, frozen, cancelled),
        incluidos los congelamientos automáticos cuando la mensualidad no se puede cobrar.
      requestBody:
        content:
          application/json:
            example:
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
              status: frozen
              reason: monthly_fee_unpaid
      responses:
        '200':
          description: Responde cualquier 2xx para confirmar.
