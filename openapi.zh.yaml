                amount_raw: '25500000'
                fee: '0.000000'
                fee_asset: USDT
                status: processing
                tx_id: b1946ac92492d2347c6235b4d2611184e0f0f8c9d3a1e2b3c4d5e6f708192a3b
                idempotency_key: send-2026-07-11-a
                created_at: '2026-07-11T12:05:00Z'
        '200':
