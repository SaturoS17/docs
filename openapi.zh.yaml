        '200':
          description: 每个联系人的结果。
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                  matched:
                    type: integer
                  total:
                    type: integer
                  contacts:
                    type: array
                    items:
                      type: object
              example:
                imported: 2
                matched: 1
                total: 2
                contacts:
                - name: Carlos Soto
                  phone: '+56987654321'
                  contact_id: 3f8a1b2c-4d5e-6f70-8a9b-0c1d2e3f4a5b
