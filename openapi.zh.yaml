          content:
            application/json:
              schema: *id009
              example:
                error: wallet_limit_reached
                message: person accounts hold one segregated wallet per network/asset pair; company accounts
                  have no limit
    get:
      tags:
      - 隔离钱包
      operationId: listSegregatedWallets
      summary: 列出我的隔离钱包
