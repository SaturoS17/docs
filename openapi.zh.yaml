      operationId: importSegregatedWallet
      summary: 导入外部钱包
      description: 通过提供 `private_key_hex` 导入你已控制的钱包。私钥只会传输至托管方,平台**绝不存储或记录**。需要带 2FA 的登录用户会话(API key 会以
