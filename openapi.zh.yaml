  /v1/payins/collect:
    post:
      tags:
      - 收款(Payins)
      operationId: payinCollect
      summary: 主动收款(pull)
      description: 在支持 pull 收款的通道(例如委内瑞拉 `c2p` / `debito_inmediato`)直接向付款人扣款。同步执行:若扣款获批,存款按你当前的 `payin_rate`
        转换并在同一调用中入账,已扣除 payin 费用。若付款人拒绝,`paid` 为 false,payin 标记为 failed 且不产生任何扣款。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - amount
              - idempotency_key
              properties:
                country:
                  type: string
                  default: VE
                currency:
                  type: string
                  default: VES
                method:
                  type: string
                  description: 收款方式(例如 c2p、debito_inmediato)。
                amount:
                  type: string
                  description: 本地金额,正数十进制字符串。
                description:
                  type: string
                our_reference:
                  type: string
                payer_document:
                  type: string
                payer_phone:
                  type: string
                payer_bank:
                  type: string
                payer_account:
                  type: string
                payer_name:
                  type: string
                payer_account_type:
                  type: string
                otp:
                  type: string
                otp_reference:
                  type: string
                idempotency_key:
                  type: string
                  description: 必填——collect 执行真实扣款;使用相同键的重试绝不重复扣款。
            example:
              method: c2p
              amount: '1200.00'
              description: 订单 5512
              payer_document: V12345678
              payer_phone: '04141234567'
              payer_bank: '0102'
              otp: '12345678'
              idempotency_key: collect-2026-07-07-a
      responses:
        '200':
          description: '收款结果。`paid: true` 表示存款已入账。'
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                  kind:
                    type: string
                  country:
                    type: string
                  currency:
                    type: string
                  method:
                    type: string
                  local_amount:
                    type: string
                  status:
                    type: string
                  fx_rate:
                    type: string
                  usdt_gross:
                    type: string
                  fee:
                    type: string
                  usdt_credited:
                    type: string
                  paid:
                    type: boolean
                  provider_reference:
                    type: string
                  status_code:
                    type: string
                  status_message:
                    type: string
                  failure:
                    type: object
                    description: '仅当主动收款的 payin 为 `failed` 时出现：拒绝来源（`provider` = 付款人的银行，`core` = 扣款前校验）以及具体的代码和消息。'
                    properties:
                      source:
                        type: string
                      code:
                        type: string
                      message:
                        type: string
              example:
                payin_id: 7b3c9e2f-1a2b-3c4d-5e6f-7a8b9c0d1e2f
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: collect
                country: VE
                currency: VES
                method: c2p
                local_amount: '1200.00'
                status: credited
                reference: REF-102030
                fx_rate: '36.50'
                usdt_gross: '32.876712'
                fee: '0.300000'
                usdt_credited: '32.576712'
                paid: true
                provider_reference: PRV-889911
                status_code: '00'
                status_message: approved
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:02Z'
        '400':
          description: invalid_request / invalid_amount
          content:
            application/json:
              schema: &id012
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_request
                message: method is required (e.g. c2p, debito_inmediato)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 账户未激活(account_blocked)。
          content:
            application/json:
              schema: *id012
              example:
                error: account_blocked
                message: account is not active
        '502':
          description: 核心不可用(core_unavailable)。
          content:
            application/json:
              schema: *id012
              example:
                error: core_unavailable
                message: could not execute the collection
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
  /v1/payins/collect/otp:
    post:
      tags:
      - 收款(Payins)
      operationId: payinCollectOtp
      summary: 请求收款 OTP
      description: 请求部分 pull 方式在扣款前所需的一次性密码(例如即时借记)。免费。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - amount
              properties:
                country:
                  type: string
                  default: VE
                currency:
                  type: string
                  default: VES
                method:
                  type: string
                amount:
                  type: string
                payer_document:
                  type: string
                payer_phone:
                  type: string
                payer_bank:
                  type: string
                payer_account:
                  type: string
            example:
              method: debito_inmediato
              amount: '1200.00'
              payer_document: V12345678
              payer_phone: '04141234567'
              payer_bank: '0102'
              payer_account: 01020123456789012345
      responses:
        '200':
          description: OTP 已发送给付款人。
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    type: string
                  result:
                    type: object
                    additionalProperties: true
              example:
                method: debito_inmediato
                result:
                  status: sent
                  otp_reference: OTP-5521
        '400':
          description: invalid_request
          content:
            application/json:
              schema: *id012
              example:
                error: invalid_request
                message: method is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: 核心不可用(core_unavailable)。
          content:
            application/json:
              schema: *id012
              example:
                error: core_unavailable
                message: could not request the OTP
  /v1/payins/deposit-accounts:
    post:
      tags:
      - 收款(Payins)
      operationId: createDepositAccount
      summary: 创建专属充值账户
      description: 在支持的通道(例如墨西哥 CLABE 或阿根廷 CVU)为你的账户开通固定充值目的地。到达该目的地的每笔转账都会自动入账,已扣除 payin 费用。创建免费。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                country:
                  type: string
                  default: MX
                currency:
                  type: string
                  default: MXN
                method:
                  type: string
                  default: bank_transfer
            examples:
              mx_clabe:
                summary: 墨西哥 — 专属 CLABE(MXN)
                value:
                  country: MX
                  currency: MXN
              ar_cvu:
                summary: 阿根廷 — 专属 CVU(ARS)
                value:
                  country: AR
                  currency: ARS
      responses:
        '201':
          description: 充值账户已创建并绑定到调用账户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositInstrument'
              example: &id013
                instrument_id: a1d4b7c0-1234-5678-9abc-def012345678
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                country: MX
                currency: MXN
                method: bank_transfer
                instrument: '734180000151000006'
                details:
                  clabe: '734180000151000006'
                  status: active
                status: active
                created_at: '2026-07-07T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 账户未激活(account_blocked)。
          content:
            application/json:
              schema: *id012
              example:
                error: account_blocked
                message: account is not active
        '502':
          description: 核心不可用(core_unavailable)。
          content:
            application/json:
              schema: *id012
              example:
                error: core_unavailable
                message: could not create the deposit account
    get:
      tags:
      - 收款(Payins)
      operationId: listDepositAccounts
      summary: 列出我的充值账户
      description: 列出绑定到调用账户的专属充值目的地。
      responses:
        '200':
          description: 调用账户的充值账户。
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposit_accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/DepositInstrument'
              example:
                deposit_accounts:
                - *id013
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/banking/customer:
    post:
      tags:
      - 银行服务
      operationId: createBankingCustomer
      summary: 创建我的银行档案
      description: 开通账户的银行档案(每个账户一次)。省略的 `type`/`name`/`email` 从 CBPay 账户自动填充。按固定 `banking_customer` 费用从
        USDT 余额计费;若通道拒绝则退款。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                  example: USD
                type:
                  type: string
                  enum:
                  - INDIVIDUAL
                  - COMPANY
                name:
                  type: string
                email:
                  type: string
                address:
                  type: object
                  additionalProperties: true
            example:
              currency: USD
              address:
                countryIso: CL
                city: Santiago
      responses:
        '201':
          description: 银行档案已创建(状态 draft)。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                customer_id: 9f2b1c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                provider_id: BNK-88f13a
                status: draft
                data:
                  item:
                    type: INDIVIDUAL
                    name: Ana Perez Rojas
                created_at: '2026-07-07T12:00:00Z'
                banking_fee: '5.000000'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: 该账户已有银行档案(banking_customer_exists)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: banking_customer_exists
                message: this account already has a banking customer
        '502':
          description: 银行通道错误;所有费用已退款(banking_request_failed)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: banking_request_failed
                  message: request rejected
    get:
      tags:
      - 银行服务
      operationId: getBankingCustomer
      summary: 获取我的银行档案
      description: 返回账户的银行档案及其实时验证状态。
      responses:
        '200':
          description: 带归一化状态的银行档案(draft、submitted、under_review、approved、rejected)。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                customer_id: 9f2b1c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                provider_id: BNK-88f13a
                status: approved
                data:
                  item:
                    type: INDIVIDUAL
                    name: Ana Perez Rojas
                created_at: '2026-07-07T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 尚无银行档案(no_banking_customer)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_banking_customer
                message: create your banking customer first (POST /v1/banking/customer)
