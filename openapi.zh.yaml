      - 账户
      operationId: getSettlement
      summary: 获取我的结算设置
      description: 返回你的操作(payouts 与服务费)默认从哪个虚拟余额扣款、payins 默认入账到哪个余额(`default_payin_asset`)、组织允许哪些资产,以及适用于波动性资产(BTC/GOLD)的单笔限额(USDT 等值)。
