  /v1/balances/history:
    get:
      tags:
      - 余额
      operationId: getBalancesHistory
      summary: 获取余额历史
      description: '账户余额的每日演变,用于仪表盘图表:每个资产一条序列(每日收盘可用余额,无流水的日期沿用前值),外加一条按各日历史参考价对 BTC/GOLD 估值的 USD 汇总序列。包含期间总流入/流出及当前快照(可用
        + 冻结),前端可据此渲染 Mercury 风格的余额卡片及其百分比变化。序列跟踪**可用**余额(冻结没有历史);`current` 携带今日各资产的 `held`。在历史价格存在之前用今日现价估值的日期会在
        `spot_priced_dates` 中披露——绝不虚构数值。


        `assets` 映射还包含银行账户镜像(`BANK_USD`、`BANK_EUR`),以其自身货币(2 位小数)作为独立序列提供。它们**不**计入 `total_usd` 汇总——该汇总仅覆盖运营余额(USDT、USDC、BTC、GOLD)。

        '
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: 开始日期(YYYY-MM-DD,UTC,含当日)。
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: 结束日期(YYYY-MM-DD,UTC,含当日)。最大范围 366 天。
      responses:
        '200':
          description: 每个资产的每日余额序列,外加 USD 汇总。
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  from:
                    type: string
                  to:
                    type: string
                  granularity:
                    type: string
                    example: day
                  timezone:
                    type: string
                    example: UTC
                  assets:
                    type: object
                    description: 每个资产一条每日收盘余额序列。包含运营余额(USDT、USDC、BTC、GOLD)以及以自身货币计的银行账户镜像(BANK_USD、BANK_EUR);银行序列不计入
                      `total_usd`。
                    additionalProperties:
                      type: object
                      properties:
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                example: '2026-07-10'
                              balance:
                                type: string
                                example: '125.430000'
                        first:
                          type: string
                        last:
                          type: string
                        change_pct:
                          type: string
                          nullable: true
                          description: 首→末的带符号百分比变化(序列从零开始时为 null)。
                  total_usd:
                    type: object
                    description: 所有余额按日汇总的 USD 价值。
                    properties:
                      series:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            balance_usd:
                              type: string
                      first:
                        type: string
                      last:
                        type: string
                      change_pct:
                        type: string
                        nullable: true
                      spot_priced_dates:
                        type: array
                        items:
                          type: string
                        description: 因不存在历史价格而按今日现价估值的日期。
                      unpriced_assets:
                        type: array
                        items:
                          type: string
                        description: 因缺少任何价格而被排除在 USD 汇总之外的资产。
                  period:
                    type: object
                    description: 期间的总流入/流出(USD)。
                    properties:
                      in_usd:
                        type: string
                      out_usd:
                        type: string
                      net_usd:
                        type: string
                  current:
                    type: object
                    description: 当前快照(可用 + 冻结,按现价估值)。
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            asset:
                              type: string
                            available:
                              type: string
                            held:
                              type: string
                            usd_estimate:
                              type: string
                              nullable: true
                      net_worth_usd_estimate:
                        type: string
                        nullable: true
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                from: '2026-06-12'
                to: '2026-07-11'
                granularity: day
                timezone: UTC
                assets:
                  USDT:
                    series:
                    - date: '2026-06-12'
                      balance: '100.000000'
                    - date: '2026-06-13'
                      balance: '100.000000'
                    - date: '2026-07-11'
                      balance: '125.430000'
                    first: '100.000000'
                    last: '125.430000'
                    change_pct: '25.43'
                  BTC:
                    series:
                    - date: '2026-06-12'
                      balance: '0.00060000'
                    - date: '2026-07-11'
                      balance: '0.00060000'
                    first: '0.00060000'
                    last: '0.00060000'
                    change_pct: '0.00'
                  BANK_USD:
                    series:
                    - date: '2026-06-12'
                      balance: '1500.00'
                    - date: '2026-07-11'
                      balance: '1725.50'
                    first: '1500.00'
                    last: '1725.50'
                    change_pct: '15.03'
                total_usd:
                  series:
                  - date: '2026-06-12'
                    balance_usd: '163.73'
                  - date: '2026-07-11'
                    balance_usd: '191.34'
                  first: '163.73'
                  last: '191.34'
                  change_pct: '16.86'
                  spot_priced_dates: []
                  unpriced_assets: []
                period:
                  in_usd: '280.20'
                  out_usd: '254.77'
                  net_usd: '25.43'
                current:
                  items:
                  - asset: USDT
                    available: '125.430000'
                    held: '10.000000'
                    usd_estimate: '135.43'
                  - asset: USDC
                    available: '0.000000'
                    held: '0.000000'
                    usd_estimate: '0.00'
                  - asset: BTC
                    available: '0.00060000'
                    held: '0.00000000'
                    usd_estimate: '65.91'
                  - asset: GOLD
                    available: '0.000000'
                    held: '0.000000'
                    usd_estimate: '0.00'
                  net_worth_usd_estimate: '201.34'
        '400':
          description: 日期范围缺失或无效(`invalid_range`)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_range
                message: from and to are required (YYYY-MM-DD)
        '403':
          $ref: '#/components/responses/AccountRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
