                type:
                  type: string
                  enum:
                  - INDIVIDUAL
                  - COMPANY
                  description: 可选:必须与验证类型一致。
                name:
                  type: string
                  description: 可选:从已验证的档案自动填充。
                email:
                  type: string
                  format: email
                  description: 可选:从已验证的档案自动填充。
                country:
                  type: string
            example:
