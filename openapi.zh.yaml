                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                action: payout
                channel: whatsapp
                phone: '********5678'
                status: pending
                created_at: '2026-07-08T21:00:00Z'
                expires_at: '2026-07-08T21:10:00Z'
        '403':
          description: API key 凭证(`session_required`)，或最近绑定且未验证的手机号且无替代因素(`phone_binding_cooldown`)。手机号处于冷却期时，质询会自动改用身份验证器应用（若已注册）或已验证的登录邮箱；实际使用的渠道会在质询响应中返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: session_required
                message: OTP verification requires a user session (JWT), not an API key
        '409':
