    post:
      tags:
      - 银行服务
      operationId: createBankingOperation
      summary: 发送银行付款
      description: 执行 TRANSFER(你自己的银行账户之间)或 WITHDRAW(至已登记的受益人)。必须提供幂等键;使用相同键重试会返回原始操作而不重复扣费。按固定 `banking_operation`
        费用计费;若通道拒绝则退款。最终状态通过 banking_operation_status_changed webhook 送达。
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currency
              - type
              - sourceRequisit
              - destinationRequisit
              - amount
              properties:
                currency:
                  type: string
                  example: USD
                type:
                  type: string
                  enum:
                  - TRANSFER
                  - WITHDRAW
                paymentType:
                  type: string
                  description: TRANSFER 时为空;WITHDRAW 时为通道代码(例如 SEPA_CT)。
                sourceRequisit:
                  type: object
                  properties:
                    account:
                      type: string
                destinationRequisit:
                  type: object
                  properties:
                    account:
                      type: string
                      description: 目标账户(TRANSFER)。
                    beneficiar:
                      type: string
                      description: 受益人账户(WITHDRAW)。
                amount:
                  type: object
                  properties:
                    currencyCode:
                      type: string
                    units:
                      type: string
                    nanos:
                      type: integer
                comment:
                  type: string
                idempotency_key:
                  type: string
            examples:
              withdraw:
                summary: WITHDRAW 至受益人(SEPA)
                value:
                  currency: USD
                  type: WITHDRAW
                  paymentType: SEPA_CT
                  sourceRequisit:
                    account: c4d1e2f3-a4b5-c6d7-e8f9-a0b1c2d3e4f5
                  destinationRequisit:
                    beneficiar: BNK-CPACC-11
                  amount:
                    currencyCode: USD
                    units: '250'
                    nanos: 0
                  comment: Invoice 8841
                  idempotency_key: acme-payment-0071
              transfer:
                summary: 自有账户间 TRANSFER
                value:
                  currency: USD
                  type: TRANSFER
                  paymentType: EMPTY
                  sourceRequisit:
                    account: c4d1e2f3-a4b5-c6d7-e8f9-a0b1c2d3e4f5
                  destinationRequisit:
                    account: d5e2f3a4-b5c6-d7e8-f9a0-b1c2d3e4f5a6
                  amount:
                    currencyCode: USD
                    units: '100'
                    nanos: 0
                  idempotency_key: internal-move-0012
      responses:
        '202':
          description: 操作已受理(最终状态经由 webhook)。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                operation_id: 7e8a9b0c-1d2e-3f4a-5b6c-7d8e9f0a1b2c
                provider_id: BNK-OP-90213
                status: pending
                idempotency_key: platform:9b1deb4d:acme-payment-0071
                data:
                  type: WITHDRAW
                  paymentType: SEPA_CT
                banking_fee: '2.000000'
        '200':
          description: 既有操作的幂等重放(不产生新扣费)。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                operation_id: 7e8a9b0c-1d2e-3f4a-5b6c-7d8e9f0a1b2c
                provider_id: BNK-OP-90213
                status: pending
                idempotency_key: platform:9b1deb4d:acme-payment-0071
                data:
                  type: WITHDRAW
                  paymentType: SEPA_CT
                idempotency_hit: true
        '400':
          description: idempotency_key_required / 载荷无效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: provide idempotency_key (body or Idempotency-Key header)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
