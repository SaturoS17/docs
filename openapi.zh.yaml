      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from_asset
              - to_asset
              - amount
              properties:
                from_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                to_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                amount:
                  type: string
                  description: 源货币金额(USDT/USDC/GOLD 为 6 位小数,BTC 为 8 位)。
                idempotency_key:
                  type: string
                  description: >-
                    客户端选择的键。前缀 payin-convert: 和 checkout-swap: 保留给系统自动转换使用，会被拒绝并返回 400 reserved_idempotency_key。
            examples:
              usdt_btc:
                summary: USDT 兑换 BTC
                value:
                  from_asset: USDT
                  to_asset: BTC
                  amount: '1000'
                  idempotency_key: swap-2026-07-10-a
              cross:
                summary: BTC 直接兑换 GOLD
                value:
                  from_asset: BTC
                  to_asset: GOLD
                  amount: '0.01'
                  idempotency_key: swap-2026-07-10-b
              stables:
                summary: USDT 兑换 USDC
                value:
                  from_asset: USDT
                  to_asset: USDC
                  amount: '500'
                  idempotency_key: swap-2026-07-10-c
      responses:
        '201':
          description: swap 已执行(同步)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swap'
              example:
                swap_id: 8a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                from_asset: USDT
                to_asset: BTC
                from_amount: '1000.000000'
                to_amount: '0.01568419'
                rate: '0.00001568'
                status: completed
                idempotency_key: swap-2026-07-10-a
                created_at: '2026-07-10T15:00:00Z'
        '200':
          description: 幂等重放(原始 swap,绝不重复执行)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swap'
              example:
                swap_id: 8a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                from_asset: USDT
                to_asset: BTC
                from_amount: '1000.000000'
                to_amount: '0.01568419'
                rate: '0.00001568'
                status: completed
                idempotency_key: swap-2026-07-10-a
                created_at: '2026-07-10T15:00:00Z'
                idempotency_hit: true
        '400':
          description: invalid_asset / invalid_pair / invalid_amount / amount_too_small / swap_asset_disabled
            / idempotency_key_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: amount_too_small
                message: amount is too small to convert at the current rate
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          description: verification_required / service_disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: service_disabled
                message: this service is not enabled for your account
        '422':
          description: settlement_limit_exceeded / settlement_daily_limit_exceeded(与 payouts 和卡片共享的波动性上限)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: settlement_daily_limit_exceeded
                message: the account exceeded its 24h volume for volatile assets; retry later or use smaller
                  amounts
        '503':
          description: 执行价格不可用或过期(pricing_unavailable)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: pricing_unavailable
                message: execution price is unavailable or stale; retry later
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
