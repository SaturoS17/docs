            application/json:
              schema:
                type: object
              example:
                items:
                - country: BO
                  currency: BOB
                  method: qr
                  delivery: push
                - country: CL
                  currency: CLP
                  method: bank_transfer
                  delivery: push
                - country: MX
                  currency: MXN
                  method: bank_transfer
                  delivery: push
                - country: PE
                  currency: PEN
                  method: bank_transfer
                  delivery: polling
                - country: PY
                  currency: PYG
                  method: bank_transfer
                  delivery: polling
                - country: VE
                  currency: VES
                  method: c2p
                  delivery: push+polling
                meta:
                  retrieved: 6
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/transfers:
    post:
      tags:
      - 转账
      operationId: createTransfer
      summary: 创建内部转账
      description: '在两个 CBPay 账户之间划转余额,原子执行且始终免费——任意组合皆可:个人对个人、个人对企业、企业对个人或企业对企业。支持四个虚拟余额(默认 `USDT`、`USDC`、`BTC`、`GOLD`),且始终在**同一货币**的余额之间进行(不做兑换)。目标通过
        `to_account_id`、`to_email`、`to_phone`(仅 OTP 已验证的手机号)或 `to_contact_id` 解析。每笔转账都会自动把收款人保存为联系人(用
        `save_contact: false` 退出)。收款方的 webhook 订阅者会收到 `transfer_received`。'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                to_account_id:
                  type: string
                  format: uuid
                to_email:
                  type: string
                  format: email
                to_phone:
                  type: string
                  description: 目标账户的 E.164 手机号。只有 OTP 已验证手机号的账户能被解析(否则 404 recipient_not_found;若多个账户共用该号码则
                    422 recipient_ambiguous)。
                to_contact_id:
                  type: string
                  format: uuid
                  description: 直接发送给通讯录中的联系人(使用其关联的 CBPay 账户,或其已验证的手机号)。
                to_qr_token:
                  type: string
                  description: 目标账户的个人资料二维码令牌(从其 CBPay 二维码扫描)。也接受扩展的结账二维码载荷(`cbpay:pay?to=…&checkout=…`)——嵌入的结账令牌会自动生效。
                checkout_token:
                  type: string
                  description: 可选的通用收款链接令牌,用于直接支付该链接。目的账户被强制为链接的账户,金额必须覆盖服务端以所选资产报价的应付额(否则返回
                    `422 checkout_amount_mismatch` 并附最新应付额)。完成后链接结清并自动兑换为其 `settlement_asset`。
                asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  default: USDT
                  description: 要划转的余额币种;接收方以同一币种入账。
                amount:
                  type: string
                  description: 正数十进制字符串,不超过该货币的小数位数(USDT/USDC/GOLD 为 6 位,BTC 为 8 位)。
                  example: '10.500000'
                description:
                  type: string
                idempotency_key:
                  type: string
                save_contact:
                  type: boolean
                  default: true
                  description: 收款目的地会自动保存为联系人;传 false 可跳过。
            examples:
              by_phone:
                summary: 按已验证手机号
                value:
                  to_phone: '+56987654321'
                  amount: '25.000000'
                  description: 午餐
                  idempotency_key: lunch-2026-07-10-a
              by_contact:
                summary: 发送给已保存的联系人
                value:
                  to_contact_id: 3f8a1b2c-4d5e-6f70-8a9b-0c1d2e3f4a5b
                  amount: '10.000000'
                  idempotency_key: t-991
              by_email:
                summary: 个人 → 个人,按邮箱
                value:
                  to_email: carlos@example.com
                  amount: '25.000000'
                  description: 费用分摊
                  idempotency_key: split-2026-07-06-a
              by_account_id:
                summary: 个人 → 企业,按 account_id
                value:
                  to_account_id: ae8cf540-22a9-414d-82cc-8ac04732be4f
                  amount: '120.500000'
                  description: 月度服务费
                  idempotency_key: serv-2026-07-a
              payroll:
                summary: 企业 → 个人(发薪)
                value:
                  to_email: employee@example.com
                  amount: '850.000000'
                  description: 七月工资
                  idempotency_key: payroll-2026-07-emp01
              gold:
                summary: 另一种货币(GOLD,黄金克数)
                value:
                  to_email: carlos@example.com
                  asset: GOLD
                  amount: '2.500000'
                  description: 黄金赠礼
                  idempotency_key: gold-2026-07-09-a
      responses:
        '201':
          description: 转账已完成。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              example:
                transfer_id: 2a7b9c1d-4e5f-6a70-8b9c-0d1e2f3a4b5c
                from_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                to_account_id: 5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b
                asset: USDT
                amount: '25.000000'
                description: 费用分摊
                status: completed
