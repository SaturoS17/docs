          application/json:
            schema:
              type: object
              required:
              - contacts
              properties:
                contacts:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      phones:
                        type: array
                        items:
                          type: string
                      email:
                        type: string
            example:
              contacts:
              - name: Carlos Soto
                phones:
                - +56 9 8765 4321
              - name: Ana Perez
                phones:
                - '912345678'
