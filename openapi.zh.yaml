          type: string
          format: uuid
      responses:
        '200':
          description: 挑战。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPChallenge'
              example: *id015
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
