  /v1/aml/rescreen:
    post:
      tags:
      - AML screening
      operationId: rescreenAml
      summary: 重新运行 AML 筛查
      description: 重新运行账户筛查，需先有筛查记录。若配置则收取 `compliance_rescreen` 费用，上游失败则退款。每次重新筛查写入历史（`GET /v1/aml/screenings`）。必须提供
        `idempotency_key`——相同键重放返回原记录且不会重复扣费。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotency_key
              properties:
                idempotency_key:
                  type: string
                  description: 必填（重新筛查收费）。也可使用 Idempotency-Key 请求头。
            example:
              idempotency_key: aml-rescreen-2026-07-12
      responses:
        '200':
          description: 重新筛查结果已本地保存。
          content:
            application/json:
              example:
                screening_id: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                kind: rescreen
                service: compliance_rescreen
                risk: low
                screening_fee: '1.000000'
                fee_asset: USDT
                idempotency_key: aml-rescreen-2026-07-12
                created_at: '2026-07-12T19:00:00Z'
                result:
                  customer_id: e1d2c3b4-a596-8778-695a-4b3c2d1e0f9a
                  status: completed
                  screening_result: no_hits
        '400':
          description: 缺少 idempotency_key（`idempotency_key_required`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: provide idempotency_key (body or Idempotency-Key header)
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: Account has no prior screening (`no_screening`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_screening
                message: account has no AML screening to rescreen
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/aml/monitoring:
    patch:
      tags:
      - AML screening
      operationId: setAmlMonitoring
      summary: 启用或停用 AML 监控
      description: 切换账户已验证身份的持续合规监控。启用时若配置则收取 `compliance_monitoring` 费用；停用免费。需先有筛查记录。 每次状态变更写入审计历史（`GET
        /v1/aml/screenings`，筛选 kind monitoring）。状态实际变更时 必须提供 `idempotency_key`——相同键重放返回原事件且 `idempotency_hit`
        true。若已是目标状态则返回 unchanged true 且不扣费。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
                idempotency_key:
                  type: string
                  description: 状态变更时必填（启用会收费）. Also accepted as the Idempotency-Key header.
            example:
              enabled: true
              idempotency_key: aml-monitor-enable-1
      responses:
        '200':
          description: 监控状态已本地保存。
          content:
            application/json:
              example:
                screening_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
                kind: monitoring
                service: compliance_monitoring
                monitor: true
                monitoring_enabled: true
                screening_fee: '1.000000'
                fee_asset: USDT
                idempotency_key: aml-monitor-enable-1
                created_at: '2026-07-12T20:00:00Z'
                compliance_service: compliance_monitoring
                compliance_fee: '1.000000'
        '400':
          description: 状态变更时缺少 idempotency_key (`idempotency_key_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: provide idempotency_key (body or Idempotency-Key header)
                compliance_fee: '0.500000'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: Account has no prior screening (`no_screening`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_screening
                message: account has no AML screening to monitor
        '401':
          $ref: '#/components/responses/Unauthorized'
