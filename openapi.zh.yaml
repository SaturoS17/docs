                chain: tron
                asset: USDT
                address: TRmSZRaMAqLEevAdGwo3R43bRBXamWR5bd
                label: Acme Client
                type: segregated
                origin: created
                custody: cbpay
                exported: false
                created_at: '2026-07-11T12:00:00Z'
        '400':
