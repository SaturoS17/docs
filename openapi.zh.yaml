  /v1/segregated-wallets:
    post:
      tags:
      - 隔离钱包
      operationId: createSegregatedWallet
      summary: 创建隔离钱包
      description: 创建一个由调用方账户拥有的链上新钱包。其余额存在于链上(从不进入账本),并豁免于资金归集(treasury sweep)。支持的组合:`tron`/`usdt`、`eth`/`usdt`、`eth`/`usdc`、`btc`/`btc`。企业账户可创建不限数量的钱包;个人账户每个网络+资产组合限
        **1 个**(创建第二个会返回 `422 wallet_limit_reached`)。可选的 `Idempotency-Key`(或请求体中的 `idempotency_key`)让重试安全:重复请求返回同一钱包,不会创建第二个。可能收取
        `wallet_creation` 费用(创建失败退款)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - chain
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                  - btc
                asset:
                  type: string
                  enum:
                  - usdt
                  - usdc
                  - btc
                  default: usdt
                label:
                  type: string
                idempotency_key:
                  type: string
            examples:
              tron_usdt:
                summary: TRON USDT
                value:
                  chain: tron
                  asset: usdt
                  label: Acme Client
                  idempotency_key: wallet-client-001
              eth_usdc:
                summary: Ethereum USDC
                value:
                  chain: eth
                  asset: usdc
                  label: Project X
                  idempotency_key: wallet-project-x
              btc_btc:
                summary: Bitcoin BTC
                value:
                  chain: btc
                  asset: btc
                  label: BTC custody
                  idempotency_key: wallet-btc-001
      responses:
