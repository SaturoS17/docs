  /v1/crypto/withdrawals:
    post:
      tags:
      - 加密货币
      operationId: createCryptoWithdrawal
      summary: 创建链上提现
      description: 从其自身余额链上发送 USDT、USDC 或 BTC。支持的组合:`tron`/`USDT`、`eth`/`USDT`、`eth`/`USDC`、`btc`/`BTC`(GOLD 无链上通道)。`amount
        + 提现费` 原子扣除并冻结;最终状态通过 `crypto_withdrawal_status_changed` webhook 送达。`failed` 会全额退款。
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                  - btc
                  default: tron
                asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  default: USDT
                  description: 要发送的资产(USDC 仅支持 `eth`;在 `btc` 上资产默认为 `BTC`)。
                to_address:
                  type: string
                to_contact_id:
                  type: string
                  format: uuid
                  description: 使用联系人为该链保存的地址代替 `to_address`(显式 `to_address` 始终优先)。
                amount:
                  type: string
                  description: 正数十进制字符串,最多 6 位小数(BTC 为 8 位)。
                idempotency_key:
                  type: string
                contact_name:
                  type: string
                  description: 为保存此地址的自动联系人指定名称。
                save_contact:
                  type: boolean
                  default: true
                  description: 地址会自动保存为联系人;传 false 可跳过。
                travel_address:
                  type: string
                  description: Travel Rule(FATF R.16)— 超过组织阈值且转往其他机构时,收款机构的 travel address(`ta…` 代码)。付款地址由收款机构提供,因此可省略
                    `to_address`。
                wallet_type:
                  type: string
                  enum:
                  - self_hosted
                  description: Travel Rule — 目的地为账户持有人自己的钱包时声明 `self_hosted`(需要 `beneficiary_name`)。
                beneficiary_name:
                  type: string
                  description: Travel Rule — 目的持有人的姓名。超过阈值时必填(配合 `travel_address` 或 `wallet_type=self_hosted`)。
            examples:
              usdt_tron:
                summary: TRON 上的 USDT
                value:
                  chain: tron
                  to_address: TVJ6njG5Fyrq6XwYok3xPQx8kR7HQx6vXk
                  amount: '100.000000'
                  idempotency_key: withdrawal-2026-07-07-a
              usdc_eth:
                summary: Ethereum 上的 USDC
                value:
                  chain: eth
                  asset: USDC
                  to_address: '0x8f3Ba1c2De4567890aBcDeF1234567890aBcDeF1'
                  amount: '50.000000'
                  idempotency_key: withdrawal-usdc-2026-07-09-a
              btc_bitcoin:
                summary: Bitcoin 上的 BTC
                value:
                  chain: btc
                  to_address: bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t4
                  amount: '0.00050000'
                  idempotency_key: withdrawal-btc-2026-07-15-a
              travel_rule_self_hosted:
                summary: 超过 Travel Rule 阈值,转往自托管钱包
                value:
                  chain: tron
                  to_address: TVJ6njG5Fyrq6XwYok3xPQx8kR7HQx6vXk
                  amount: '1500.000000'
                  wallet_type: self_hosted
                  beneficiary_name: Maria Perez
                  idempotency_key: withdrawal-2026-07-12-a
              travel_rule_vasp:
                summary: 超过阈值,转往其他机构(travel address)
                value:
                  chain: tron
                  amount: '1500.000000'
                  travel_address: ta2AQSjBotWQf38c8sxYYK2KfisPoMsTPiYkviErEcoSn1uK
                  beneficiary_name: Maria Perez
                  idempotency_key: withdrawal-2026-07-12-b
      responses:
        '202':
          description: 提现已受理并广播中。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoWithdrawal'
              example: &id007
                withdrawal_id: 6c5d4e3f-2a1b-0c9d-8e7f-6a5b4c3d2e1f
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                idempotency_key: withdrawal-2026-07-07-a
                chain: tron
                asset: USDT
                to_address: TVJ6njG5Fyrq6XwYok3xPQx8kR7HQx6vXk
                amount: '100.000000'
                fee: '1.000000'
                total_debit: '101.000000'
                status: processing
                status_code: ''
                status_message: broadcasted
                tx_id: b1946ac92492d2347c6235b4d2611184e0f0f8c9d3a1e2b3c4d5e6f708192a3b
