      operationId: createSegregatedWalletSend
      summary: 从钱包发送加密货币
      description: '**从钱包本身**发送加密货币(真实源地址,由托管方签名)。必须提供 `idempotency_key`。gas 由客户承担:若钱包缺少原生 gas,发送会在任何扣费前以
        `422 insufficient_gas` 被拒。可能收取 `wallet_send` 费用(从账户账本结算余额,绝不动用钱包链上资金;若核心拒绝则退款)。需要已验证账户和 OTP。发生歧义失败时发送保持
        `pending`——用相同的键重试,绝不重复发送。'
      parameters:
      - name: walletID
