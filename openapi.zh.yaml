  /v1/rates/history:
    get:
      tags:
      - 余额
      operationId: getRatesHistory
      summary: 获取外汇汇率历史
      description: '适用于调用账户的外汇汇率时间序列,用于汇率演变图表。每个点携带你在该时刻操作会得到的相同汇率——`rate`(payout 侧)和 `payin_rate`(充值侧)——且每个国家块包含
        `first`、`last` 及二者之间带符号的 `change_pct`,可直接用于 "+3.4% / -3.0%" 徽章。`asset_prices` 携带 BTC 与 GOLD 的
        USD 参考序列。无数据的桶沿用前值;历史开始之前的日期会被省略(绝不虚构)。

        '
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: 开始日期(YYYY-MM-DD,UTC,含当日)。
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: 结束日期(YYYY-MM-DD,UTC,含当日)。
      - name: granularity
        in: query
        schema:
          type: string
          enum:
          - day
          - hour
          default: day
        description: 桶大小。`day` 最大范围 366 天,`hour` 最大 31 天。
      - name: currency
        in: query
        schema:
          type: string
        description: 可选的本地货币过滤(例如 CLP)。
      responses:
        '200':
          description: 每个国家的汇率序列,外加资产价格序列。
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  base:
                    type: string
                    example: USD
                  from:
                    type: string
                  to:
                    type: string
                  granularity:
                    type: string
                    example: day
                  rates:
                    type: object
                    description: 每个国家一条序列(键与 `GET /v1/rates` 相同)。
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: CLP
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                example: '2026-07-10'
                              rate:
                                type: string
                                description: 该桶的 payout 侧汇率。
                                example: '950.123456'
                              payin_rate:
                                type: string
                                description: 该桶的 payin 侧汇率。
                                example: '978.912345'
                        first:
                          type: string
                          description: 区间内第一个 payout 侧汇率。
                        last:
                          type: string
                          description: 区间内最后一个 payout 侧汇率。
                        change_pct:
                          type: string
                          nullable: true
                          description: 首→末的带符号百分比变化(前端可标记为绿/红)。
                  asset_prices:
                    type: object
                    description: BTC 与 GOLD 的 USD 参考价格序列(仅供展示)。
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: USD
                        unit:
                          type: string
                          example: gram
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                              price:
                                type: string
                        first:
                          type: string
                        last:
                          type: string
                        change_pct:
                          type: string
                          nullable: true
                  retrieved_at:
                    type: string
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                base: USD
                from: '2026-06-12'
                to: '2026-07-11'
