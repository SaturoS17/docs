    put:
      tags:
      - 账户
      operationId: updateSettlement
      summary: 设置我的默认余额(payouts 与 payins)
      description: 更改你的默认余额。`default_settlement_asset` 是当请求未显式传 `settlement_asset` 时,payout 和服务费默认扣款的余额。`default_payin_asset` 是 payins 默认入账的余额——入账仍以 USDT 进行,净额通过 swap 引擎按真实价格自动兑换,不收取额外 swap 价差(payin 已支付其手续费与汇率;checkout 与 POS 收款保留其链接资产)。可为 USDT、USDC、BTC 或 GOLD(需组织启用)。可发送其中一个或两个字段。仅对新操作生效;进行中的操作不会重新计价。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                default_settlement_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: payouts 与服务费默认扣款的余额。可选。
                default_payin_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: payins 默认入账的余额。入账仍以 USDT 进行,净额通过 swap 引擎按真实价格自动兑换(不收取额外 swap 价差)。可选。
            example:
              default_settlement_asset: BTC
              default_payin_asset: USDC
      responses:
        '200':
          description: 更新后的结算设置。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementSettings'
              example:
                default_settlement_asset: BTC
                default_payin_asset: USDC
                enabled_assets:
                - USDT
                - USDC
                - BTC
                - GOLD
                volatile_op_limit_usdt: '10000.000000'
                volatile_daily_limit_usdt: '50000.000000'
        '400':
          description: 资产无效或已停用(`invalid_settlement_asset`、`settlement_asset_disabled`)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: settlement_asset_disabled
                message: settlement asset is disabled for this organization
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
