        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - to_address
              - idempotency_key
              properties:
                asset:
                  type: string
                  enum:
                  - usdt
                  - usdc
                  - eth
                to_address:
                  type: string
                amount:
                  type: string
                  description: 以资产单位表示的十进制金额(使用此字段或 amount_raw)。
                amount_raw:
                  type: string
                  description: 以链上最小单位表示的金额。
