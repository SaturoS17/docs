webhooks:
  payin_credited:
    post:
      summary: payin 已入账
      description: '已收到一笔法币收款并以 USDT 入账到账户。对于通用收款链接(`kind: checkout`),载荷还携带
        `settled_via`(如 `qr`、`crypto:tron:usdt`、`cbpay`)、`settlement_asset` 与 `asset_amount`;加密货币支付附加
        `crypto_amount`,CBPay 应用支付附加 `transfer_id`、`asset` 与 `amount`。当账户配置了非 USDT 的
        `default_payin_asset` 时,载荷还携带入账后自动兑换的 `settlement_asset` 与 `conversion_status`。


        每次投递均包含 `X-Webhook-Event`、`X-Webhook-Event-ID`、`X-Webhook-Delivery-ID`、`X-Webhook-Timestamp` 和
        `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`。请返回 2xx;最多重试 5 次,间隔递增。'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payin_id: &id017
                  type: string
                account_id: *id017
                country: *id017
                currency: *id017
                local_amount: *id017
                fx_rate: *id017
                usdt_credited: *id017
                fee: *id017
                settlement_asset: *id017
                conversion_status: *id017
            example:
              payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              country: BO
              currency: BOB
              local_amount: '700.00'
              fx_rate: '6.91'
              usdt_credited: '100.302460'
              fee: '1.000000'
              settlement_asset: USDC
              conversion_status: done
      responses:
        '200':
          description: 返回任意 2xx 以确认投递。
  subscription_status_changed:
    post:
      summary: '订阅状态发生变化（active、paused、经催收后 past_due，或 canceled）。'
      requestBody:
        content:
          application/json:
            example:
              event_type: subscription_status_changed
              subscription_id: 7a1c9e2d-3b4f-5061-8273-9a4b5c6d7e8f
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              stored_card_id: 5f0f2c9e-6a4b-4c7e-9a1d-2b3c4d5e6f70
              status: past_due
              period: 3
              reason: dunning_exhausted
      responses:
        '200':
          description: ACK
  card_stored:
    post:
      summary: '付款人在托管收银台保存了卡片（在获批的 3-D Secure 种子支付上明确同意）。'
      requestBody:
        content:
          application/json:
            example:
              event_type: card_stored
              stored_card_id: 5f0f2c9e-6a4b-4c7e-9a1d-2b3c4d5e6f70
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              payer_reference: customer-1042
              brand: visa
              last4: '2701'
              country: BO
              currency: BOB
              seed_payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
      responses:
        '200':
          description: ACK
  stored_card_revoked:
    post:
      summary: '一张已保存的卡片被撤销（由你通过 DELETE /v1/stored-cards/{id} 操作）。'
      requestBody:
        content:
          application/json:
            example:
              event_type: stored_card_revoked
              stored_card_id: 5f0f2c9e-6a4b-4c7e-9a1d-2b3c4d5e6f70
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              payer_reference: customer-1042
              brand: visa
              last4: '2701'
      responses:
        '200':
          description: ACK
  payin_expired:
    post:
      summary: payin 已过期
      description: '一笔待支付的代收(二维码或托管 checkout)在未收到付款的情况下到达最终状态:payin 从 `pending` 变为 `expired`(或 `failed`)。不产生任何资金变动;如需重新收款请创建新的
        payin。


        每次投递均包含 `X-Webhook-Event`、`X-Webhook-Event-ID`、`X-Webhook-Delivery-ID`、`X-Webhook-Timestamp` 和
        `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`。请返回 2xx;最多重试 5 次,间隔递增。'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payin_id:
                  type: string
                account_id:
                  type: string
                status:
                  type: string
                  enum:
                  - expired
                  - failed
                country:
                  type: string
                currency:
                  type: string
                local_amount:
                  type: string
                reference:
                  type: string
            example:
              payin_id: 567d0d1a-49bc-437e-92e3-77e921112e49
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              status: expired
              country: BO
              currency: BOB
              local_amount: '60.99'
              reference: CBK7Q2M4XZ9P
      responses:
        '200':
          description: 返回任意 2xx 以确认投递。
  payout_status_changed:
